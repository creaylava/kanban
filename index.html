<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c8662f">
<title>🌰 栗子看板 · 手机版</title>
<style>
  :root{
    --bg:#f5f2ed; --list-bg:#e9e4db; --card-bg:#fff; --text:#2e2a26;
    --muted:#8c8377; --accent:#c8662f; --border:#e2dbd1; --input-bg:#fdfcfa;
    --sub-bg:#f9f6f2; --sub-border:#e8e0d5;
  }
  /* 跟随系统深色（当用户未手动指定时，由 JS 决定是否加 body.dark） */
  @media (prefers-color-scheme: dark){
    :root{
      --sys-dark:1;
    }
  }
  body.dark {
    --bg:#121212; --list-bg:#1e1e1e; --card-bg:#2d2d2d; --text:#e0e0e0;
    --muted:#9e9e9e; --accent:#e07b39; --border:#444444; --input-bg:#1e1e1e;
    --sub-bg:#222; --sub-border:#3a3a3a;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); display:flex; flex-direction:column;
    overflow:hidden; transition: background 0.25s, color 0.25s;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  header{
    display:flex; align-items:center; gap:6px; padding:8px 10px; background:var(--card-bg);
    border-bottom:1px solid var(--border); flex:0 0 auto; z-index:10; flex-wrap: wrap;
    box-shadow:0 2px 5px rgba(0,0,0,.05);
  }
  header h1{font-size:15px; margin:0; font-weight:700;}
  .logo{font-size:18px;}
  .spacer{flex:1;}
  .btn{
    border:1px solid var(--border); background:var(--card-bg); color:var(--text);
    padding:7px 11px; border-radius:8px; font-size:12.5px; cursor:pointer;
    font-family:inherit; transition:.15s; white-space:nowrap; min-height:34px;
  }
  .btn:hover{background:var(--list-bg);}
  .btn:active{transform:scale(.96);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.danger{color:#d0453a; border-color:#f0cfcc;}
  .btn.small{padding:6px 10px; font-size:12px;}
  .btn.icon{padding:6px 9px; font-size:15px;}

  .board-selector {
    padding:7px 10px; border:1px solid var(--border); border-radius:8px;
    background:var(--input-bg); color:var(--text); font-size:13px; outline:none;
    font-family:inherit; font-weight:600; max-width:150px;
  }
  #breadcrumb {
    display: flex; align-items: center; gap: 6px; padding: 8px 14px;
    background: var(--bg); font-size: 13px; color: var(--muted);
    border-bottom: 1px solid var(--border); display: none; flex-wrap:wrap;
  }
  #breadcrumb.show { display: flex; }
  #breadcrumb span { cursor: pointer; }
  #breadcrumb .current { color: var(--text); font-weight: 600; cursor: default; }
  #breadcrumb .arrow { color: var(--muted); cursor: default; }

  #board{
    flex:1; display:flex; gap:12px; padding:12px;
    overflow:auto; align-items:flex-start;
    scroll-snap-type: x proximity;
    -webkit-overflow-scrolling: touch;
  }
  .empty{margin:auto; color:var(--muted); font-size:14px;}
  .list{
    flex:0 0 300px; width:300px; background:var(--list-bg);
    border-radius:12px; display:flex; flex-direction:column; padding:4px;
    scroll-snap-align: start;
  }
  .list-header{display:flex; align-items:center; gap:4px; padding:8px 8px;}
  .list-title{
    font-weight:600; font-size:14px; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    border-radius:6px; padding:6px 6px; margin:-2px -4px; cursor: pointer; transition: background 0.15s;
  }
  .list-title::after {content: '✎'; font-size: 11px; color: var(--muted); margin-left: 6px; opacity: 0.4;}
  .list-count{font-size:12px; color:var(--muted); background:rgba(0,0,0,.06); border-radius:10px; padding:1px 7px; flex-shrink: 0;}
  .icon-btn{border:none; background:transparent; color:var(--muted); font-size:15px; cursor:pointer; padding:6px 8px; border-radius:6px; line-height:1; flex-shrink: 0; transition:.15s; min-height:32px;}
  .icon-btn:hover{background:rgba(208,69,58,.15); color:#d0453a;}
  .list-move-btn{border:none; background:transparent; color:var(--muted); font-size:13px; cursor:pointer; padding:4px 6px; border-radius:5px; line-height:1; flex-shrink:0; transition:.15s; opacity:.55; min-height:32px;}
  .list-move-btn.disabled{opacity:.15; cursor:default; pointer-events:none;}
  .cards{padding:2px 6px 0; min-height:12px;}
  .card{
    position:relative; overflow:hidden; background:var(--card-bg); border-radius:10px;
    padding:10px 12px 36px 12px; margin-bottom:8px; box-shadow:0 1px 2px rgba(0,0,0,.07);
    cursor:pointer; -webkit-touch-callout: none; user-select: none;
    display: flex; flex-direction: column;
  }
  .card:active{transform:scale(.99);}
  .card::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:transparent;}
  .card.p-high::before{background:#e2574c;}
  .card.p-medium::before{background:#e8a33d;}
  .card.p-low::before{background:#3f9d7c;}
  .card-title{font-size:14px; line-height:1.45; word-break:break-word;}
  .card-tags{display:flex; flex-wrap:wrap; gap:4px; margin-bottom:6px;}
  .tag{font-size:11px; padding:1px 7px; border-radius:6px; background:rgba(0,0,0,.05); color:var(--muted);}
  .card-meta{display:flex; align-items:center; gap:8px; margin-top:7px; font-size:11px; color:var(--muted); flex-wrap: wrap;}
  .due.overdue{color:#d0453a; font-weight:600;}
  .pri{font-size:11px; padding:1px 6px; border-radius:6px; background:rgba(0,0,0,.05);}
  .pri.high{color:#e2574c;} .pri.medium{color:#d08a1e;} .pri.low{color:#3f9d7c;}
  .card-indicators {display: flex; gap: 8px; margin-top: 6px; font-size: 11px; color: var(--muted); align-items: center; flex-wrap: wrap;}
  .indicator { display: inline-flex; align-items: center; gap: 3px; }
  .indicator.checked { color: var(--accent); }
  .card-footer {position: absolute; bottom: 6px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: center; gap:6px;}
  .footer-left, .footer-right { display: flex; gap: 5px; }
  .action-btn {background: rgba(100,100,100,.08); color: var(--muted); border: none; font-size: 13px; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: .15s; min-height:32px;}
  .action-btn:active { background: var(--accent); color: #fff; }
  .quick-move-btn {background: rgba(200,102,47,.1); color: var(--accent); border: none; font-size: 13px; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-weight: bold; min-height:32px;}
  .quick-move-btn:active { background: var(--accent); color: #fff; }
  .expand-sub-btn {background: rgba(100,100,100,.08); color: var(--muted); border: none; font-size: 12px; padding: 4px 8px; border-radius: 6px; cursor: pointer; min-height:32px;}
  .expand-sub-btn.expanded { background: var(--accent); color: #fff; }
  .preview-sub-btn {background: rgba(59,130,246,.1); color: #3b82f6; border: none; font-size: 12px; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-weight: bold; min-height:32px;}
  .preview-sub-btn:active { background: #3b82f6; color: #fff; }

  /* 子卡片 */
  .sub-board-preview {margin-top: 10px; padding: 8px; background: var(--sub-bg); border-radius: 8px; border: 1px solid var(--sub-border);}
  .sub-board-preview .sub-list-title {font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px;}
  .sub-board-preview .sub-card-item {
    font-size: 13px; padding: 8px 8px; background: var(--card-bg);
    border-radius: 6px; margin-bottom: 5px; border: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center; gap:6px;
  }
  .sub-card-title { flex: 1; overflow: hidden; word-break: break-word; cursor:pointer; }
  .del-sub-card-btn {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 15px; padding: 4px 8px; line-height: 1; flex-shrink: 0;
    border-radius: 4px; transition: .15s; min-height:32px; min-width:32px;
  }
  .del-sub-card-btn:active { background: #d0453a; color: #fff; }
  .star-btn { background:none; border:none; cursor:pointer; font-size:15px; padding:0 4px; flex-shrink:0; line-height:1; filter:grayscale(1) opacity(.35); transition:.15s; min-height:32px; min-width:32px;}
  .star-btn.starred { filter:none; opacity:1; }
  .card-star { color:#e53e3e; margin-right:3px; }
  .sub-board-preview .empty-sub {font-size: 12px; color: var(--muted); font-style: italic;}

  /* 悬停预览仅在桌面显示 */
  @media (hover:none){
    #subCardTooltip { display:none !important; }
  }
  #subCardTooltip {
    position: fixed; z-index: 300; pointer-events: none;
    background: var(--card-bg); border: 1px solid var(--accent);
    border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,.18);
    padding: 12px 14px; max-width: 320px; min-width: 180px;
    font-size: 13px; line-height: 1.5; display: none;
    transition: opacity .15s; opacity: 0;
  }
  #subCardTooltip.show { display: block; opacity: 1; }
  .sct-title { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
  .sct-meta { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .sct-desc { font-size: 12px; margin-bottom: 6px; white-space: pre-line; word-break: break-word; max-height: 60px; overflow: hidden; }
  .sct-tags { margin-bottom: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
  .sct-section { font-size: 11px; font-weight: 600; color: var(--muted); margin: 6px 0 3px; }
  .sct-check { font-size: 11px; padding: 1px 0; }
  .sct-check.done { text-decoration: line-through; color: var(--muted); }
  .sct-att { font-size: 11px; padding: 1px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sct-note { font-size: 11px; color: var(--muted); padding: 1px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sct-sub { font-size: 11px; color: var(--accent); margin-top: 4px; }
  .sct-empty { font-size: 11px; color: var(--muted); font-style: italic; }

  /* 列表底部按钮 */
  .list-bottom-actions { display: flex; gap: 4px; margin: 6px; align-items: center; }
  .add-card-btn{
    flex: 1; padding:10px 8px; border:none; background:transparent; color:var(--muted); text-align:left; border-radius:8px;
    cursor:pointer; font-size:13px; font-family: inherit; min-height:38px;
  }
  .add-card-btn:active{background:rgba(0,0,0,.06); color:var(--text);}
  .add-template-btn {
    padding: 8px 10px; border: none; background: rgba(59,130,246,.1); color: #3b82f6;
    border-radius: 8px; cursor: pointer; font-size: 13px; font-family: inherit;
    white-space: nowrap; min-height:38px;
  }
  .add-template-btn:active { background: #3b82f6; color: #fff; }

  .composer{padding-bottom:8px;}
  .composer textarea{width:100%; height:62px; resize:none; border:1px solid var(--accent); border-radius:10px; padding:8px 10px; font-size:15px; font-family:inherit; outline:none; background:var(--card-bg); color:var(--text);}
  .add-list-btn {flex:0 0 80px; width:80px; height:48px; border:2px dashed var(--border); background:transparent; border-radius:12px; color:var(--muted); cursor:pointer; font-size:13px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:4px; margin-top:4px;}
  .add-list-btn:active {border-color: var(--accent); color: var(--accent);}

  /* 弹窗（手机端底部弹起） */
  .overlay{position:fixed; inset:0; background:rgba(30,25,20,.55); display:none; align-items:center; justify-content:center; z-index:100; padding:16px;}
  .overlay.show{display:flex;}
  .modal{background:var(--card-bg); border-radius:14px; width:100%; max-width:560px; padding:18px; box-shadow:0 20px 60px rgba(0,0,0,.3); max-height:90vh; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .m-title{font-size:16px; font-weight:600; margin-bottom:12px; resize:none; overflow:hidden; min-height:28px; line-height:1.4; border:1px solid var(--border); border-radius:6px; background:var(--input-bg); color:var(--text); padding:8px 10px; font-family:inherit; outline:none; }
  .m-title:focus{border-color:var(--accent);}
  .modal textarea{width:100%; height:80px; resize:vertical; margin-bottom:12px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px; font-weight:600;}
  .modal input, .modal select, .modal textarea {width:100%; border:1px solid var(--border); border-radius:8px; padding:10px 12px; font-size:15px; font-family:inherit; color:var(--text); background:var(--input-bg); outline:none;}
  .modal input:focus, .modal select:focus, .modal textarea:focus {border-color:var(--accent); background:var(--card-bg);}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .modal-actions{display:flex; gap:8px; margin-top:12px; align-items:center; flex-wrap:wrap;}
  .modal-actions .btn {min-height:40px; font-size:13px;}

  .checklist-container {border: 1px solid var(--border); border-radius: 8px; padding: 8px; background: var(--input-bg); max-height: 180px; overflow-y: auto; margin-bottom: 8px;}
  .checklist-item {display: flex; align-items: center; gap: 6px; margin-bottom: 6px;}
  .checklist-item input[type="checkbox"] {width: 20px; height: 20px; flex-shrink: 0; cursor: pointer; accent-color: var(--accent);}
  .checklist-item input[type="text"] {flex: 1; padding: 8px 8px; font-size: 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text);}
  .checklist-item .remove-item {color: #d0453a; background: none; border: none; font-size: 18px; cursor: pointer; padding: 0 6px; flex-shrink: 0; min-height:32px;}

  .attachment-actions {display: flex; gap: 8px; margin-bottom: 8px;}
  .attachment-actions .btn {flex:1; padding:12px; font-size:14px; min-height:44px;}
  .attachments-container {border: 1px solid var(--border); border-radius: 8px; padding: 8px; background: var(--input-bg); max-height: 300px; overflow-y: auto;}
  .attachment-item {display: flex; align-items: center; gap: 8px; padding: 8px; margin-bottom: 6px; background: var(--card-bg); border-radius: 6px; border: 1px solid var(--border); flex-wrap:wrap;}
  .attachment-item .file-icon {font-size: 20px; flex-shrink: 0; width: 24px; text-align: center;}
  .attachment-item .file-info {flex: 1; min-width: 0;}
  .attachment-item .file-name {font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}
  .attachment-item .file-size {font-size: 11px; color: var(--muted); margin-top: 2px;}
  .attachment-item .file-size.link-tag {color: var(--accent);}
  .attachment-item .file-actions {display: flex; gap: 4px; flex-shrink: 0;}
  .attachment-item .file-actions button {background: rgba(100,100,100,.08); color: var(--muted); border: none; font-size: 14px; padding: 6px 10px; border-radius: 6px; cursor: pointer; min-height:36px;}
  .attachment-item .file-actions button:active {background: var(--accent); color: #fff;}
  .attachment-item .file-actions button.remove-btn:active {background: #d0453a; color: #fff;}
  .attachment-item .file-thumb {width: 44px; height: 44px; border-radius: 6px; object-fit: cover; flex-shrink: 0; border: 1px solid var(--border); cursor: pointer;}
  .att-note-row { width:100%; margin-top:4px; }
  .att-note-row input { width:100%; border:1px solid var(--border); border-radius:5px; background:var(--input-bg); color:var(--text); padding:8px 10px; font-size:13px; font-family:inherit; outline:none; }
  .attachment-empty {font-size: 13px; color: var(--muted); font-style: italic; text-align: center; padding: 10px;}
  .attachment-hint {font-size: 11px; color: var(--muted); margin-top: 6px; line-height: 1.5;}

  /* 笔记 */
  .note-block {border: 1px solid var(--border); border-radius: 10px; padding: 12px; background: var(--sub-bg); margin-bottom: 10px;}
  .note-block-header {display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;}
  .note-block-header .note-label {font-size: 12px; color: var(--muted); font-weight: 600;}
  .note-block-header .note-remove {background: none; border: none; color: #d0453a; font-size: 18px; cursor: pointer; padding: 4px 8px; border-radius: 4px; min-height:36px;}
  .note-block textarea {width: 100%; min-height: 70px; resize: vertical; border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-size: 14px; font-family: inherit; background: var(--card-bg); color: var(--text); outline: none; line-height: 1.5;}
  .note-att-actions {display: flex; gap: 8px; margin-top: 8px;}
  .note-att-actions .btn {flex:1; min-height:40px; font-size:13px;}

  /* 拖拽高亮（桌面） */
  .drag-over { outline: 2px dashed var(--accent) !important; outline-offset: -2px; background: rgba(200,102,47,.06) !important; }

  /* 预览中的笔记 */
  .card-preview-note {border: 1px solid var(--sub-border); border-radius: 8px; padding: 10px; background: var(--sub-bg); margin-bottom: 8px;}
  .card-preview-note-text {font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; margin-bottom: 6px;}
  .card-preview-note-att {display: flex; align-items: center; gap: 6px; padding: 8px 10px; background: var(--card-bg); border-radius: 6px; border: 1px solid var(--border); margin-bottom: 4px; cursor: pointer; font-size: 12px;}
  .card-preview-note-att .att-name {flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}
  .card-preview-note-att .att-size {font-size: 10px; color: var(--muted); flex-shrink: 0;}

  #addLinkOverlay {align-items: center; padding: 16px; z-index: 150;}
  #addLinkModal {background: var(--card-bg); border-radius: 14px; width: 100%; max-width: 440px; padding: 20px;}
  #addLinkModal h3 {font-size: 16px; margin-bottom: 15px; text-align: center;}

  #quickMoveOverlay {align-items: flex-end; padding: 0;}
  #quickMoveMenu {background: var(--card-bg); width: 100%; border-radius: 16px 16px 0 0; padding: 20px; box-shadow: 0 -5px 20px rgba(0,0,0,.2); max-height: 80vh; overflow-y: auto;}
  #quickMoveMenu h3 {font-size: 16px; margin-bottom: 15px; text-align: center; color: var(--muted);}
  .move-option {display: block; width: 100%; padding: 14px; margin-bottom: 8px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 10px; font-size: 15px; cursor: pointer; text-align: center; min-height:48px;}
  .move-option:active {background: var(--accent); color: #fff; border-color: var(--accent);}

  #renameListOverlay {align-items: center; padding: 16px;}
  #renameListModal {background: var(--card-bg); border-radius: 14px; width: 100%; max-width: 400px; padding: 20px;}
  .rename-actions {display: flex; gap: 10px;}
  .rename-actions .btn {flex:1; min-height:44px;}

  /* 模板弹窗 */
  #templateOverlay {align-items: center; justify-content: center; padding: 16px;}
  #templateModal {background: var(--card-bg); border-radius: 16px; width: 100%; max-width: 500px; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden;}
  #templateHeader {padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px;}
  #templateHeader h2 {font-size: 16px; font-weight: 700; flex: 1;}
  #templateHeader .template-close {background: none; border: none; font-size: 24px; color: var(--muted); cursor: pointer; padding: 4px 8px; line-height: 1; min-height:36px;}
  #templateBody {flex: 1; overflow-y: auto; padding: 12px 16px 16px;}
  .template-item {padding: 12px; margin-bottom: 8px; background: var(--sub-bg); border: 1px solid var(--sub-border); border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 10px;}
  .template-item:active {border-color: var(--accent);}
  .template-item .tpl-icon {font-size: 22px; flex-shrink: 0;}
  .template-item .tpl-info {flex: 1; min-width: 0;}
  .template-item .tpl-name {font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}
  .template-item .tpl-meta {font-size: 11px; color: var(--muted); margin-top: 2px;}
  .template-item .tpl-del {background: rgba(208,69,58,.1); color: #d0453a; border: none; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 14px; flex-shrink: 0;}
  .template-empty {text-align: center; padding: 40px 20px; color: var(--muted); font-size: 13px; line-height: 2;}

  /* 附件预览 */
  #previewOverlay {background: rgba(0,0,0,.94); align-items: center; justify-content: center; z-index: 220; padding: 0;}
  #previewOverlay .preview-toolbar {position: absolute; top: 0; left: 0; right: 0; padding: 12px 14px; display: flex; align-items: center; gap: 10px; color: #fff; font-size: 13px; z-index: 2; background: linear-gradient(to bottom, rgba(0,0,0,.75), transparent); padding-top: calc(12px + env(safe-area-inset-top));}
  #previewOverlay .preview-title {flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600;}
  #previewOverlay .preview-btn {background: rgba(255,255,255,.15); color: #fff; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center;}
  #previewOverlay .preview-btn:active {background: rgba(255,255,255,.35);}
  #previewContent {width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;}
  #previewContent iframe {width: 100%; height: 100%; background: #fff; border: none;}
  #previewContent img {max-width: 95%; max-height: 88vh; object-fit: contain;}

  /* 子看板预览 */
  #subPreviewOverlay {align-items: center; justify-content: center; padding: 16px;}
  #subPreviewModal {background: var(--card-bg); border-radius: 16px; width: 100%; max-width: 640px; max-height: 88vh; display: flex; flex-direction: column; overflow: hidden;}
  #subPreviewHeader {padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; flex-wrap:wrap;}
  #subPreviewHeader h2 {font-size: 15px; font-weight: 700; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width:120px;}
  #subPreviewHeader .sub-preview-close {background: none; border: none; font-size: 24px; color: var(--muted); cursor: pointer; padding: 4px 8px; line-height: 1; min-height:36px;}
  #subPreviewBody {flex: 1; overflow-y: auto; padding: 12px 16px 20px; -webkit-overflow-scrolling: touch;}
  .sub-preview-list {margin-bottom: 16px;}
  .sub-preview-list-title {font-size: 13px; font-weight: 700; padding: 6px 0; display: flex; align-items: center; gap: 6px;}
  .sub-preview-list-count {font-size: 11px; color: var(--muted); background: rgba(0,0,0,.06); padding: 1px 7px; border-radius: 10px; font-weight: 600;}
  .sub-preview-card {padding: 12px; margin-bottom: 8px; background: var(--sub-bg); border: 1px solid var(--sub-border); border-radius: 8px; cursor: pointer;}
  .sub-preview-card:active {border-color: var(--accent);}
  .sub-preview-card-title {font-size: 13px; font-weight: 600; margin-bottom: 4px; display: flex; align-items: center; gap: 6px;}
  .priority-dot {width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;}
  .priority-dot.high { background: #e2574c; }
  .priority-dot.medium { background: #e8a33d; }
  .priority-dot.low { background: #3f9d7c; }
  .sub-preview-card-desc {font-size: 11px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}
  .sub-preview-card-meta {display: flex; gap: 10px; margin-top: 6px; font-size: 10px; color: var(--muted); flex-wrap: wrap;}
  .sub-preview-empty {font-size: 12px; color: var(--muted); font-style: italic; text-align: center; padding: 30px 10px;}

  /* 卡片详情预览 */
  #cardPreviewOverlay {align-items: center; justify-content: center; padding: 16px;}
  #cardPreviewModal {background: var(--card-bg); border-radius: 16px; width: 100%; max-width: 560px; max-height: 88vh; display: flex; flex-direction: column; overflow: hidden;}
  .card-preview-header {padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px;}
  .card-preview-header h2 {font-size: 15px; font-weight: 700; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}
  .card-preview-close {background: none; border: none; font-size: 24px; color: var(--muted); cursor: pointer; padding: 4px 8px; line-height: 1; min-height:36px;}
  #cardPreviewBody {flex: 1; overflow-y: auto; padding: 16px 18px 20px; -webkit-overflow-scrolling: touch;}
  .card-preview-tags {display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px;}
  .card-preview-meta {display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-bottom: 12px; align-items: center;}
  .card-preview-desc {font-size: 13px; line-height: 1.6; padding: 10px 12px; background: var(--sub-bg); border-radius: 8px; border: 1px solid var(--sub-border); margin-bottom: 14px; white-space: pre-wrap; word-break: break-word;}
  .card-preview-section-title {font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 8px; display: flex; align-items: center; gap: 6px;}
  .card-preview-check-item {display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 13px;}
  .card-preview-check-item .check-icon {width: 18px; height: 18px; border-radius: 4px; border: 1.5px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 11px; flex-shrink: 0; color: transparent;}
  .card-preview-check-item.done .check-icon {background: var(--accent); border-color: var(--accent); color: #fff;}
  .card-preview-check-item.done .check-text {text-decoration: line-through; color: var(--muted);}
  .card-preview-att-item {display: flex; align-items: center; gap: 8px; padding: 10px; background: var(--sub-bg); border: 1px solid var(--sub-border); border-radius: 8px; margin-bottom: 6px; cursor: pointer; flex-wrap:wrap;}
  .card-preview-att-item .att-icon {font-size: 18px; flex-shrink: 0; width: 24px; text-align: center;}
  .card-preview-att-item .att-info {flex: 1; min-width: 0;}
  .card-preview-att-item .att-name {font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}
  .card-preview-att-item .att-size {font-size: 10px; color: var(--muted); margin-top: 2px;}
  .card-preview-att-item .att-action {color: var(--muted); font-size: 12px;}
  .card-preview-att-item .att-note {width:100%; font-size:11px; color:var(--muted); margin-top:3px; font-style:italic; word-break:break-word;}
  .card-preview-subboard-btn {display: block; width: 100%; padding: 14px; margin-top: 6px; background: rgba(59,130,246,.1); color: #3b82f6; border: 1px solid #3b82f6; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 700; font-family: inherit; min-height:48px;}
  .card-preview-empty {font-size: 12px; color: var(--muted); font-style: italic; padding: 4px 0;}

  #loadingOverlay {position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 999; color: #fff; font-size: 16px;}
  #loadingOverlay.show {display: flex;}
  #loadingOverlay .spinner {width: 24px; height: 24px; border: 3px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 12px;}
  @keyframes spin {to {transform: rotate(360deg);}}

  /* 剪贴板 */
  #pinboard { padding:0 12px; flex-shrink:0; max-width:100%; box-sizing:border-box; }
  .pin-header { display:flex; align-items:center; gap:8px; cursor:pointer; padding:8px 0; user-select:none; }
  .pin-toggle { font-size:13px; font-weight:600; color:var(--muted); }
  .pin-collapse { font-size:12px; color:var(--muted); transition:transform .2s; }
  .pin-body.collapsed { display:none; }
  .pin-hint { font-size:11px; color:var(--muted); margin-bottom:6px; }
  .pin-list { display:flex; flex-direction:column; gap:10px; }
  .pin-item { display:flex; gap:10px; background:var(--list-bg); border-radius:10px; padding:10px; width:100%; position:relative; }
  .pin-thumb { flex-shrink:0; width:72px; height:72px; border-radius:8px; overflow:hidden; cursor:pointer; border:1px solid var(--border); }
  .pin-thumb img { width:100%; height:100%; object-fit:cover; }
  .pin-note { flex:1; min-width:0; display:flex; flex-direction:column; }
  .pin-note textarea { width:100%; flex:1; border:1px solid var(--border); border-radius:6px; background:var(--input-bg); color:var(--text); padding:8px 10px; font-size:13px; font-family:inherit; resize:vertical; outline:none; min-height:44px; }
  .pin-del { position:absolute; top:6px; right:6px; background:rgba(0,0,0,.55); color:#fff; border:none; border-radius:50%; width:28px; height:28px; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; line-height:1; }
  .pin-item.collapsed { padding:6px 10px; align-items:center; }
  .pin-item.collapsed .pin-thumb,
  .pin-item.collapsed .pin-note { display:none; }
  .pin-item.collapsed .pin-del { top:50%; transform:translateY(-50%); right:6px; }
  .pin-fold-btn { background:none; border:none; color:var(--muted); cursor:pointer; font-size:13px; padding:4px 6px; flex-shrink:0; border-radius:4px; min-height:36px;}
  .pin-summary { display:none; font-size:13px; cursor:pointer; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pin-item.collapsed .pin-summary { display:block; }
  .pin-drop-zone { border:2px dashed var(--border); border-radius:10px; padding:14px; text-align:center; color:var(--muted); font-size:12px; cursor:pointer; min-height:48px; display:flex; align-items:center; justify-content:center; gap:4px; }
  .pin-drop-zone:active { border-color:var(--accent); background:rgba(200,102,47,.06); }

  /* 看板链接 */
  .board-links { margin-top:10px; }
  .board-links-title { font-size:12px; font-weight:600; color:var(--muted); margin-bottom:4px; }
  .board-link-add { display:flex; gap:6px; margin-bottom:6px; flex-wrap:wrap; }
  .board-link-add input { flex:1; min-width:80px; border:1px solid var(--border); border-radius:6px; background:var(--input-bg); color:var(--text); padding:8px 10px; font-size:13px; font-family:inherit; outline:none; }
  .board-link-add input:focus { border-color:var(--accent); }
  .board-link-add button { flex-shrink:0; min-height:38px; padding:8px 14px; }
  .board-link-list { display:flex; flex-direction:column; gap:4px; }
  .board-link-item { display:flex; align-items:flex-start; gap:6px; padding:8px 10px; background:var(--list-bg); border-radius:8px; font-size:13px; position:relative; }
  .board-link-item a { color:var(--accent); text-decoration:none; word-break:break-all; flex:1; min-width:0; }
  .board-link-del { background:none; border:none; color:var(--muted); cursor:pointer; font-size:15px; padding:2px 6px; flex-shrink:0; border-radius:4px; min-height:32px;}

  /* 星标/到期提醒面板 */
  .star-reminder, .due-reminder { position:relative; }
  .star-reminder-btn { color:#e53e3e; }
  .due-reminder-btn { color:#e8a33d; }
  .star-badge, .due-badge {
    position:absolute; top:-4px; right:-6px; color:#fff;
    font-size:10px; font-weight:700; min-width:16px; height:16px; line-height:16px;
    border-radius:8px; text-align:center; padding:0 4px; pointer-events:none;
  }
  .star-badge { background:#e53e3e; }
  .due-badge { background:#e8a33d; }
  .star-panel, .due-panel {
    display:none; position:fixed; top:60px; right:12px; left:12px; z-index:200;
    background:var(--card-bg); border:1px solid var(--border); border-radius:12px;
    box-shadow:0 8px 32px rgba(0,0,0,.2); max-height:70vh; overflow-y:auto;
  }
  .star-panel.show, .due-panel.show { display:block; }
  .star-panel-title, .due-panel-title { font-size:13px; font-weight:700; padding:12px 14px 8px; border-bottom:1px solid var(--border); }
  .star-panel-empty, .due-panel-empty { font-size:12px; color:var(--muted); padding:16px; text-align:center; font-style:italic; }
  .star-panel-group { padding:4px 0; }
  .star-panel-board { font-size:11px; font-weight:600; color:var(--muted); padding:6px 14px 2px; }
  .star-panel-item { display:flex; align-items:center; gap:8px; padding:10px 14px; cursor:pointer; font-size:13px; }
  .star-panel-item .spi-star { color:#e53e3e; flex-shrink:0; }
  .star-panel-item .spi-title { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .star-panel-item .spi-path { font-size:10px; color:var(--muted); flex-shrink:0; max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .due-panel-group { padding:4px 0; border-bottom:1px solid var(--border); }
  .due-panel-group:last-child { border-bottom:none; }
  .due-panel-group-title { font-size:11px; font-weight:600; color:var(--muted); padding:6px 14px 2px; }
  .due-panel-item { display:flex; align-items:center; gap:8px; padding:10px 14px; cursor:pointer; font-size:13px; }
  .due-panel-item .dpi-title { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .due-panel-item .dpi-date { font-size:11px; flex-shrink:0; font-weight:600; }
  .due-panel-item .dpi-date.overdue { color:#d0453a; }
  .due-panel-item .dpi-date.today { color:#e53e3e; }
  .due-panel-item .dpi-date.soon { color:#e8a33d; }
  .due-panel-item .dpi-board { font-size:10px; color:var(--muted); flex-shrink:0; max-width:80px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* ========== 移动端专用 ========== */
  @media (max-width: 768px){
    header { padding: 8px 8px; gap: 5px; }
    .brand-text { display:none; }
    header .btn { padding:6px 9px; font-size:11.5px; min-height:34px; }
    .board-selector { max-width:100px; font-size:12px; padding:6px 8px; }
    #board { padding:10px; gap:10px; }
    .list { flex:0 0 86vw; width:86vw; max-width:340px; }
    .list-header { padding:6px; }
    .card { padding:10px 12px 42px 12px; }
    .card-footer { bottom:8px; }
    .action-btn, .quick-move-btn, .expand-sub-btn, .preview-sub-btn {
      padding:6px 10px; font-size:12px; min-height:34px;
    }

    /* 弹窗底部弹起 */
    .overlay { padding:0; align-items:flex-end; }
    .modal, #templateModal, #subPreviewModal, #cardPreviewModal, #addLinkModal, #renameListModal {
      max-width:100%; width:100%;
      border-radius:16px 16px 0 0;
      max-height:94vh;
      padding:18px;
    }
    #templateModal, #subPreviewModal, #cardPreviewModal {
      padding:0; max-height:94vh;
    }
    #templateModal #templateHeader,
    #subPreviewModal #subPreviewHeader,
    #cardPreviewModal .card-preview-header {
      padding:14px 16px; padding-top: calc(14px + env(safe-area-inset-top,0));
    }
    #quickMoveMenu { border-radius:16px 16px 0 0; }

    /* 防止 iOS 自动缩放 */
    .modal input, .modal select, .modal textarea,
    .m-title, .note-block textarea,
    .checklist-item input[type="text"],
    .board-link-add input, .att-note-row input,
    .pin-note textarea { font-size:16px !important; }

    .modal-actions .btn { flex:1; min-height:44px; font-size:13.5px; }
    .modal-actions .btn.danger,
    .modal-actions .btn#mSaveAsTemplate { flex:0 0 auto; min-width:auto; padding:10px 12px;}
    .grid2 { grid-template-columns:1fr 1fr; gap:10px; }

    .attachment-actions .btn { padding:14px 12px; font-size:14px; min-height:48px; }

    .star-panel, .due-panel { top:56px; right:8px; left:8px; max-height:75vh;}
  }

  @media (max-width: 400px){
    .list { flex:0 0 90vw; width:90vw; }
    .grid2 { grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<header>
  <span class="logo">🌰</span>
  <span class="brand-text" style="font-weight:700;font-size:14px;">栗子看板</span>
  <select class="board-selector" id="boardSelect"></select>
  <button class="btn primary small" id="addBoardBtn" title="新建看板">＋</button>
  <button class="btn small" id="renameBoardBtn" title="重命名看板">✎</button>
  <div class="spacer"></div>
  <button class="btn primary small" id="addListBtn" title="新建列表">＋列表</button>
  <button class="btn small" id="menuBtn" title="更多">☰</button>
  <button class="btn small" id="themeToggle" title="切换主题">🌙</button>
  <div class="due-reminder" id="dueReminder" style="position:relative;">
    <button class="btn small due-reminder-btn" id="dueReminderBtn" title="到期提醒">⏰<span class="due-badge" id="dueBadge" style="display:none;">0</span></button>
  </div>
  <div class="star-reminder" id="starReminder" style="position:relative;">
    <button class="btn small star-reminder-btn" id="starReminderBtn" title="星标">★<span class="star-badge" id="starBadge" style="display:none;">0</span></button>
  </div>
</header>

<div id="breadcrumb"></div>

<div id="pinboard">
  <div class="pin-header" id="pinHeader">
    <span class="pin-toggle" id="pinToggleLabel">📋 剪贴板</span>
    <span class="pin-collapse" id="pinCollapseBtn">▼</span>
  </div>
  <div class="pin-body collapsed" id="pinBody">
    <div class="pin-hint">点击下方按钮选择图片</div>
    <div class="pin-list" id="pinList"></div>
    <div class="pin-drop-zone" id="pinDropZone">
      📷 选择图片
      <input type="file" id="pinFileInput" accept="image/*" multiple style="display:none;">
    </div>
    <div class="board-links">
      <div class="board-links-title">🔗 链接</div>
      <div class="board-link-add">
        <input type="text" id="linkTitleInput" placeholder="名称（可选）">
        <input type="text" id="linkUrlInput" placeholder="粘贴链接地址…">
        <button class="btn small primary" id="addLinkBtn">＋</button>
      </div>
      <div class="board-link-list" id="boardLinkList"></div>
    </div>
  </div>
</div>

<main id="board"></main>

<!-- 卡片编辑弹窗 -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div style="display:flex;align-items:flex-start;gap:6px;margin-bottom:12px;">
      <textarea id="mTitle" class="m-title" placeholder="卡片标题（Ctrl+Enter 换行）" rows="1" style="flex:1;margin:0;"></textarea>
      <button type="button" class="star-btn" id="mStarBtn" title="标记星标" style="font-size:24px;padding:4px 8px;">★</button>
    </div>
    <textarea id="mDesc" placeholder="添加更详细的描述…"></textarea>

    <div class="field">
      <label>笔记</label>
      <div class="notes-section" id="notesContainer"></div>
      <button type="button" class="btn small" id="addNoteBtn">＋ 新建笔记块</button>
    </div>

    <div class="field">
      <label>待办清单</label>
      <div class="checklist-container" id="checklistContainer"></div>
      <button type="button" class="btn small" id="addChecklistBtn">＋ 添加待办</button>
    </div>

    <div class="field">
      <label>附件（本地 ≤ 200KB，或外链）</label>
      <div class="attachment-actions">
        <button type="button" class="btn small primary" id="addAttachmentBtn">📎 选择文件</button>
        <button type="button" class="btn small" id="addExtLinkBtn">🔗 外链</button>
      </div>
      <div class="attachments-container" id="attachmentsContainer"></div>
      <div class="attachment-hint">
        📌 大文件建议放 OneDrive，用「🔗 外链」贴进来。
      </div>
      <input type="file" id="attachmentFileInput" multiple style="display:none;">
    </div>

    <div class="field">
      <label>所属列表</label>
      <select id="mList"></select>
    </div>
    <div class="field">
      <label>标签</label>
      <input id="mTags" placeholder="用逗号分隔">
    </div>
    <div class="grid2">
      <div class="field">
        <label>优先级</label>
        <select id="mPriority">
          <option value="none">无</option> <option value="low">低</option>
          <option value="medium">中</option> <option value="high">高</option>
        </select>
      </div>
      <div class="field">
        <label>截止日期</label>
        <input type="date" id="mDue">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn danger" id="mDelete">删除</button>
      <button class="btn" id="mSaveAsTemplate" title="存为模板">📋</button>
      <div class="spacer"></div>
      <button class="btn primary" id="mEnterSubBoard" style="display:none;">子看板</button>
      <button class="btn" id="mCancel">取消</button>
      <button class="btn primary" id="mSave">保存</button>
    </div>
  </div>
</div>

<div class="overlay" id="quickMoveOverlay">
  <div id="quickMoveMenu">
    <h3>移动到列表</h3>
    <div id="quickMoveList"></div>
    <button class="btn danger" id="quickMoveCancel" style="width:100%; margin-top:10px;">取消</button>
  </div>
</div>

<div class="overlay" id="renameListOverlay">
  <div id="renameListModal">
    <h3 style="margin-bottom:14px;text-align:center;font-size:15px;">重命名列表</h3>
    <input id="renameListInput" placeholder="输入新名称" style="width:100%;border:1px solid var(--border);border-radius:8px;padding:12px;font-size:15px;background:var(--input-bg);color:var(--text);margin-bottom:14px;">
    <div class="rename-actions">
      <button class="btn" id="renameListCancel">取消</button>
      <button class="btn primary" id="renameListConfirm">确定</button>
    </div>
  </div>
</div>

<div class="overlay" id="addLinkOverlay">
  <div id="addLinkModal">
    <h3>🔗 添加外链</h3>
    <div class="field">
      <label>链接名称</label>
      <input id="linkName" placeholder="例如：阀门图纸">
    </div>
    <div class="field">
      <label>链接地址</label>
      <input id="linkUrl" placeholder="https://..." type="url">
    </div>
    <div class="rename-actions">
      <button class="btn" id="addLinkCancel">取消</button>
      <button class="btn primary" id="addLinkConfirm">添加</button>
    </div>
  </div>
</div>

<div class="overlay" id="templateOverlay">
  <div id="templateModal">
    <div id="templateHeader">
      <span style="font-size:20px;">📋</span>
      <h2>从模板创建</h2>
      <button class="template-close" id="templateCloseBtn">✕</button>
    </div>
    <div id="templateBody"></div>
  </div>
</div>

<div class="overlay" id="previewOverlay">
  <div class="preview-toolbar">
    <div class="preview-title" id="previewTitle"></div>
    <button class="preview-btn" id="previewNewTabBtn" title="新标签页">↗</button>
    <button class="preview-btn" id="previewDownloadBtn" title="下载">⬇</button>
    <button class="preview-btn" id="closePreviewBtn" title="关闭">✕</button>
  </div>
  <div id="previewContent"></div>
</div>

<div class="overlay" id="subPreviewOverlay">
  <div id="subPreviewModal">
    <div id="subPreviewHeader">
      <span style="font-size:20px;">📁</span>
      <h2 id="subPreviewTitle">子看板</h2>
      <button class="btn small primary" id="subPreviewEnterBtn">进入</button>
      <button class="sub-preview-close" id="subPreviewCloseBtn">✕</button>
    </div>
    <div id="subPreviewBody"></div>
  </div>
</div>

<div class="overlay" id="cardPreviewOverlay">
  <div id="cardPreviewModal">
    <div class="card-preview-header">
      <span style="font-size:20px;">📋</span>

    </div>

  </div>
</div>

<div id="loadingOverlay"><div class="spinner"></div><span id="loadingText">处理中...</span></div>
<div id="subCardTooltip"></div>

<script>
/* =========================================================
   持久存储
   ========================================================= */
const LS_KEY = 'chestnut-kanban-state';
const MAX_FILE_SIZE = 200 * 1024; /* 手机端 200KB */

async function openStateDB() {}
function loadStateFromDB() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    return Promise.resolve(raw ? JSON.parse(raw) : null);
  } catch(e) { return Promise.resolve(null); }
}
function saveStateToDB(data) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(data)); }
  catch(e) { console.error('localStorage save failed', e); }
  return Promise.resolve();
}
function clearStateDB() { localStorage.removeItem(LS_KEY); return Promise.resolve(); }

/* =========================================================
   工具
   ========================================================= */
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function formatFileSize(bytes) {
  if (!bytes) return '0 B';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1024/1024).toFixed(2) + ' MB';
}
function getFileIcon(name, type) {
  const ext = (name || '').split('.').pop().toLowerCase();
  if (type && type.startsWith('image/')) return '🖼';
  if (type && type.startsWith('video/')) return '🎬';
  if (type && type.startsWith('audio/')) return '🎵';
  if (ext === 'html' || ext === 'htm' || ext === 'eml' || ext === 'msg') return '📧';
  if (ext === 'pdf') return '📕';
  if (['doc','docx'].includes(ext)) return '📘';
  if (['xls','xlsx','csv'].includes(ext)) return '📗';
  if (['ppt','pptx'].includes(ext)) return '📙';
  if (['zip','rar','7z'].includes(ext)) return '🗜';
  if (['dwg','dxf','step','stp','igs','iges','sldprt','sldasm'].includes(ext)) return '📐';
  return '📄';
}
function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
function dataURLToBlob(dataURL) {
  const parts = dataURL.split(',');
  const mimeMatch = parts[0].match(/:(.*?);/);
  const mime = mimeMatch ? mimeMatch[1] : 'application/octet-stream';
  const bstr = atob(parts[1]);
  let n = bstr.length;
  const u8 = new Uint8Array(n);
  while (n--) u8[n] = bstr.charCodeAt(n);
  return new Blob([u8], { type: mime });
}
function showLoading(text) {
  document.getElementById('loadingText').textContent = text || '处理中...';
  document.getElementById('loadingOverlay').classList.add('show');
}
function hideLoading() { document.getElementById('loadingOverlay').classList.remove('show'); }

/* =========================================================
   主题：优先手动，其次跟随系统
   ========================================================= */
const THEME_KEY = 'chestnut-kanban-theme';
const themeBtn = document.getElementById('themeToggle');
const mq = window.matchMedia('(prefers-color-scheme: dark)');

function applyTheme() {
  const saved = localStorage.getItem(THEME_KEY);
  const useDark = saved ? saved === 'dark' : mq.matches;
  document.body.classList.toggle('dark', useDark);
  themeBtn.textContent = useDark ? '☀️' : '🌙';
  /* 更新 theme-color 元标签，与浏览器 UI 呼应 */
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = useDark ? '#121212' : '#c8662f';
}
applyTheme();

/* 系统主题变化时：只有用户没手动指定才跟随 */
mq.addEventListener('change', () => {
  if (!localStorage.getItem(THEME_KEY)) applyTheme();
});

themeBtn.onclick = () => {
  const cur = document.body.classList.contains('dark') ? 'light' : 'dark';
  localStorage.setItem(THEME_KEY, cur);
  applyTheme();
};

/* =========================================================
   数据 & 状态
   ========================================================= */
const PRIORITY = {
  high:   { label: '高', cls: 'high' },
  medium: { label: '中', cls: 'medium' },
  low:    { label: '低', cls: 'low' },
  none:   { label: '',   cls: '' }
};

function defaultData() {
  const board = {
    id: uid(), name: '我的看板',
    lists: [
      { id: uid(), title: '待办', cards: [
        { id: uid(), title: '欢迎使用栗子看板 🌰', desc: '点击卡片编辑详情。', tags: ['入门'], priority: 'high', due: '', checklist: [], attachments: [], notes: [], subBoard: null, isExpanded: false }
      ] },
      { id: uid(), title: '进行中', cards: [] },
      { id: uid(), title: '已完成', cards: [] }
    ]
  };
  return { boards: [board], currentBoardId: board.id, templates: [] };
}

let state = null;
let boardStack = [];
let editing = null;
let renamingListId = null;
let editingChecklist = [];
let editingAttachments = [];
let editingNotes = [];
let editingStarred = false;
let currentPreviewURL = null;
let previewingCardId = null;
let templateTargetListId = null;

function getCurrentBoard() {
  let b = state.boards.find(b => b.id === state.currentBoardId);
  if (!b) { b = state.boards[0]; if (b) state.currentBoardId = b.id; }
  return b;
}
function syncBoardStack() {
  const b = getCurrentBoard();
  boardStack = [{ lists: b.lists, title: b.name }];
}
async function saveState() {
  try { await saveStateToDB(state); } catch (e) { console.error(e); }
}

/* =========================================================
   DOM 引用
   ========================================================= */
const board = document.getElementById('board');
const overlay = document.getElementById('overlay');
const mTitle = document.getElementById('mTitle');
const mDesc = document.getElementById('mDesc');
const mTags = document.getElementById('mTags');
const mPriority = document.getElementById('mPriority');
const mDue = document.getElementById('mDue');
const mList = document.getElementById('mList');
const mEnterSubBoard = document.getElementById('mEnterSubBoard');
const mStarBtn = document.getElementById('mStarBtn');
const checklistContainer = document.getElementById('checklistContainer');
const attachmentsContainer = document.getElementById('attachmentsContainer');
const attachmentFileInput = document.getElementById('attachmentFileInput');
const breadcrumb = document.getElementById('breadcrumb');
const quickMoveOverlay = document.getElementById('quickMoveOverlay');
const quickMoveList = document.getElementById('quickMoveList');
const boardSelect = document.getElementById('boardSelect');
const renameListOverlay = document.getElementById('renameListOverlay');
const renameListInput = document.getElementById('renameListInput');
const notesContainer = document.getElementById('notesContainer');

/* =========================================================
   渲染
   ========================================================= */
function renderBoardSelect() {
  boardSelect.innerHTML = state.boards.map(b =>
    `<option value="${b.id}" ${b.id === state.currentBoardId ? 'selected' : ''}>${esc(b.name)}</option>`
  ).join('');
}
boardSelect.onchange = (e) => {
  state.currentBoardId = e.target.value;
  syncBoardStack(); saveState(); render();
};
document.getElementById('addBoardBtn').onclick = () => {
  const name = prompt('新看板名称', '新看板');
  if (name === null) return;
  const nb = { id: uid(), name: name.trim() || '新看板', lists: [{ id: uid(), title: '待办', cards: [] }] };
  state.boards.push(nb);
  state.currentBoardId = nb.id;
  syncBoardStack(); renderBoardSelect(); saveState(); render();
};
document.getElementById('renameBoardBtn').onclick = () => {
  const b = getCurrentBoard(); if (!b) return;
  const name = prompt('重命名看板', b.name);
  if (name === null) return;
  b.name = name.trim() || b.name;
  boardStack[0].title = b.name;
  renderBoardSelect(); saveState(); render();
};
document.getElementById('delBoardBtn') && (document.getElementById('delBoardBtn').onclick = () => {});
/* 删除看板移动到菜单里 */
function deleteCurrentBoard() {
  if (state.boards.length <= 1) { alert('至少保留一个看板'); return; }
  const b = getCurrentBoard();
  if (!confirm(`确定删除看板「${b.name}」？`)) return;
  state.boards = state.boards.filter(x => x.id !== b.id);
  state.currentBoardId = state.boards[0].id;
  syncBoardStack(); renderBoardSelect(); saveState(); render();
}

function render() {
  const cb = boardStack[boardStack.length - 1];
  if (boardStack.length > 1) {
    breadcrumb.classList.add('show');
    breadcrumb.innerHTML = boardStack.map((b, i) =>
      i === boardStack.length - 1
        ? `<span class="current">${esc(b.title)}</span>`
        : `<span onclick="goBackTo(${i})">${esc(b.title)}</span><span class="arrow">›</span>`
    ).join('');
  } else {
    breadcrumb.classList.remove('show');
  }
  board.innerHTML = cb.lists.map(renderList).join('') + `
    <button class="add-list-btn" id="addListInlineBtn"><span style="font-size:18px;line-height:1;">＋</span> 列表</button>
  `;
  document.getElementById('addListInlineBtn').onclick = () => {
    const title = prompt('新列表名称', '新列表');
    if (title === null) return;
    cb.lists.push({ id: uid(), title: title.trim() || '新列表', cards: [] });
    render(); saveState();
  };
  renderPinboard();
  renderLinks();
  updateStarBadge();
  updateDueBadge();
}

function renderList(list, idx, arr) {
  const isFirst = idx === 0;
  const isLast  = idx === arr.length - 1;
  return `
    <div class="list" data-id="${list.id}">
      <div class="list-header">
        <button class="list-move-btn${isFirst ? ' disabled' : ''}" data-act="move-list-left" data-list-id="${list.id}">◀</button>
        <span class="list-title" data-act="rename-list" data-list-id="${list.id}">${esc(list.title)}</span>
        <span class="list-count">${list.cards.length}</span>
        <button class="list-move-btn${isLast ? ' disabled' : ''}" data-act="move-list-right" data-list-id="${list.id}">▶</button>
        <button class="icon-btn" data-act="del-list" data-list-id="${list.id}">✕</button>
      </div>
      <div class="cards" data-list="${list.id}">
        ${list.cards.map(renderCard).join('')}
      </div>
      <div class="list-bottom-actions">
        <button class="add-card-btn" data-act="add-card" data-list-id="${list.id}">＋ 添加卡片</button>
        <button class="add-template-btn" data-act="add-from-template" data-list-id="${list.id}">📋</button>
      </div>
    </div>
  `;
}

function renderCard(card) {
  const today = new Date().toISOString().slice(0,10);
  const p = PRIORITY[card.priority] || PRIORITY.none;
  const tags = (card.tags||[]).length ? `<div class="card-tags">${card.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>` : '';
  const due = card.due ? `<span class="due${card.due<today?' overdue':''}">📅 ${esc(card.due.slice(5))}</span>` : '';
  const pri = p.label ? `<span class="pri ${p.cls}">${p.label}</span>` : '';
  let ci = '';
  if ((card.checklist||[]).length > 0) {
    const done = card.checklist.filter(c => c.done).length;
    const allDone = done === card.checklist.length;
    ci = `<span class="indicator ${allDone?'checked':''}">☑ ${done}/${card.checklist.length}</span>`;
  }
  let ai = '';
  const atts = card.attachments || [];
  if (atts.length > 0) {
    const files = atts.filter(a => a.kind === 'file');
    const links = atts.filter(a => a.kind === 'link');
    const parts = [];
    if (files.length > 0) parts.push(`📎 ${files.length}`);
    if (links.length > 0) parts.push(`🔗 ${links.length}`);
    ai = `<span class="indicator">${parts.join(' ')}</span>`;
  }
  let ni = '';
  const cardNotes = card.notes || [];
  if (cardNotes.length > 0) {
    const totalNoteAtts = cardNotes.reduce((s, n) => s + (n.attachments || []).length, 0);
    ni = `<span class="indicator">📝 ${cardNotes.length}${totalNoteAtts ? ` (📎${totalNoteAtts})` : ''}</span>`;
  }
  const meta = (due || pri) ? `<div class="card-meta">${due}${pri}</div>` : '';
  const inds = (ci || ai || ni) ? `<div class="card-indicators">${ci}${ai}${ni}</div>` : '';
  const pClass = card.priority && card.priority !== 'none' ? ` p-${card.priority}` : '';
  let sbHtml = '';
  if (card.subBoard) {
    const exp = card.isExpanded || false;
    const total = card.subBoard.lists.reduce((s,l) => s+l.cards.length, 0);
    let content = '';
    if (exp) {
      if (total === 0) content = '<div class="empty-sub">子看板为空</div>';
      else card.subBoard.lists.forEach(l => {
        content += `<div class="sub-list-title">📁 ${esc(l.title)} (${l.cards.length})</div>`;
        l.cards.forEach(c => {
          const starred = c.starred ? ' starred' : '';
          content += `<div class="sub-card-item" data-sub-card-id="${c.id}" data-sub-list-id="${l.id}" data-parent-card-id="${card.id}">
            <button class="star-btn${starred}" data-act="toggle-star" data-sub-card-id="${c.id}" data-sub-list-id="${l.id}" data-parent-card-id="${card.id}">★</button>
            <span class="sub-card-title">${esc(c.title).replace(/\n/g,'<br>')}</span>
            <button class="del-sub-card-btn" data-act="del-sub-card" data-sub-card-id="${c.id}" data-sub-list-id="${l.id}" data-parent-card-id="${card.id}">✕</button>
          </div>`;
        });
      });
    }
    sbHtml = `<div class="sub-board-preview" style="display:${exp?'block':'none'};">${content}</div>`;
  }
  const sbBtn = card.subBoard
    ? `<button class="expand-sub-btn ${card.isExpanded?'expanded':''}" data-act="toggle-sub" data-card-id="${card.id}">${card.isExpanded?'收起':'子看板'}</button>`
    : '';
  const previewBtn = card.subBoard
    ? `<button class="preview-sub-btn" data-act="preview-sub" data-card-id="${card.id}">👁</button>`
    : '';
  return `
    <div class="card${pClass}" data-id="${card.id}">
      <div class="card-main">
        ${tags}
        <div class="card-title">${card.starred ? '<span class="card-star">★</span>' : ''}${esc(card.title).replace(/\n/g,'<br>')}</div>
        ${meta}
        ${inds}
      </div>
      ${sbHtml}
      <div class="card-footer">
        <div class="footer-left">
          <button class="action-btn" data-act="move-up" data-card-id="${card.id}">↑</button>
          <button class="action-btn" data-act="move-down" data-card-id="${card.id}">↓</button>
        </div>
        <div class="footer-right">
          <button class="quick-move-btn" data-act="quick-move" data-card-id="${card.id}">⇄</button>
          ${previewBtn}
          ${sbBtn}
        </div>
      </div>
    </div>
  `;
}

/* =========================================================
   层级 / 移动
   ========================================================= */
window.goBackTo = (i) => { boardStack = boardStack.slice(0, i+1); render(); };
function enterSubBoard(card) {
  if (!card.subBoard) {
    card.subBoard = { lists: [{ id: uid(), title: '子任务', cards: [] }] };
    card.isExpanded = true;
  }
  boardStack.push({ lists: card.subBoard.lists, title: card.title });
  closeModal(); render();
}
function moveList(listId, dir) {
  const cb = boardStack[boardStack.length - 1];
  const i = cb.lists.findIndex(l => l.id === listId);
  if (i < 0) return;
  const t = i + dir;
  if (t < 0 || t >= cb.lists.length) return;
  [cb.lists[i], cb.lists[t]] = [cb.lists[t], cb.lists[i]];
  render(); saveState();
}
function moveCardPriority(cardId, dir) {
  const cb = boardStack[boardStack.length - 1];
  for (const l of cb.lists) {
    const i = l.cards.findIndex(c => c.id === cardId);
    if (i !== -1) {
      const t = i + dir;
      if (t >= 0 && t < l.cards.length) {
        [l.cards[i], l.cards[t]] = [l.cards[t], l.cards[i]];
        render(); saveState();
      }
      return;
    }
  }
}
function openQuickMoveMenu(cardId) {
  const cb = boardStack[boardStack.length - 1];
  quickMoveList.innerHTML = '';
  let curId = '';
  cb.lists.forEach(l => { if (l.cards.some(c => c.id === cardId)) curId = l.id; });
  cb.lists.forEach(l => {
    const btn = document.createElement('button');
    btn.className = 'move-option';
    btn.textContent = l.title;
    if (l.id === curId) { btn.textContent += ' (当前)'; btn.disabled = true; btn.style.opacity = '.5'; }
    btn.onclick = () => { moveCard(cardId, l.id); quickMoveOverlay.classList.remove('show'); };
    quickMoveList.appendChild(btn);
  });
  quickMoveOverlay.classList.add('show');
}
function moveCard(cardId, targetListId) {
  const cb = boardStack[boardStack.length - 1];
  let card = null, src = null;
  for (const l of cb.lists) {
    const i = l.cards.findIndex(c => c.id === cardId);
    if (i !== -1) { src = l; card = l.cards.splice(i, 1)[0]; break; }
  }
  if (card && src && src.id !== targetListId) {
    const tl = cb.lists.find(l => l.id === targetListId);
    if (tl) tl.cards.push(card); else src.cards.push(card);
  }
  render(); saveState();
}
document.getElementById('quickMoveCancel').onclick = () => quickMoveOverlay.classList.remove('show');

/* =========================================================
   模板
   ========================================================= */
const templateOverlay = document.getElementById('templateOverlay');
const templateBody = document.getElementById('templateBody');

function openTemplatePicker(listId) {
  templateTargetListId = listId;
  renderTemplateList();
  templateOverlay.classList.add('show');
}
function renderTemplateList() {
  const templates = state.templates || [];
  if (templates.length === 0) {
    templateBody.innerHTML = '<div class="template-empty">还没有模板<br>打开任意卡片，点「📋」存为模板</div>';
    return;
  }
  let html = '';
  templates.forEach(tpl => {
    const subListCount = tpl.card && tpl.card.subBoard ? tpl.card.subBoard.lists.length : 0;
    const subCardTotal = tpl.card && tpl.card.subBoard ? tpl.card.subBoard.lists.reduce((s, l) => s + l.cards.length, 0) : 0;
    const metaText = subCardTotal > 0 ? `子看板 ${subListCount} 列表 / ${subCardTotal} 卡片` : '无子看板';
    html += `
      <div class="template-item" data-template-id="${tpl.id}">
        <div class="tpl-icon">📋</div>
        <div class="tpl-info">
          <div class="tpl-name">${esc(tpl.name)}</div>
          <div class="tpl-meta">${esc(metaText)}</div>
        </div>
        <button class="tpl-del" data-delete-template="${tpl.id}">🗑</button>
      </div>
    `;
  });
  templateBody.innerHTML = html;
}
templateBody.addEventListener('click', async e => {
  const delBtn = e.target.closest('[data-delete-template]');
  if (delBtn) {
    e.stopPropagation();
    if (!confirm('删除这个模板？')) return;
    state.templates = state.templates.filter(t => t.id !== delBtn.dataset.deleteTemplate);
    await saveState(); renderTemplateList();
    return;
  }
  const item = e.target.closest('.template-item');
  if (!item) return;
  const tpl = state.templates.find(t => t.id === item.dataset.templateId);
  if (!tpl) return;
  const newCard = cloneCard(tpl.card);
  const cb = boardStack[boardStack.length - 1];
  const list = cb.lists.find(l => l.id === templateTargetListId);
  if (!list) { alert('目标列表不存在'); return; }
  list.cards.push(newCard);
  templateOverlay.classList.remove('show');
  render(); saveState();
});
document.getElementById('templateCloseBtn').onclick = () => templateOverlay.classList.remove('show');
templateOverlay.addEventListener('click', e => { if (e.target === templateOverlay) templateOverlay.classList.remove('show'); });

function cloneCard(card) {
  const copy = JSON.parse(JSON.stringify(card));
  regenerateIds(copy);
  return copy;
}
function regenerateIds(item) {
  if (!item) return;
  item.id = uid();
  if (item.checklist) item.checklist.forEach(c => c.id = uid());
  if (item.attachments) item.attachments.forEach(a => a.id = uid());
  if (item.notes) item.notes.forEach(n => { n.id = uid(); if (n.attachments) n.attachments.forEach(a => a.id = uid()); });
  if (item.subBoard && item.subBoard.lists) {
    item.subBoard.lists.forEach(list => {
      list.id = uid();
      if (list.cards) list.cards.forEach(c => regenerateIds(c));
    });
  }
}

document.getElementById('mSaveAsTemplate').onclick = async () => {
  if (!editing) return;
  const cb = boardStack[boardStack.length - 1];
  const l = cb.lists.find(x => x.id === editing.listId);
  const card = l && l.cards.find(c => c.id === editing.cardId);
  if (!card) return;
  card.title = mTitle.value.trim() || card.title;
  card.desc = mDesc.value.trim();
  card.tags = mTags.value.split(/[,，]/).map(s => s.trim()).filter(Boolean);
  card.priority = mPriority.value;
  card.due = mDue.value;
  card.starred = editingStarred;
  card.checklist = editingChecklist.filter(c => c.text.trim()).map(c => ({ id: c.id || uid(), text: c.text.trim(), done: !!c.done }));
  card.attachments = editingAttachments.map(a => {
    if (a.kind === 'link') return { id: a.id, kind: 'link', name: a.name, size: 0, type: 'link', url: a.url, note: a.note || '' };
    return { id: a.id, kind: 'file', name: a.name, size: a.size || 0, type: a.type || '', data: a.data || '', note: a.note || '' };
  });
  const tplName = prompt('模板名称', card.title);
  if (tplName === null) return;
  if (!state.templates) state.templates = [];
  state.templates.push({ id: uid(), name: tplName.trim() || card.title, card: cloneCard(card) });
  await saveState();
  alert('✅ 已保存为模板');
};

/* =========================================================
   子看板预览 & Tooltip
   ========================================================= */
const subPreviewOverlay = document.getElementById('subPreviewOverlay');
const subPreviewBody = document.getElementById('subPreviewBody');
const subPreviewTitle = document.getElementById('subPreviewTitle');
let _subPreviewCards = [];

function findCardById(cardId) {
  const cb = boardStack[boardStack.length - 1];
  for (const l of cb.lists) {
    const c = l.cards.find(x => x.id === cardId);
    if (c) return c;
  }
  return null;
}
function findSubCardObj(parentCardId, subListId, subCardId) {
  const pCard = findCardById(parentCardId);
  if (!pCard || !pCard.subBoard) return null;
  for (const l of pCard.subBoard.lists) {
    if (subListId && l.id !== subListId) continue;
    const c = l.cards.find(x => x.id === subCardId);
    if (c) return c;
  }
  return null;
}

const subCardTooltip = document.getElementById('subCardTooltip');
let _sctTimer = null;
function buildCardTooltipHtml(card) {
  if (!card) return '<div class="sct-empty">无内容</div>';
  let h = '';
  if (card.tags && card.tags.length) {
    h += `<div class="sct-tags">${card.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>`;
  }
  const mp = [];
  if (card.priority && card.priority !== 'none') mp.push(PRIORITY[card.priority].label + '优先级');
  if (card.due) mp.push('📅 ' + esc(card.due));
  if (mp.length) h += `<div class="sct-meta">${mp.join(' · ')}</div>`;
  if (card.desc) {
    const d = card.desc.length > 120 ? card.desc.slice(0, 120) + '…' : card.desc;
    h += `<div class="sct-desc">${esc(d)}</div>`;
  }
  const cl = card.checklist || [];
  if (cl.length) {
    const dn = cl.filter(c => c.done).length;
    h += `<div class="sct-section">☑ 待办 (${dn}/${cl.length})</div>`;
    cl.slice(0, 5).forEach(c => {
      h += `<div class="sct-check${c.done ? ' done' : ''}">${c.done ? '✓' : '○'} ${esc(c.text)}</div>`;
    });
  }
  const atts = card.attachments || [];
  if (atts.length) {
    h += `<div class="sct-section">📎 附件 (${atts.length})</div>`;
    atts.slice(0, 3).forEach(a => {
      const icon = a.kind === 'link' ? '🔗' : getFileIcon(a.name, a.type);
      h += `<div class="sct-att">${icon} ${esc(a.name)}</div>`;
    });
  }
  const notes = card.notes || [];
  if (notes.length) {
    h += `<div class="sct-section">📝 笔记 (${notes.length})</div>`;
    notes.slice(0, 3).forEach(n => {
      const txt = (n.text || '').slice(0, 50) + ((n.text || '').length > 50 ? '…' : '');
      h += `<div class="sct-note">📝 ${esc(txt)}</div>`;
    });
  }
  if (card.subBoard) {
    const t = card.subBoard.lists.reduce((s, l) => s + l.cards.length, 0);
    h += `<div class="sct-sub">📁 含子看板（${t} 卡片）</div>`;
  }
  if (!h) h = '<div class="sct-empty">暂无详情</div>';
  return h;
}
function showSubCardTooltip(el, card) {
  const starHtml = card.starred ? '<span class="card-star">★</span>' : '';
  subCardTooltip.innerHTML = `<div class="sct-title">${starHtml}${esc(card.title).replace(/\n/g,'<br>')}</div>` + buildCardTooltipHtml(card);
  subCardTooltip.style.display = 'block';
  const rect = el.getBoundingClientRect();
  const tw = subCardTooltip.offsetWidth;
  const th = subCardTooltip.offsetHeight;
  let left = rect.right + 10;
  let top = rect.top + rect.height / 2 - th / 2;

  if (top < 8) top = 8;
  if (top + th > window.innerHeight - 8) top = window.innerHeight - th - 8;
  subCardTooltip.style.left = left + 'px';
  subCardTooltip.style.top = top + 'px';
  requestAnimationFrame(() => subCardTooltip.classList.add('show'));
}
function hideSubCardTooltip() {

}

function openSubPreview(cardId) {
  const card = findCardById(cardId);

function renderSubPreviewContent(lists) {
  if (!lists || lists.length === 0) return '<div class="sub-preview-empty">子看板为空</div>';
  let totalCards = lists.reduce((s, l) => s + l.cards.length, 0);
  if (totalCards === 0) return '<div class="sub-preview-empty">子看板里还没有卡片</div>';
  let html = '';
  lists.forEach(list => {
    html += `<div class="sub-preview-list">`;
    html += `<div class="sub-preview-list-title">📁 ${esc(list.title)} <span class="sub-preview-list-count">${list.cards.length}</span></div>`;
    if (list.cards.length === 0) {
      html += `<div style="font-size:11px;color:var(--muted);padding:4px 0;">（空）</div>`;
    } else {
      list.cards.forEach(card => {
        const pClass = card.priority && card.priority !== 'none' ? card.priority : '';
        const done = (card.checklist || []).filter(c => c.done).length;
        const total = (card.checklist || []).length;
        const atts = card.attachments || [];
        const files = atts.filter(a => a.kind === 'file').length;
        const links = atts.filter(a => a.kind === 'link').length;
        const metaParts = [];
        if (total > 0) metaParts.push(`☑ ${done}/${total}`);
        if (files > 0) metaParts.push(`📎 ${files}`);
        if (links > 0) metaParts.push(`🔗 ${links}`);
        if (card.due) metaParts.push(`📅 ${card.due}`);
        html += `<div class="sub-preview-card">
          <div class="sub-preview-card-title">`;
        if (card.starred) html += `<span class="card-star">★</span>`;
        if (pClass) html += `<span class="priority-dot ${pClass}"></span>`;
        html += `${esc(card.title).replace(/\n/g,'<br>')}</div>`;
        if (card.desc) html += `<div class="sub-preview-card-desc">${esc(card.desc)}</div>`;
        if (metaParts.length > 0) html += `<div class="sub-preview-card-meta">${metaParts.join(' · ')}</div>`;
        const cardNotes = card.notes || [];
        if (cardNotes.length > 0) {
          html += `<div style="margin-top:4px;">`;
          cardNotes.forEach(n => {
            const txt = (n.text || '').slice(0, 50) + ((n.text || '').length > 50 ? '…' : '');
            const nAtts = (n.attachments || []).length;
            html += `<div style="font-size:11px;color:var(--muted);">📝 ${esc(txt)}${nAtts ? ` (📎${nAtts})` : ''}</div>`;
          });
          html += `</div>`;
        }
        if (card.subBoard) {
          const nestedTotal = card.subBoard.lists.reduce((s, l) => s + l.cards.length, 0);
          html += `<div style="margin-top:6px;padding-left:12px;border-left:2px solid var(--sub-border);font-size:11px;color:var(--muted);">📁 下级子看板（${nestedTotal}）</div>`;
        }
        html += `</div>`;
      });
    }
    html += `</div>`;
  });
  return html;
}

function previewAttachment(att) {
  if (!att) return;
  if (att.kind === 'link') { if (att.url) window.open(att.url, '_blank'); return; }
  if (!att.data) { alert('⚠️ 附件数据缺失'); return; }
  const mime = att.type || '';
  const ln = (att.name || '').toLowerCase();
  if (mime.includes('html') || ln.endsWith('.html') || ln.endsWith('.htm')) return showPreviewFrame(att.data, att.name);
  if (mime.startsWith('image/')) return showPreviewImage(att.data, att.name);
  if (mime === 'application/pdf' || ln.endsWith('.pdf')) return showPreviewFrame(att.data, att.name);
  if (mime.startsWith('text/') || ln.endsWith('.txt') || ln.endsWith('.csv') || ln.endsWith('.md')) return showPreviewFrame(att.data, att.name);
  downloadAttachment(att);
}
function showPreviewImage(dataURL, name) {
  const c = document.getElementById('previewContent');
  c.innerHTML = '';
  const img = document.createElement('img');
  img.src = dataURL;
  c.appendChild(img);
  document.getElementById('previewTitle').textContent = name || '图片';
  document.getElementById('previewOverlay').classList.add('show');
  const ntb = document.getElementById('previewNewTabBtn');
  ntb.dataset.mode = 'image'; ntb.dataset.data = dataURL;
  const dl = document.getElementById('previewDownloadBtn');
  dl.dataset.data = dataURL; dl.dataset.name = name;
}
function showPreviewFrame(dataURL, name) {
  const c = document.getElementById('previewContent');
  c.innerHTML = '<div class="preview-loading" style="color:#fff;">加载中...</div>';
  const blob = dataURLToBlob(dataURL);
  const url = URL.createObjectURL(blob);
  currentPreviewURL = url;
  const iframe = document.createElement('iframe');
  iframe.setAttribute('sandbox', 'allow-same-origin allow-scripts allow-popups allow-forms');
  iframe.src = url;
  c.innerHTML = '';
  c.appendChild(iframe);
  document.getElementById('previewTitle').textContent = name || '预览';
  document.getElementById('previewOverlay').classList.add('show');
  const ntb = document.getElementById('previewNewTabBtn');
  ntb.dataset.mode = 'frame'; ntb.dataset.url = url;
  const dl = document.getElementById('previewDownloadBtn');
  dl.dataset.data = dataURL; dl.dataset.name = name;
}
function downloadAttachment(att) {
  if (!att) return;
  if (att.kind === 'link') { window.open(att.url, '_blank'); return; }
  if (!att.data) { alert('⚠️ 附件数据缺失'); return; }
  const blob = dataURLToBlob(att.data);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = att.name || 'attachment';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* 拖拽上传（桌面端仍可用） */
async function handleDroppedFiles(files, targetArray, onDone) {
  const fileList = Array.from(files);
  if (!fileList.length) return;
  showLoading('处理附件...');
  try {
    for (const f of fileList) {
      if (f.size > MAX_FILE_SIZE) {
        alert(`❌「${f.name}」超过 200KB 限制。`);
        continue;
      }
      try {
        const dataURL = await fileToDataURL(f);
        targetArray.push({ id: uid(), kind: 'file', name: f.name, size: f.size, type: f.type || 'application/octet-stream', data: dataURL });
      } catch (err) { alert(`读取「${f.name}」失败`); }
    }
    if (onDone) onDone();
  } finally { hideLoading(); }
}
function enableDropZone(el, onDrop) {
  el.addEventListener('dragover', e => { e.preventDefault(); e.stopPropagation(); el.classList.add('drag-over'); });
  el.addEventListener('dragleave', e => { e.preventDefault(); e.stopPropagation(); el.classList.remove('drag-over'); });
  el.addEventListener('drop', async e => {
    e.preventDefault(); e.stopPropagation(); el.classList.remove('drag-over');
    const files = e.dataTransfer.files;
    if (files && files.length) await onDrop(files);
  });
}

      const isLink = att.kind === 'link';
      const icon = isLink ? '🔗' : getFileIcon(att.name, att.type);
      const sizeText = isLink ? '外部链接' : formatFileSize(att.size);
      attsHtml += `<div class="attachment-item">
        <div class="file-icon">${icon}</div>
        <div class="file-info"><div class="file-name">${esc(att.name)}</div><div class="file-size ${isLink?'link-tag':''}">${sizeText}</div></div>
        <div class="file-actions">

        </div>

    });

        <button class="note-remove" data-ni="${ni}">✕</button>
      </div>
      <textarea class="note-text" data-ni="${ni}" placeholder="输入笔记内容…">${esc(note.text || '')}</textarea>

      <div class="note-att-actions">
        <button class="btn small note-add-file" data-ni="${ni}">📎 文件</button>
        <button class="btn small note-add-link" data-ni="${ni}">🔗 链接</button>
      </div>
    `;
    notesContainer.appendChild(div);
  });
  notesContainer.querySelectorAll('.note-block').forEach(block => {
    enableDropZone(block, async files => {

      notesContainer.querySelectorAll('.note-text').forEach(ta => {

}

notesContainer.addEventListener('click', e => {

function openCard(cardId) {
  const cb = boardStack[boardStack.length - 1];
  for (const l of cb.lists) {
    const card = l.cards.find(c => c.id === cardId);
    if (!card) continue;
    editing = { listId: l.id, cardId };
    mTitle.value = card.title;
    mDesc.value = card.desc || '';
    mTags.value = (card.tags || []).join(', ');
    mPriority.value = card.priority || 'none';
    mDue.value = card.due || '';
    editingStarred = !!card.starred;
    mStarBtn.classList.toggle('starred', editingStarred);
    editingChecklist = (card.checklist || []).map(c => ({ ...c }));
    renderChecklistUI();
    editingAttachments = (card.attachments || []).map(a => {
      if (!a.kind) a.kind = (a.url && !a.data) ? 'link' : 'file';
      return { ...a };
    });
    renderAttachmentsUI();
    editingNotes = (card.notes || []).map(n => ({
      id: n.id || uid(), text: n.text || '',
      attachments: (n.attachments || []).map(a => ({ ...a }))
    }));
    renderNotesUI();
    mList.innerHTML = cb.lists.map(x =>
      `<option value="${x.id}" ${x.id === l.id ? 'selected' : ''}>${esc(x.title)}</option>`
    ).join('');
    mEnterSubBoard.textContent = card.subBoard ? '子看板' : '建子看板';
    mEnterSubBoard.style.display = 'block';
    overlay.classList.add('show');
    setTimeout(() => { autoResizeMTitle(); }, 30);
    return;
  }
}

});

document.getElementById('mSave').onclick = async () => {
  if (!editing) return;
  const cb = boardStack[boardStack.length - 1];
  const l = cb.lists.find(x => x.id === editing.listId);
  const card = l && l.cards.find(c => c.id === editing.cardId);
  if (!card) return closeModal();
  card.title = mTitle.value.trim() || '未命名卡片';
  card.desc = mDesc.value.trim();
  card.tags = mTags.value.split(/[,，]/).map(s => s.trim()).filter(Boolean);
  card.priority = mPriority.value;
  card.due = mDue.value;
  card.starred = editingStarred;
  card.checklist = editingChecklist.filter(c => c.text.trim()).map(c => ({ id: c.id || uid(), text: c.text.trim(), done: !!c.done }));
  card.attachments = editingAttachments.map(a => {
    if (a.kind === 'link') return { id: a.id, kind: 'link', name: a.name, size: 0, type: 'link', url: a.url, note: a.note || '' };
    return { id: a.id, kind: 'file', name: a.name, size: a.size || 0, type: a.type || '', data: a.data || '', note: a.note || '' };
  });
  card.notes = editingNotes.filter(n => n.text.trim() || (n.attachments && n.attachments.length)).map(n => ({
    id: n.id || uid(), text: n.text.trim(),
    attachments: (n.attachments || []).map(a => {
      if (a.kind === 'link') return { id: a.id, kind: 'link', name: a.name, size: 0, type: 'link', url: a.url };
      return { id: a.id, kind: 'file', name: a.name, size: a.size || 0, type: a.type || '', data: a.data || '' };
    })
  }));
  const newListId = mList.value;
  if (newListId !== editing.listId) {
    const oldL = cb.lists.find(x => x.id === editing.listId);
    const i = oldL.cards.findIndex(c => c.id === editing.cardId);
    const [mv] = oldL.cards.splice(i, 1);
    const nl = cb.lists.find(x => x.id === newListId);
    if (nl) nl.cards.push(mv);
  }
  closeModal(); render();
  showLoading('保存中...');
  try { await saveStateToDB(state); } finally { hideLoading(); }
};
