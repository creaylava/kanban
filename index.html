<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🌰 栗子看板</title>
<style>
  :root{
    --bg:#f5f2ed; --list-bg:#e9e4db; --card-bg:#fff; --text:#2e2a26;
    --muted:#8c8377; --accent:#c8662f; --border:#e2dbd1; --input-bg:#fdfcfa;
    --sub-bg:#f9f6f2; --sub-border:#e8e0d5;
  }
  body.dark {
    --bg:#121212; --list-bg:#1e1e1e; --card-bg:#2d2d2d; --text:#e0e0e0;
    --muted:#9e9e9e; --accent:#e07b39; --border:#444444; --input-bg:#1e1e1e;
    --sub-bg:#222; --sub-border:#3a3a3a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); display:flex; flex-direction:column;
    overflow:hidden; transition: background 0.3s, color 0.3s;
  }
  header{
    display:flex; align-items:center; gap:6px; padding:8px 12px; background:var(--card-bg);
    border-bottom:1px solid var(--border); flex:0 0 auto; z-index:10; flex-wrap: wrap;
    box-shadow:0 2px 5px rgba(0,0,0,.05);
  }
  header .logo{font-size:20px;}
  .spacer{flex:1;}
  .btn{
    border:1px solid var(--border); background:var(--card-bg); color:var(--text);
    padding:6px 10px; border-radius:8px; font-size:12px; cursor:pointer;
    font-family:inherit; transition:.15s; white-space:nowrap;
  }
  .btn:hover{background:var(--list-bg);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.primary:hover{background:#b35726;}
  .btn.danger{color:#d0453a; border-color:#f0cfcc;}
  .btn.danger:hover{background:#fdf1f0;}
  .btn.small{padding:5px 10px; font-size:12px;}
  .btn.icon{padding:6px 9px; font-size:15px;}
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .board-selector {
    padding:6px 10px; border:1px solid var(--border); border-radius:8px;
    background:var(--input-bg); color:var(--text); font-size:13px; outline:none;
    font-family:inherit; font-weight:600; max-width:140px;
  }

  #breadcrumb {
    display: flex; align-items: center; gap: 8px; padding: 6px 18px;
    background: var(--bg); font-size: 12px; color: var(--muted);
    border-bottom: 1px solid var(--border); display: none;
  }
  #breadcrumb.show { display: flex; }
  #breadcrumb span { cursor: pointer; }
  #breadcrumb span:hover { color: var(--accent); text-decoration: underline; }
  #breadcrumb .current { color: var(--text); font-weight: 600; cursor: default; }
  #breadcrumb .arrow { color: var(--muted); cursor: default; }

  #board{
    flex:1; display:flex; gap:14px; padding:16px 18px 24px;
    overflow-x:auto; overflow-y:hidden; align-items:flex-start;
  }
  .empty{margin:auto; color:var(--muted); font-size:14px;}

  .list{
    flex:0 0 280px; width:280px; background:var(--list-bg);
    border-radius:12px; display:flex; flex-direction:column; max-height:100%; padding:4px;
    transition:background 0.3s;
  }
  .list-header{
    display:flex; align-items:center; gap:6px; padding:8px 10px;
  }
  .list-title{
    font-weight:600; font-size:14px; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    border-radius:6px; padding:4px 6px; margin:-2px -4px;
    cursor: pointer; transition: background 0.15s;
  }
  .list-title:hover{background:rgba(0,0,0,.08);}
  .list-title::after {
    content: '✎';
    font-size: 11px;
    color: var(--muted);
    margin-left: 6px;
    opacity: 0.4;
  }
  .list-title:hover::after { opacity: 0.9; }
  .list-count{
    font-size:12px; color:var(--muted); background:rgba(0,0,0,.06); border-radius:10px; padding:1px 7px;
    flex-shrink: 0;
  }
  .icon-btn{
    border:none; background:transparent; color:var(--muted); font-size:15px;
    cursor:pointer; padding:4px 6px; border-radius:6px;
    line-height:1; flex-shrink: 0; transition:.15s;
  }
  .icon-btn:hover{background:rgba(208,69,58,.15); color:#d0453a;}

  .cards{
    flex:1; overflow-y:auto; overflow-x:hidden; padding:2px 6px 0; min-height:12px;
  }
  .cards::-webkit-scrollbar{width:8px;}
  .cards::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15); border-radius:4px;}

  .card{
    position:relative; overflow:hidden; background:var(--card-bg); border-radius:10px;
    padding:10px 12px 32px 12px; margin-bottom:8px; box-shadow:0 1px 2px rgba(0,0,0,.07);
    cursor:pointer; -webkit-touch-callout: none; user-select: none;
    transition: box-shadow .15s, background 0.3s;
    display: flex; flex-direction: column;
  }
  .card:hover{box-shadow:0 3px 10px rgba(0,0,0,.12);}
  .card::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:transparent;}
  .card.p-high::before{background:#e2574c;}
  .card.p-medium::before{background:#e8a33d;}
  .card.p-low::before{background:#3f9d7c;}

  .card-title{font-size:14px; line-height:1.45; word-break:break-word;}
  .card-tags{display:flex; flex-wrap:wrap; gap:4px; margin-bottom:6px;}
  .tag{font-size:11px; padding:1px 7px; border-radius:6px; background:rgba(0,0,0,.05); color:var(--muted);}
  .card-meta{display:flex; align-items:center; gap:8px; margin-top:7px; font-size:11px; color:var(--muted);}
  .due{display:inline-flex; align-items:center; gap:3px;}
  .due.overdue{color:#d0453a; font-weight:600;}
  .pri{font-size:11px; padding:1px 6px; border-radius:6px; background:rgba(0,0,0,.05);}
  .pri.high{color:#e2574c;}
  .pri.medium{color:#d08a1e;}
  .pri.low{color:#3f9d7c;}

  .card-footer {
    position: absolute; bottom: 6px; left: 10px; right: 10px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .footer-left { display: flex; gap: 5px; }
  .footer-right { display: flex; gap: 5px; }

  .action-btn {
    background: rgba(100,100,100,.08); color: var(--muted); border: none;
    font-size: 13px; padding: 3px 8px; border-radius: 6px; cursor: pointer;
    font-weight: bold; transition: .15s;
  }
  .action-btn:hover { background: var(--accent); color: #fff; }
  .action-btn:disabled { opacity: 0.3; cursor: not-allowed; background: transparent; }

  .quick-move-btn {
    background: rgba(200,102,47,.1); color: var(--accent); border: none;
    font-size: 13px; padding: 3px 8px; border-radius: 6px; cursor: pointer;
    font-weight: bold; transition: .15s;
  }
  .quick-move-btn:hover { background: var(--accent); color: #fff; }

  .expand-sub-btn {
    background: rgba(100,100,100,.08); color: var(--muted); border: none;
    font-size: 12px; padding: 3px 8px; border-radius: 6px; cursor: pointer;
    transition: .15s;
  }
  .expand-sub-btn:hover { background: var(--accent); color: #fff; }
  .expand-sub-btn.expanded { background: var(--accent); color: #fff; }

  .sub-board-preview {
    margin-top: 10px; padding: 10px; background: var(--sub-bg);
    border-radius: 8px; border: 1px solid var(--sub-border);
  }
  .sub-board-preview .sub-list-title {
    font-size: 12px; font-weight: 600; color: var(--muted);
    margin-bottom: 6px;
  }
  .sub-board-preview .sub-card-item {
    font-size: 13px; padding: 5px 8px; background: var(--card-bg);
    border-radius: 6px; margin-bottom: 4px; border: 1px solid var(--border);
    cursor: pointer; transition: .15s; display: flex; justify-content: space-between;
  }
  .sub-board-preview .sub-card-item:hover { border-color: var(--accent); color: var(--accent); }
  .sub-board-preview .empty-sub { font-size: 12px; color: var(--muted); font-style: italic; }

  .add-card-btn{
    margin:6px; padding:8px; border:none; background:transparent; color:var(--muted); text-align:left; border-radius:8px;
    cursor:pointer; font-size:13px; font-family:inherit; transition:.15s;
  }
  .add-card-btn:hover{background:rgba(0,0,0,.06); color:var(--text);}

  .composer{padding-bottom:8px;}
  .composer textarea{
    width:100%; height:62px; resize:none; border:1px solid var(--accent); border-radius:10px;
    padding:8px 10px; font-size:14px; font-family:inherit; outline:none;
    background:var(--card-bg); color:var(--text); box-shadow:0 0 0 3px rgba(200,102,47,.1);
  }

  .add-list-btn {
    flex:0 0 100px; width:100px; height:48px;
    border:2px dashed var(--border); background:transparent;
    border-radius:12px; color:var(--muted); cursor:pointer;
    font-size:13px; font-family:inherit; font-weight:600;
    display:flex; align-items:center; justify-content:center; gap:4px;
    transition:.15s; margin-top:4px;
  }
  .add-list-btn:hover {
    border-color: var(--accent); color: var(--accent);
    background: rgba(200,102,47,.05);
  }

  .overlay{position:fixed; inset:0; background:rgba(30,25,20,.45); display:none; align-items:center; justify-content:center; z-index:100; padding:20px;}
  .overlay.show{display:flex;}
  .modal{
    background:var(--card-bg); border-radius:14px; width:100%; max-width:520px;
    padding:20px; box-shadow:0 20px 60px rgba(0,0,0,.25); max-height:90vh; overflow-y:auto;
    transition: background 0.3s;
  }
  .m-title{font-size:17px; font-weight:600; margin-bottom:14px;}
  .modal textarea{width:100%; height:90px; resize:vertical; margin-bottom:14px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px;}
  .modal input, .modal select, .modal textarea {
    width:100%; border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:14px;
    font-family:inherit; color:var(--text); background:var(--input-bg); outline:none; transition:.15s;
  }
  .modal input:focus, .modal select:focus, .modal textarea:focus {
    border-color:var(--accent); background:var(--card-bg); box-shadow:0 0 0 3px rgba(200,102,47,.12);
  }
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .modal-actions{display:flex; gap:8px; margin-top:10px; align-items:center;}

  /* 同步弹窗 */
  .sync-status {
    padding: 10px 12px; border-radius: 10px; font-size: 12px;
    background: var(--input-bg); border: 1px solid var(--border);
    margin-bottom: 14px; line-height: 1.6; white-space: pre-wrap;
  }
  .sync-status.ok { border-color: #22c55e; background: rgba(34,197,94,.08); color: #22c55e; }
  .sync-status.err { border-color: #ef4444; background: rgba(239,68,68,.08); color: #ef4444; }
  .sync-status.info { border-color: var(--accent); background: rgba(200,102,47,.06); color: var(--accent); }
  .checkbox-row {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 0;
  }
  .checkbox-row input[type="checkbox"] { width: auto; }
  .checkbox-row label { margin: 0; font-size: 13px; color: var(--text); cursor: pointer; }
  .help-text {
    font-size: 11px; color: var(--muted); margin-top: 6px; line-height: 1.6;
  }
  .help-text code {
    background: var(--input-bg); padding: 1px 5px; border-radius: 4px;
    font-family: ui-monospace, monospace; font-size: 10px;
  }
  .help-text a { color: var(--accent); }

  @media (max-width: 640px) {
    .board-selector { max-width: 100px; font-size: 12px; }
    .list { flex: 0 0 250px; width: 250px; }
  }
</style>
</head>
<body>

<header>
  <span class="logo">🌰</span>
  <select class="board-selector" id="boardSelect"></select>
  <button class="btn small" id="addBoardBtn">＋ 看板</button>
  <button class="btn primary small" id="addListBtn">＋ 列表</button>
  <div class="spacer"></div>
  <button class="btn icon" id="syncBtn" title="GitHub 同步">☁️</button>
  <button class="btn icon" id="settingsBtn" title="设置">⚙️</button>
  <button class="btn icon" id="themeToggle" title="切换深色/浅色">🌙</button>
</header>

<div id="breadcrumb"></div>
<main id="board"></main>

<!-- 卡片编辑弹窗 -->
<div class="overlay" id="overlay">
  <div class="modal">
    <input id="mTitle" class="m-title" placeholder="卡片标题">
    <textarea id="mDesc" placeholder="添加更详细的描述…"></textarea>
    <div class="field">
      <label>所属列表</label>
      <select id="mList"></select>
    </div>
    <div class="field">
      <label>标签</label>
      <input id="mTags" placeholder="用逗号分隔，如：设计, 紧急">
    </div>
    <div class="grid2">
      <div class="field">
        <label>优先级</label>
        <select id="mPriority">
          <option value="none">无</option> <option value="low">低</option>
          <option value="medium">中</option> <option value="high">高</option>
        </select>
      </div>
      <div class="field">
        <label>截止日期</label>
        <input type="date" id="mDue">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn danger" id="mDelete">删除</button>
      <div class="spacer"></div>
      <button class="btn primary" id="mEnterSubBoard" style="display:none;">进入子看板</button>
      <button class="btn" id="mCancel">取消</button>
      <button class="btn primary" id="mSave">保存</button>
    </div>
  </div>
</div>

<!-- 快捷移动弹窗 -->
<div class="overlay" id="quickMoveOverlay">
  <div class="modal" style="align-self:flex-end; max-width:100%; border-radius:16px 16px 0 0;">
    <h3 style="font-size:16px; margin-bottom:15px; text-align:center; color:var(--muted); font-weight:600;">选择要移动到的列表</h3>
    <div id="quickMoveList"></div>
    <button class="btn danger" id="quickMoveCancel" style="width:100%; margin-top:10px;">取消</button>
  </div>
</div>

<!-- 列表重命名弹窗 -->
<div class="overlay" id="renameListOverlay">
  <div class="modal" style="max-width:380px;">
    <h3 style="font-size:16px; margin-bottom:15px; text-align:center;">重命名列表</h3>
    <input id="renameListInput" placeholder="输入新的列表名称">
    <div class="modal-actions" style="margin-top:14px;">
      <button class="btn" id="renameListCancel" style="flex:1;">取消</button>
      <button class="btn primary" id="renameListConfirm" style="flex:1;">确定</button>
    </div>
  </div>
</div>

<!-- 设置弹窗 -->
<div class="overlay" id="settingsOverlay">
  <div class="modal" style="max-width:420px;">
    <div class="m-title">⚙️ 设置</div>
    <div style="display:flex; flex-direction:column; gap:8px;">
      <button class="btn" id="renameBoardBtn">✎ 重命名当前看板</button>
      <button class="btn danger" id="delBoardBtn">🗑 删除当前看板</button>
      <button class="btn" id="exportBtn">📊 导出 Excel（CSV）</button>
      <button class="btn" id="backupBtn">📥 备份 JSON</button>
      <button class="btn" id="importBtn">📤 导入 JSON</button>
      <input type="file" id="importFileInput" accept=".json" style="display:none;">
      <button class="btn danger" id="resetBtn">⚠️ 重置全部数据</button>
    </div>
    <div class="modal-actions" style="margin-top:14px;">
      <button class="btn" id="settingsCloseBtn" style="flex:1;">关闭</button>
    </div>
  </div>
</div>

<!-- GitHub 同步弹窗 -->
<div class="overlay" id="syncOverlay">
  <div class="modal" style="max-width:480px;">
    <div class="m-title">☁️ GitHub 同步</div>

    <div class="sync-status" id="syncStatusBox">检查配置...</div>

    <div class="field">
      <label>GitHub Token（只存在本机，不会上传）</label>
      <input type="password" id="ghTokenInput" placeholder="ghp_xxxxxxxxxx 或 github_pat_xxx">
      <div class="help-text">
        去 <a href="https://github.com/settings/tokens" target="_blank">github.com/settings/tokens</a>
        生成一个 <b>Classic token</b>，只需勾选 <code>gist</code> 权限。建议设置有效期 90 天以上。
      </div>
    </div>

    <div class="field">
      <label>Gist ID</label>
      <input type="text" id="ghGistInput" placeholder="例如 a1b2c3d4e5f6...">
      <div class="help-text">
        <b>首次使用：</b>先去 <a href="https://gist.github.com" target="_blank">gist.github.com</a> 创建一个 <b>Secret</b> Gist，
        文件名填 <code>kanban.json</code>，内容填 <code>{}</code>。创建后地址栏最后一段就是 Gist ID。
      </div>
    </div>

    <div class="checkbox-row">
      <input type="checkbox" id="autoSyncCheck">
      <label for="autoSyncCheck">自动同步（每次修改后 3 秒自动上传）</label>
    </div>

    <div class="modal-actions" style="margin-top:10px;">
      <button class="btn" id="testConnBtn">🔌 测试连接</button>
      <button class="btn" id="syncPullBtn">⬇️ 从云端拉取</button>
      <button class="btn primary" id="syncPushBtn">⬆️ 推送到云端</button>
    </div>
    <div class="modal-actions" style="margin-top:8px;">
      <button class="btn" id="syncSaveConfigBtn" style="flex:1;">💾 保存配置</button>
      <button class="btn" id="syncCloseBtn" style="flex:1;">关闭</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   数据层
   ========================================================= */
const STORAGE_KEY = 'chestnut-kanban-v5';
const THEME_KEY = 'chestnut-kanban-theme';
const GH_TOKEN_KEY = 'chestnut-kanban-gh-token';
const GH_GIST_KEY = 'chestnut-kanban-gh-gist';
const AUTO_SYNC_KEY = 'chestnut-kanban-auto-sync';
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const PRIORITY = {
  high:   { label: '高', cls: 'high' },
  medium: { label: '中', cls: 'medium' },
  low:    { label: '低', cls: 'low' },
  none:   { label: '',   cls: '' }
};

function defaultData() {
  const board = {
    id: uid(),
    name: '我的看板',
    lists: [
      { id: uid(), title: '待办', cards: [
        { id: uid(), title: '欢迎使用栗子看板 🌰', desc: '点击卡片可以编辑详情。', tags: ['入门'], priority: 'high', due: '', subBoard: null, isExpanded: false },
        { id: uid(), title: '点列表标题可以重命名', desc: '点列表标题即可修改列名。', tags: ['功能'], priority: 'medium', due: '', subBoard: null, isExpanded: false }
      ] },
      { id: uid(), title: '进行中', cards: [] },
      { id: uid(), title: '已完成', cards: [] }
    ]
  };
  return { boards: [board], currentBoardId: board.id };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('chestnut-kanban-v4');
    if (raw) {
      const d = JSON.parse(raw);
      if (d && Array.isArray(d.boards) && d.boards.length > 0) {
        if (!d.currentBoardId || !d.boards.some(b => b.id === d.currentBoardId)) {
          d.currentBoardId = d.boards[0].id;
        }
        return d;
      }
      if (d && Array.isArray(d.lists)) {
        const upgradeBoard = { id: uid(), name: '我的看板', lists: d.lists };
        return { boards: [upgradeBoard], currentBoardId: upgradeBoard.id };
      }
    }
  } catch (e) {}
  return defaultData();
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  if (autoSyncEnabled) schedulePush();
}

let state = loadState();
let boardStack = [];
let editing = null;
let renamingListId = null;

function getCurrentBoard() {
  let b = state.boards.find(b => b.id === state.currentBoardId);
  if (!b) { b = state.boards[0]; if (b) state.currentBoardId = b.id; }
  return b;
}

function syncBoardStack() {
  const b = getCurrentBoard();
  boardStack = [{ lists: b.lists, title: b.name }];
}

/* =========================================================
   GitHub 同步
   ========================================================= */
let ghToken = localStorage.getItem(GH_TOKEN_KEY) || '';
let ghGistId = localStorage.getItem(GH_GIST_KEY) || '';
let autoSyncEnabled = localStorage.getItem(AUTO_SYNC_KEY) === '1';
let _isPushing = false;
let _pushTimer = null;
let _lastSyncTime = null;

function setSyncStatus(msg, type) {
  const box = document.getElementById('syncStatusBox');
  if (!box) return;
  box.textContent = msg;
  box.className = 'sync-status ' + (type || '');
}

function schedulePush() {
  if (_pushTimer) clearTimeout(_pushTimer);
  _pushTimer = setTimeout(() => { pushToCloud({ silent: true }); }, 3000);
}

// 读取 gist 里的 kanban.json
async function ghFetchGist() {
  const res = await fetch(`https://api.github.com/gists/${ghGistId}`, {
    headers: {
      'Authorization': `token ${ghToken}`,
      'Accept': 'application/vnd.github+json'
    }
  });
  if (!res.ok) {
    const txt = await res.text();
    throw new Error(`HTTP ${res.status}: ${txt.slice(0, 150)}`);
  }
  return res.json();
}

// 更新 gist 里的 kanban.json
async function ghUpdateGist(content) {
  const res = await fetch(`https://api.github.com/gists/${ghGistId}`, {
    method: 'PATCH',
    headers: {
      'Authorization': `token ${ghToken}`,
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      files: {
        'kanban.json': { content: content }
      }
    })
  });
  if (!res.ok) {
    const txt = await res.text();
    throw new Error(`HTTP ${res.status}: ${txt.slice(0, 150)}`);
  }
  return res.json();
}

// 测试连接
async function testConnection() {
  if (!ghToken || !ghGistId) {
    setSyncStatus('❌ 请先填写 Token 和 Gist ID', 'err');
    return false;
  }
  try {
    setSyncStatus('🔌 正在测试连接...', 'info');
    const gist = await ghFetchGist();
    const file = gist.files && gist.files['kanban.json'];
    if (!file) {
      setSyncStatus('⚠️ 连接成功，但 Gist 里没有 kanban.json 文件。请检查文件名。', 'info');
      return false;
    }
    setSyncStatus(`✅ 连接成功！\nGist 文件大小：${file.size} 字节\n最后更新：${new Date(gist.updated_at).toLocaleString()}`, 'ok');
    return true;
  } catch (e) {
    setSyncStatus('❌ 连接失败：' + e.message, 'err');
    return false;
  }
}

// 推送到云端
async function pushToCloud(opts = {}) {
  if (!ghToken || !ghGistId) {
    if (!opts.silent) setSyncStatus('❌ 请先填写 Token 和 Gist ID', 'err');
    return;
  }
  try {
    _isPushing = true;
    setSyncStatus('⏫ 上传中...', 'info');
    const content = JSON.stringify(state, null, 2);
    await ghUpdateGist(content);
    _lastSyncTime = new Date();
    setSyncStatus('✅ 已上传到 GitHub（' + _lastSyncTime.toLocaleTimeString() + '）', 'ok');
  } catch (e) {
    console.error(e);
    setSyncStatus('❌ 上传失败：' + e.message, 'err');
    if (!opts.silent) alert('上传失败：' + e.message);
  } finally {
    setTimeout(() => { _isPushing = false; }, 500);
  }
}

// 从云端拉取
async function pullFromCloud(opts = {}) {
  if (!ghToken || !ghGistId) {
    if (!opts.silent) setSyncStatus('❌ 请先填写 Token 和 Gist ID', 'err');
    return;
  }
  try {
    setSyncStatus('⏬ 拉取中...', 'info');
    const gist = await ghFetchGist();
    const file = gist.files && gist.files['kanban.json'];
    if (!file) {
      setSyncStatus('⚠️ Gist 里没有 kanban.json 文件', 'err');
      return;
    }
    const raw = file.content || '';
    if (!raw.trim() || raw.trim() === '{}') {
      setSyncStatus('ℹ️ 云端还是空的（kanban.json 内容是 {}），请先点「推送到云端」上传。', 'info');
      return;
    }
    const cloudData = JSON.parse(raw);
    if (!cloudData.boards || !Array.isArray(cloudData.boards)) {
      throw new Error('云端数据格式不对（不是看板数据）');
    }
    // 拉取时不要触发自动同步回推
    _isPushing = true;
    state = cloudData;
    if (!state.currentBoardId || !state.boards.some(b => b.id === state.currentBoardId)) {
      state.currentBoardId = state.boards[0].id;
    }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    syncBoardStack();
    renderBoardSelect();
    render();
    setTimeout(() => { _isPushing = false; }, 500);

    _lastSyncTime = new Date();
    setSyncStatus('✅ 已从 GitHub 同步（' + _lastSyncTime.toLocaleTimeString() + '）', 'ok');
  } catch (e) {
    console.error(e);
    setSyncStatus('❌ 拉取失败：' + e.message, 'err');
    if (!opts.silent) alert('拉取失败：' + e.message);
  }
}

/* =========================================================
   渲染
   ========================================================= */
function render() {
  const currentBoard = boardStack[boardStack.length - 1];

  if (boardStack.length > 1) {
    breadcrumb.classList.add('show');
    breadcrumb.innerHTML = boardStack.map((b, i) => {
      if (i === boardStack.length - 1) return `<span class="current">${esc(b.title)}</span>`;
      return `<span onclick="goBackTo(${i})">${esc(b.title)}</span><span class="arrow">›</span>`;
    }).join('');
  } else {
    breadcrumb.classList.remove('show');
  }

  const listsHtml = currentBoard.lists.map(renderList).join('');
  const addListBtnHtml = `
    <button class="add-list-btn" id="addListInlineBtn" title="添加新列表">
      <span style="font-size:18px; line-height:1;">＋</span> 列表
    </button>
  `;
  board.innerHTML = listsHtml + addListBtnHtml;

  document.getElementById('addListInlineBtn').onclick = () => {
    const title = prompt('新列表名称', '新列表');
    if (title === null) return;
    const cb = boardStack[boardStack.length - 1];
    cb.lists.push({ id: uid(), title: title.trim() || '新列表', cards: [] });
    render();
    saveState();
  };

  saveState();
}

function renderList(list) {
  return `
    <div class="list" data-id="${list.id}">
      <div class="list-header">
        <span class="list-title" data-act="rename-list" data-list-id="${list.id}" title="点击重命名">${esc(list.title)}</span>
        <span class="list-count">${list.cards.length}</span>
        <button class="icon-btn" data-act="del-list" data-list-id="${list.id}" title="删除列表">✕</button>
      </div>
      <div class="cards" data-list="${list.id}">
        ${list.cards.map(renderCard).join('')}
      </div>
      <button class="add-card-btn" data-act="add-card" data-list-id="${list.id}">＋ 添加卡片</button>
    </div>
  `;
}

function renderCard(card) {
  const today = new Date().toISOString().slice(0, 10);
  const p = PRIORITY[card.priority] || PRIORITY.none;
  const tags = (card.tags && card.tags.length) ? `<div class="card-tags">${card.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : '';
  const due = card.due ? `<span class="due${card.due < today ? ' overdue' : ''}">📅 ${esc(card.due.slice(5))}</span>` : '';
  const pri = p.label ? `<span class="pri ${p.cls}">${p.label}</span>` : '';
  const meta = (due || pri) ? `<div class="card-meta">${due}${pri}</div>` : '';
  const pClass = card.priority && card.priority !== 'none' ? ` p-${card.priority}` : '';

  let subBoardHtml = '';
  if (card.subBoard) {
    const isExpanded = card.isExpanded || false;
    const totalCards = card.subBoard.lists.reduce((sum, list) => sum + list.cards.length, 0);
    let contentHtml = '';
    if (isExpanded) {
      if (totalCards === 0) {
        contentHtml = '<div class="empty-sub">子看板为空</div>';
      } else {
        card.subBoard.lists.forEach(list => {
          contentHtml += `<div class="sub-list-title">📁 ${esc(list.title)} (${list.cards.length})</div>`;
          list.cards.forEach(c => {
            contentHtml += `<div class="sub-card-item" data-sub-card-id="${c.id}" data-sub-list-id="${list.id}">${esc(c.title)} <span style="color:var(--muted);font-size:11px;">›</span></div>`;
          });
        });
      }
    }
    subBoardHtml = `
      <div class="sub-board-preview" style="display: ${isExpanded ? 'block' : 'none'};">
        ${contentHtml}
      </div>
    `;
  }

  const subBoardBtn = card.subBoard
    ? `<button class="expand-sub-btn ${card.isExpanded ? 'expanded' : ''}" data-act="toggle-sub" data-card-id="${card.id}">${card.isExpanded ? '[-] 收起' : '[+] 子看板'}</button>`
    : '';

  const upBtn = `<button class="action-btn" data-act="move-up" data-card-id="${card.id}" title="上移">↑</button>`;
  const downBtn = `<button class="action-btn" data-act="move-down" data-card-id="${card.id}" title="下移">↓</button>`;

  return `
    <div class="card${pClass}" data-id="${card.id}">
      <div class="card-main">
        ${tags}
        <div class="card-title">${esc(card.title)}</div>
        ${meta}
      </div>
      ${subBoardHtml}
      <div class="card-footer">
        <div class="footer-left">
          ${upBtn}
          ${downBtn}
        </div>
        <div class="footer-right">
          <button class="quick-move-btn" data-act="quick-move" data-card-id="${card.id}">⇄ 移动</button>
          ${subBoardBtn}
        </div>
      </div>
    </div>
  `;
}

/* =========================================================
   层级切换
   ========================================================= */
window.goBackTo = function(index) {
  boardStack = boardStack.slice(0, index + 1);
  render();
};

function enterSubBoard(card) {
  if (!card.subBoard) {
    card.subBoard = { lists: [{ id: uid(), title: '子任务', cards: [] }] };
    card.isExpanded = true;
  }
  boardStack.push({ lists: card.subBoard.lists, title: card.title });
  closeModal();
  render();
}

/* =========================================================
   优先级移动
   ========================================================= */
function moveCardPriority(cardId, direction) {
  const currentBoard = boardStack[boardStack.length - 1];
  for (const list of currentBoard.lists) {
    const index = list.cards.findIndex(c => c.id === cardId);
    if (index !== -1) {
      const targetIndex = index + direction;
      if (targetIndex >= 0 && targetIndex < list.cards.length) {
        const temp = list.cards[index];
        list.cards[index] = list.cards[targetIndex];
        list.cards[targetIndex] = temp;
        render();
        saveState();
      }
      return;
    }
  }
}

/* =========================================================
   快捷移动
   ========================================================= */
function openQuickMoveMenu(cardId) {
  const currentBoard = boardStack[boardStack.length - 1];
  quickMoveList.innerHTML = '';

  let currentListId = '';
  currentBoard.lists.forEach(list => {
    if (list.cards.some(c => c.id === cardId)) currentListId = list.id;
  });

  currentBoard.lists.forEach(list => {
    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.style.cssText = 'display:block;width:100%;padding:12px;margin-bottom:8px;text-align:center;font-size:15px;';
    btn.textContent = list.title;
    if (list.id === currentListId) {
      btn.textContent += ' (当前列表)';
      btn.disabled = true;
      btn.style.opacity = '0.5';
    }
    btn.onclick = () => {
      moveCard(cardId, list.id);
      quickMoveOverlay.classList.remove('show');
    };
    quickMoveList.appendChild(btn);
  });

  quickMoveOverlay.classList.add('show');
}

function moveCard(cardId, targetListId) {
  const currentBoard = boardStack[boardStack.length - 1];
  let cardToMove = null;
  let sourceList = null;

  for (const list of currentBoard.lists) {
    const idx = list.cards.findIndex(c => c.id === cardId);
    if (idx !== -1) {
      sourceList = list;
      cardToMove = list.cards.splice(idx, 1)[0];
      break;
    }
  }

  if (cardToMove && sourceList && sourceList.id !== targetListId) {
    const targetList = currentBoard.lists.find(l => l.id === targetListId);
    if (targetList) targetList.cards.push(cardToMove);
    else sourceList.cards.push(cardToMove);
  }

  render();
  saveState();
}

document.getElementById('quickMoveCancel').onclick = () => quickMoveOverlay.classList.remove('show');

   列表重命名

/* =========================================================
   卡片详情弹窗
   ========================================================= */
function openCard(cardId) {
  const currentBoard = boardStack[boardStack.length - 1];
  for (const list of currentBoard.lists) {
    const card = list.cards.find(c => c.id === cardId);
    if (!card) continue;
    editing = { listId: list.id, cardId };
    mTitle.value = card.title;
    mDesc.value = card.desc || '';
    mTags.value = (card.tags || []).join(', ');
    mPriority.value = card.priority || 'none';
    mDue.value = card.due || '';

    mList.innerHTML = currentBoard.lists.map(l =>
      `<option value="${l.id}" ${l.id === list.id ? 'selected' : ''}>${esc(l.title)}</option>`
    ).join('');

    if (card.subBoard) {
      mEnterSubBoard.textContent = '进入子看板';
    } else {
      mEnterSubBoard.textContent = '创建子看板';
    }
    mEnterSubBoard.style.display = 'block';

    overlay.classList.add('show');
    setTimeout(() => { mTitle.focus(); mTitle.select(); }, 30);
    return;
  }
}

function closeModal() { overlay.classList.remove('show'); editing = null; }

document.getElementById('mCancel').onclick = closeModal;
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && overlay.classList.contains('show')) closeModal(); });
mTitle.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('mSave').click(); });

document.getElementById('mSave').onclick = () => {
  if (!editing) return closeModal();
  const currentBoard = boardStack[boardStack.length - 1];
  const list = currentBoard.lists.find(l => l.id === editing.listId);
  const card = list && list.cards.find(c => c.id === editing.cardId);
  if (!card) return closeModal();

  card.title = mTitle.value.trim() || '未命名卡片';
  card.desc = mDesc.value.trim();
  card.tags = mTags.value.split(/[,，]/).map(s => s.trim()).filter(Boolean);
  card.priority = mPriority.value;
  card.due = mDue.value;

  const newListId = mList.value;
  if (newListId !== editing.listId) {
    const oldList = currentBoard.lists.find(l => l.id === editing.listId);
    const idx = oldList.cards.findIndex(c => c.id === editing.cardId);
    const [moved] = oldList.cards.splice(idx, 1);
    const newList = currentBoard.lists.find(l => l.id === newListId);
    if (newList) newList.cards.push(moved);
  }
  closeModal(); render();
};

document.getElementById('mEnterSubBoard').onclick = () => {
  if (!editing) return;
  const currentBoard = boardStack[boardStack.length - 1];
  const list = currentBoard.lists.find(l => l.id === editing.listId);
  const card = list && list.cards.find(c => c.id === editing.cardId);
  if (card) enterSubBoard(card);
};

document.getElementById('mDelete').onclick = () => {
  if (!editing) return;
  if (!confirm('确定删除这张卡片？子看板也会被删除。')) return;
  const currentBoard = boardStack[boardStack.length - 1];
  const list = currentBoard.lists.find(l => l.id === editing.listId);
  if (list) list.cards = list.cards.filter(c => c.id !== editing.cardId);
  closeModal(); render();
};

/* =========================================================
   看板点击事件
   ========================================================= */
board.addEventListener('click', (e) => {
  const upBtn = e.target.closest('[data-act="move-up"]');
  if (upBtn) { e.stopPropagation(); moveCardPriority(upBtn.dataset.cardId, -1); return; }
  const downBtn = e.target.closest('[data-act="move-down"]');
  if (downBtn) { e.stopPropagation(); moveCardPriority(downBtn.dataset.cardId, 1); return; }

  const moveBtn = e.target.closest('[data-act="quick-move"]');
  if (moveBtn) { e.stopPropagation(); openQuickMoveMenu(moveBtn.dataset.cardId); return; }

  const toggleBtn = e.target.closest('[data-act="toggle-sub"]');
  if (toggleBtn) {
    e.stopPropagation();
    const cardId = toggleBtn.dataset.cardId;
    const currentBoard = boardStack[boardStack.length - 1];
    for (const list of currentBoard.lists) {
      const card = list.cards.find(c => c.id === cardId);
      if (card) { card.isExpanded = !card.isExpanded; break; }
    }
    render(); saveState(); return;
  }

  const subCardItem = e.target.closest('.sub-card-item');
  if (subCardItem) {
    e.stopPropagation();
    const cardEl = e.target.closest('.card');
    if (cardEl) {
      const cardId = cardEl.dataset.id;
      const currentBoard = boardStack[boardStack.length - 1];
      for (const list of currentBoard.lists) {
        const card = list.cards.find(c => c.id === cardId);
        if (card && card.subBoard) {
          boardStack.push({ lists: card.subBoard.lists, title: card.title });
          render(); break;
        }
      }
    }
    return;
  }

  const actEl = e.target.closest('[data-act]');
  if (actEl) {
    const act = actEl.dataset.act;
    const listId = actEl.dataset.listId || (actEl.closest('.list') && actEl.closest('.list').dataset.id);

    if (act === 'add-card') {
      const listEl = actEl.closest('.list');
      startAddCard(listEl, listId);
      return;
    }
    if (act === 'del-list') {
      const currentBoard = boardStack[boardStack.length - 1];
      const list = currentBoard.lists.find(l => l.id === listId);
      if (!list) return;
      if (currentBoard.lists.length <= 1) { alert('至少保留一个列表'); return; }
      if (confirm(`确定删除列表「${list.title}」及其所有卡片吗？`)) {
        currentBoard.lists = currentBoard.lists.filter(l => l.id !== listId);
        render();
      }
      return;
    }
    if (act === 'rename-list') {
      const currentBoard = boardStack[boardStack.length - 1];
      const list = currentBoard.lists.find(l => l.id === listId);
      if (!list) return;
      openRenameListModal(listId, list.title);
      return;
    }
  }

  const cardEl = e.target.closest('.card');
  if (cardEl) openCard(cardEl.dataset.id);
});

/* ---------- 快速添加卡片 ---------- */
function startAddCard(listEl, listId) {
  if (!listEl) return;
  const exist = listEl.querySelector('.composer textarea');
  if (exist) { exist.focus(); return; }

  const cardsEl = listEl.querySelector('.cards');
  const composer = document.createElement('div');
  composer.className = 'composer';
  const ta = document.createElement('textarea');
  ta.placeholder = '输入标题，回车添加（Esc 取消）';
  composer.appendChild(ta);
  cardsEl.appendChild(composer);
  ta.focus();
  cardsEl.scrollTop = cardsEl.scrollHeight;

  const commit = () => {
    const v = ta.value.trim();
    if (!v) { composer.remove(); return; }
    const currentBoard = boardStack[boardStack.length - 1];
    const list = currentBoard.lists.find(l => l.id === listId);
    if (!list) return;
    list.cards.push({ id: uid(), title: v, desc: '', tags: [], priority: 'none', due: '', subBoard: null, isExpanded: false });
    render();
  };

  ta.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); commit(); }
    else if (ev.key === 'Escape') { composer.remove(); }
  });
  ta.addEventListener('blur', () => {
    setTimeout(() => { if (composer.isConnected && !ta.value.trim()) composer.remove(); }, 150);
  });
}

document.getElementById('delBoardBtn').onclick = () => {
  if (state.boards.length <= 1) { alert('至少保留一个看板'); return; }
  const b = getCurrentBoard();
  if (!confirm(`确定删除看板「${b.name}」及其所有内容吗？`)) return;
  state.boards = state.boards.filter(x => x.id !== b.id);
  state.currentBoardId = state.boards[0].id;
  syncBoardStack();
  renderBoardSelect();
  saveState();
  render();
  settingsOverlay.classList.remove('show');
};

document.getElementById('exportBtn').onclick = () => {
  const cb = boardStack[boardStack.length - 1];
  const boardName = boardStack[0].title;
  let csv = `\uFEFF看板: ${boardName}\n列表,标题,描述,标签,优先级,截止日期\n`;
  cb.lists.forEach(list => {
    list.cards.forEach(card => {
      const tags = (card.tags || []).join(' ');
      const clean = s => String(s || '').replace(/"/g, '""').replace(/\n/g, ' ');
      csv += [
        `"${clean(list.title)}"`,
        `"${clean(card.title)}"`,
        `"${clean(card.desc)}"`,
        `"${clean(tags)}"`,
        `"${card.priority || 'none'}"`,
        `"${card.due || ''}"`
      ].join(',') + '\n';
    });
  });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `栗子看板_${boardName}_${new Date().toISOString().slice(0,10)}.csv`;
  link.click();
  URL.revokeObjectURL(link.href);
};

document.getElementById('backupBtn').onclick = () => {
  const dataStr = JSON.stringify(state, null, 2);
  const blob = new Blob([dataStr], { type: 'application/json' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `栗子看板备份_${new Date().toISOString().slice(0,10)}.json`;
  link.click();
  URL.revokeObjectURL(link.href);
};

const importFileInput = document.getElementById('importFileInput');
document.getElementById('importBtn').onclick = () => importFileInput.click();

importFileInput.onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const importedData = JSON.parse(ev.target.result);
      if (importedData && Array.isArray(importedData.boards)) {
        if (confirm('导入会覆盖当前所有数据，确定吗？')) {
          state = importedData;
          if (!state.currentBoardId || !state.boards.some(b => b.id === state.currentBoardId)) {
            state.currentBoardId = state.boards[0].id;
          }
          syncBoardStack();
          renderBoardSelect();
          saveState();
          render();
          alert('✅ 数据导入成功！');
        }
        return;
      }
      if (importedData && Array.isArray(importedData.lists)) {
        if (confirm('导入会覆盖当前所有数据，确定吗？')) {
          const upgradeBoard = { id: uid(), name: '导入的看板', lists: importedData.lists };
          state = { boards: [upgradeBoard], currentBoardId: upgradeBoard.id };
          syncBoardStack();
          renderBoardSelect();
          saveState();
          render();
          alert('✅ 数据导入成功！');
        }
        return;
      }
      alert('❌ 文件格式错误');
    } catch (err) { alert('❌ 读取失败'); }
  };
  reader.readAsText(file);
  importFileInput.value = '';
};

document.getElementById('resetBtn').onclick = () => {
  const answer = prompt(
    '⚠️ 重置会清空所有数据，且不可恢复。\n\n' +
    '如果确定要重置，请手动输入：\n' +
    '我知道重置会把所有内容清空'
  );
  if (answer !== '我知道重置会把所有内容清空') {
    if (answer !== null) alert('❌ 输入不正确，重置已取消。');
    return;
  }
  state = defaultData();
  syncBoardStack();
  renderBoardSelect();
  saveState();
  render();
  settingsOverlay.classList.remove('show');
  alert('✅ 已重置。');
};

/* =========================================================
   GitHub 同步 UI
   ========================================================= */
const syncBtn = document.getElementById('syncBtn');
const ghTokenInput = document.getElementById('ghTokenInput');
const ghGistInput = document.getElementById('ghGistInput');
const autoSyncCheck = document.getElementById('autoSyncCheck');

syncBtn.onclick = () => {
  ghTokenInput.value = ghToken;
  ghGistInput.value = ghGistId;
  autoSyncCheck.checked = autoSyncEnabled;
  if (!ghToken || !ghGistId) {
    setSyncStatus('ℹ️ 首次使用，请按下面的说明配置：\n1. 生成 GitHub Token（只需 gist 权限）\n2. 创建一个 Gist，文件名 kanban.json，内容 {}\n3. 把 Token 和 Gist ID 填进来，点「保存配置」\n4. 点「推送到云端」上传当前数据', 'info');
  } else if (_lastSyncTime) {
    setSyncStatus('✅ 上次同步：' + _lastSyncTime.toLocaleString(), 'ok');
  } else {
    setSyncStatus('ℹ️ 已配置。可点「测试连接」验证，或直接「推送到云端」。', 'info');
  }
  syncOverlay.classList.add('show');
};

document.getElementById('syncCloseBtn').onclick = () => syncOverlay.classList.remove('show');
syncOverlay.addEventListener('click', e => { if (e.target === syncOverlay) syncOverlay.classList.remove('show'); });

document.getElementById('syncSaveConfigBtn').onclick = () => {
  ghToken = ghTokenInput.value.trim();
  ghGistId = ghGistInput.value.trim();
  localStorage.setItem(GH_TOKEN_KEY, ghToken);
  localStorage.setItem(GH_GIST_KEY, ghGistId);
  setSyncStatus('✅ 配置已保存到本机。可点「测试连接」验证。', 'ok');
};

document.getElementById('testConnBtn').onclick = () => {
  ghToken = ghTokenInput.value.trim();
  ghGistId = ghGistInput.value.trim();
  localStorage.setItem(GH_TOKEN_KEY, ghToken);
  localStorage.setItem(GH_GIST_KEY, ghGistId);
  testConnection();
};

autoSyncCheck.onchange = () => {
  autoSyncEnabled = autoSyncCheck.checked;
  localStorage.setItem(AUTO_SYNC_KEY, autoSyncEnabled ? '1' : '0');
  if (autoSyncEnabled && ghToken && ghGistId) {
    pushToCloud({ silent: true });
  }
};

document.getElementById('syncPushBtn').onclick = () => {
  ghToken = ghTokenInput.value.trim();
  ghGistId = ghGistInput.value.trim();
  localStorage.setItem(GH_TOKEN_KEY, ghToken);
  localStorage.setItem(GH_GIST_KEY, ghGistId);
  pushToCloud();
};

document.getElementById('syncPullBtn').onclick = () => {
  ghToken = ghTokenInput.value.trim();
  ghGistId = ghGistInput.value.trim();
  localStorage.setItem(GH_TOKEN_KEY, ghToken);
  localStorage.setItem(GH_GIST_KEY, ghGistId);
  if (!confirm('拉取会用云端数据覆盖本地，确定吗？')) return;
  pullFromCloud();
};

/* =========================================================
   初始化
   ========================================================= */
syncBoardStack();
renderBoardSelect();
render();
</script>
