<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🌰 栗子看板</title>
<style>
  :root{
    --bg:#f5f2ed; --list-bg:#e9e4db; --card-bg:#fff; --text:#2e2a26;
    --muted:#8c8377; --accent:#c8662f; --border:#e2dbd1; --input-bg:#fdfcfa;
  }
  body.dark {
    --bg:#121212; --list-bg:#1e1e1e; --card-bg:#2d2d2d; --text:#e0e0e0;
    --muted:#9e9e9e; --accent:#e07b39; --border:#444444; --input-bg:#1e1e1e;
  }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); display:flex; flex-direction:column;
    overflow:hidden; transition: background 0.3s, color 0.3s;
  }
  header{
    display:flex; align-items:center; gap:10px; padding:10px 18px;
    background:var(--card-bg); border-bottom:1px solid var(--border); flex:0 0 auto; z-index:10;
    transition: background 0.3s;
  }
  header h1{font-size:16px; margin:0; font-weight:700;}
  .logo{font-size:20px;} .spacer{flex:1;}
  .btn{
    border:1px solid var(--border); background:var(--card-bg); color:var(--text);
    padding:7px 12px; border-radius:8px; font-size:13px; cursor:pointer; font-family:inherit; transition:.15s;
  }
  .btn:hover{background:var(--list-bg);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.primary:hover{background:#b35726;}
  .btn.danger{color:#d0453a; border-color:#f0cfcc;}
  .btn.danger:hover{background:#fdf1f0;}

  #board{flex:1; display:flex; gap:14px; padding:18px 20px 24px; overflow-x:auto; overflow-y:hidden; align-items:flex-start;}
  .empty{margin:auto; color:var(--muted); font-size:14px;}
  .list{flex:0 0 280px; width:280px; background:var(--list-bg); border-radius:12px; display:flex; flex-direction:column; max-height:100%; padding:4px; transition:background 0.3s;}
  .list-placeholder{flex:0 0 auto; border-radius:12px; background:rgba(0,0,0,.06); border:1px dashed rgba(0,0,0,.15);}
  .list-header{display:flex; align-items:center; gap:8px; padding:8px 10px; cursor:grab; user-select:none;}
  .list-header:active{cursor:grabbing;}
  .list-title{font-weight:600; font-size:14px; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; border-radius:6px; padding:2px 4px; margin:-2px -4px;}
  .list-title:hover{background:rgba(0,0,0,.06);}
  .list-count{font-size:12px; color:var(--muted); background:rgba(0,0,0,.06); border-radius:10px; padding:1px 7px;}
  .icon-btn{border:none; background:transparent; color:var(--muted); font-size:13px; cursor:pointer; padding:2px 6px; border-radius:6px; opacity:0; transition:.15s; line-height:1;}
  .list:hover .icon-btn{opacity:1;} .icon-btn:hover{background:rgba(0,0,0,.08); color:#d0453a;}
  .cards{flex:1; overflow-y:auto; overflow-x:hidden; padding:2px 6px 0; min-height:12px;}
  .cards::-webkit-scrollbar{width:8px;} .cards::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15); border-radius:4px;}

  .card{
    position:relative; overflow:hidden; background:var(--card-bg); border-radius:10px;
    padding:10px 12px; margin-bottom:8px; box-shadow:0 1px 2px rgba(0,0,0,.07);
    cursor:pointer; -webkit-touch-callout: none; user-select: none;
    transition: box-shadow .15s, background 0.3s;
  }
  .card:hover{box-shadow:0 3px 10px rgba(0,0,0,.12);}
  .card::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:transparent;}
  .card.p-high::before{background:#e2574c;} .card.p-medium::before{background:#e8a33d;} .card.p-low::before{background:#3f9d7c;}
  .card-title{font-size:14px; line-height:1.45; word-break:break-word;}
  .card-tags{display:flex; flex-wrap:wrap; gap:4px; margin-bottom:6px;}
  .tag{font-size:11px; padding:1px 7px; border-radius:6px; background:rgba(0,0,0,.05); color:var(--muted);}
  .card-meta{display:flex; align-items:center; gap:8px; margin-top:7px; font-size:11px; color:var(--muted);}
  .due{display:inline-flex; align-items:center; gap:3px;} .due.overdue{color:#d0453a; font-weight:600;}
  .pri{font-size:11px; padding:1px 6px; border-radius:6px; background:rgba(0,0,0,.05);}
  .pri.high{color:#e2574c;} .pri.medium{color:#d08a1e;} .pri.low{color:#3f9d7c;}
  
  /* 新增：图片样式 */
  .card-img { max-width:100%; border-radius:6px; margin-top:8px; display:block; }

  .add-card-btn{margin:6px; padding:8px; border:none; background:transparent; color:var(--muted); text-align:left; border-radius:8px; cursor:pointer; font-size:13px; font-family:inherit; transition:.15s;}
  .add-card-btn:hover{background:rgba(0,0,0,.06); color:var(--text);}
  .composer{padding-bottom:8px;}
  .composer textarea{width:100%; height:62px; resize:none; border:1px solid var(--accent); border-radius:10px; padding:8px 10px; font-size:14px; font-family:inherit; outline:none; background:var(--card-bg); color:var(--text); box-shadow:0 0 0 3px rgba(200,102,47,.1);}

  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:100; padding:20px;}
  .overlay.show{display:flex;}
  .modal{background:var(--card-bg); border-radius:14px; width:100%; max-width:520px; padding:20px; box-shadow:0 20px 60px rgba(0,0,0,.25); max-height:90vh; overflow-y:auto; animation:pop .16s ease-out; transition: background 0.3s;}
  @keyframes pop{from{transform:translateY(8px); opacity:0;} to{transform:none; opacity:1;}}
  .m-title{font-size:17px; font-weight:600; margin-bottom:12px;}
  .modal textarea{width:100%; height:90px; resize:vertical; margin-bottom:14px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px;}
  .modal input[type="text"], .modal select, .modal textarea, .modal input[type="date"]{
    width:100%; border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:14px; font-family:inherit; color:var(--text); background:var(--input-bg); outline:none; transition:.15s;
  }
  .modal input:focus, .modal select:focus, .modal textarea:focus{border-color:var(--accent); background:var(--card-bg); box-shadow:0 0 0 3px rgba(200,102,47,.12);}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .modal-actions{display:flex; gap:8px; margin-top:6px; align-items:center;}
  
  /* 新增：上传按钮样式 */
  .file-upload { display: inline-block; padding:6px 12px; background:var(--list-bg); border:1px dashed var(--border); border-radius:8px; cursor:pointer; font-size:13px; color:var(--muted); text-align:center; width:100%; }
  .file-upload:active { background:var(--border); }
  #mImage { display: none; }
  .img-preview { max-width:100%; max-height:150px; border-radius:6px; margin-top:8px; display:none; }
</style>
</head>
<body>

<header>
  <span class="logo">🌰</span>
  <h1>栗子看板</h1>
  <div class="spacer"></div>
  <button class="btn" id="addListBtn">＋ 新建列表</button>
  <button class="btn" id="exportBtn">导出Excel</button>
  <button class="btn" id="themeToggle" title="切换深色/浅色">🌙</button>
  <button class="btn" id="resetBtn">重置</button>
</header>

<main id="board"></main>

<div class="overlay" id="overlay">
  <div class="modal">
    <input id="mTitle" class="m-title" placeholder="卡片标题">
    <textarea id="mDesc" placeholder="添加更详细的描述…"></textarea>
    
    <!-- 新增：图片上传区域 -->
    <div class="field">
      <label>添加图片（仅限小于500KB的图片）</label>
      <label for="mImage" class="file-upload">📷 点击选择本地图片</label>
      <input type="file" id="mImage" accept="image/*">
      <img id="imgPreview" class="img-preview" src="">
    </div>

    <div class="field">
      <label>所属列表</label>
      <select id="mList"></select>
    </div>
    <div class="field">
      <label>标签</label>
      <input id="mTags" placeholder="用逗号分隔，如：设计, 紧急">
    </div>
    <div class="grid2">
      <div class="field">
        <label>优先级</label>
        <select id="mPriority">
          <option value="none">无</option> <option value="low">低</option>
          <option value="medium">中</option> <option value="high">高</option>
        </select>
      </div>
      <div class="field">
        <label>截止日期</label>
        <input type="date" id="mDue">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn danger" id="mDelete">删除</button>
      <div class="spacer"></div>
      <button class="btn" id="mCancel">取消</button>
      <button class="btn primary" id="mSave">保存</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'chestnut-kanban-v1';
const THEME_KEY = 'chestnut-kanban-theme';
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const PRIORITY = { high:{label:'高',cls:'high'}, medium:{label:'中',cls:'medium'}, low:{label:'低',cls:'low'}, none:{label:'',cls:''} };

function defaultData() {
  return {
    lists: [
      { id: uid(), title: '待办', cards: [ { id: uid(), title: '欢迎使用栗子看板 🌰', desc: '点击卡片可以编辑详情。', tags: ['入门'], priority: 'high', due: '', image: '' } ] },
      { id: uid(), title: '进行中', cards: [] },
      { id: uid(), title: '已完成', cards: [] }
    ]
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { const data = JSON.parse(raw); if (data && Array.isArray(data.lists)) return data; }
  } catch (e) {}
  return defaultData();
}
function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { alert('存储空间不足，图片可能太大导致保存失败！'); } }

let state = loadState();
let listDrag = null; let editing = null;

// 主题切换
const themeBtn = document.getElementById('themeToggle');
function applyTheme(theme) {
  if (theme === 'dark') { document.body.classList.add('dark'); themeBtn.textContent = '☀️'; }
  else { document.body.classList.remove('dark'); themeBtn.textContent = '🌙'; }
}
const savedTheme = localStorage.getItem(THEME_KEY);
if (savedTheme) { applyTheme(savedTheme); } else {
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(prefersDark ? 'dark' : 'light');
}
themeBtn.onclick = () => { const isDark = document.body.classList.contains('dark'); const t = isDark ? 'light' : 'dark'; applyTheme(t); localStorage.setItem(THEME_KEY, t); };

const board = document.getElementById('board');
const overlay = document.getElementById('overlay');
const mTitle = document.getElementById('mTitle');
const mDesc = document.getElementById('mDesc');
const mTags = document.getElementById('mTags');
const mPriority = document.getElementById('mPriority');
const mDue = document.getElementById('mDue');
const mList = document.getElementById('mList');
const mImage = document.getElementById('mImage');
const imgPreview = document.getElementById('imgPreview');

// 新增：当前卡片图片临时变量
let currentImageBase64 = '';

function render() {
  if (!state.lists.length) { board.innerHTML = '<div class="empty">还没有列表，点右上角「新建列表」开始吧</div>'; saveState(); return; }
  board.innerHTML = state.lists.map(renderList).join('');
  saveState();
}

function renderList(list) {
  return `
    <div class="list" data-id="${list.id}">
      <div class="list-header" draggable="true">
        <span class="list-title" data-act="rename-list" title="点击重命名">${esc(list.title)}</span>
        <span class="list-count">${list.cards.length}</span>
        <button class="icon-btn" data-act="del-list" title="删除列表">✕</button>
      </div>
      <div class="cards" data-list="${list.id}">
        ${list.cards.map(renderCard).join('')}
      </div>
      <button class="add-card-btn" data-act="add-card">＋ 添加卡片</button>
    </div>`;
}

function renderCard(card) {
  const today = new Date().toISOString().slice(0, 10);
  const p = PRIORITY[card.priority] || PRIORITY.none;
  const tags = (card.tags && card.tags.length) ? `<div class="card-tags">${card.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : '';
  const due = card.due ? `<span class="due${card.due < today ? ' overdue' : ''}">📅 ${esc(card.due.slice(5))}</span>` : '';
  const pri = p.label ? `<span class="pri ${p.cls}">${p.label}</span>` : '';
  const meta = (due || pri) ? `<div class="card-meta">${due}${pri}</div>` : '';
  const pClass = card.priority && card.priority !== 'none' ? ` p-${card.priority}` : '';
  
  // 新增：渲染图片
  const imgHtml = card.image ? `<img src="${card.image}" class="card-img">` : '';

  return `
    <div class="card${pClass}" data-id="${card.id}">
      ${tags}
      <div class="card-title">${esc(card.title)}</div>
      ${imgHtml}
      ${meta}
    </div>`;
}

document.getElementById('addListBtn').onclick = () => { const title = prompt('新列表名称', '新列表'); if (title !== null) { state.lists.push({ id: uid(), title: title.trim() || '新列表', cards: [] }); render(); } };
document.getElementById('resetBtn').onclick = () => { if (confirm('确定清空所有数据并恢复初始状态吗？')) { state = defaultData(); render(); } };

document.getElementById('exportBtn').onclick = () => {
  let csvContent = "\uFEFF列表,标题,描述,标签,优先级,截止日期\n";
  state.lists.forEach(list => { list.cards.forEach(card => {
    csvContent += [`"${list.title}"`, `"${card.title}"`, `"${(card.desc || '').replace(/"/g, '""')}"`, `"${(card.tags || []).join(' ')}"`, `"${PRIORITY[card.priority]?.label || '无'}"`, `"${card.due || ''}"`].join(",") + "\n";
  }); });
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = '栗子看板导出.csv'; link.click(); URL.revokeObjectURL(link.href);
};

board.addEventListener('click', (e) => {
  const actEl = e.target.closest('[data-act]');
  if (actEl) {
    const listEl = actEl.closest('.list'); const listId = listEl && listEl.dataset.id; const act = actEl.dataset.act;
    if (act === 'add-card') { startAddCard(listEl, listId); return; }
    if (act === 'del-list') { const list = state.lists.find(l => l.id === listId); if (list && confirm(`确定删除列表「${list.title}」？`)) { state.lists = state.lists.filter(l => l.id !== listId); render(); } return; }
    if (act === 'rename-list') { const list = state.lists.find(l => l.id === listId); if (!list) return; const t = prompt('重命名列表', list.title); if (t !== null) { list.title = t.trim() || list.title; render(); } return; }
  }
  const cardEl = e.target.closest('.card');
  if (cardEl) openCard(cardEl.dataset.id);
});

function startAddCard(listEl, listId) {
  if (!listEl) return;
  const exist = listEl.querySelector('.composer textarea'); if (exist) { exist.focus(); return; }
  const cardsEl = listEl.querySelector('.cards'); const composer = document.createElement('div'); composer.className = 'composer';
  const ta = document.createElement('textarea'); ta.placeholder = '输入标题，回车添加（Esc 取消）';
  composer.appendChild(ta); cardsEl.appendChild(composer); ta.focus(); cardsEl.scrollTop = cardsEl.scrollHeight;
  const commit = () => {
    const v = ta.value.trim(); if (!v) { composer.remove(); return; }
    const list = state.lists.find(l => l.id === listId); if (!list) return;
    list.cards.push({ id: uid(), title: v, desc: '', tags: [], priority: 'none', due: '', image: '' });
    render();
  };
  ta.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); commit(); } else if (ev.key === 'Escape') { composer.remove(); } });
  ta.addEventListener('blur', () => { setTimeout(() => { if (composer.isConnected && !ta.value.trim()) composer.remove(); }, 150); });
}

function openCard(cardId) {
  for (const list of state.lists) {
    const card = list.cards.find(c => c.id === cardId); if (!card) continue;
    editing = { listId: list.id, cardId };
    mTitle.value = card.title; mDesc.value = card.desc || ''; mTags.value = (card.tags || []).join(', ');
    mPriority.value = card.priority || 'none'; mDue.value = card.due || '';
    mList.innerHTML = state.lists.map(l => `<option value="${l.id}" ${l.id === list.id ? 'selected' : ''}>${esc(l.title)}</option>`).join('');
    
    // 新增：加载已有图片
    currentImageBase64 = card.image || '';
    if (currentImageBase64) { imgPreview.src = currentImageBase64; imgPreview.style.display = 'block'; }
    else { imgPreview.src = ''; imgPreview.style.display = 'none'; }

    overlay.classList.add('show');
    setTimeout(() => { mTitle.focus(); mTitle.select(); }, 30);
    return;
  }
}

// 新增：处理本地图片选择
mImage.onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 500 * 1024) { // 限制 500KB
    alert('图片太大啦！为了不撑爆浏览器存储，请选择小于 500KB 的小图片。\n可以先用微信/截图工具压缩一下。');
    mImage.value = ''; return;
  }
  const reader = new FileReader();
  reader.onload = (ev) => {
    currentImageBase64 = ev.target.result;
    imgPreview.src = currentImageBase64; imgPreview.style.display = 'block';
  };
  reader.readAsDataURL(file);
};

function closeModal() { overlay.classList.remove('show'); editing = null; mImage.value = ''; }

document.getElementById('mSave').onclick = () => {
  if (!editing) return closeModal();
  const list = state.lists.find(l => l.id === editing.listId); const card = list && list.cards.find(c => c.id === editing.cardId);
  if (!card) return closeModal();

  card.title = mTitle.value.trim() || '未命名卡片';
  card.desc = mDesc.value.trim();
  card.tags = mTags.value.split(/[,，]/).map(s => s.trim()).filter(Boolean);
  card.priority = mPriority.value; card.due = mDue.value;
  card.image = currentImageBase64; // 新增：保存图片

  const newListId = mList.value;
  if (newListId !== editing.listId) {
    const oldList = state.lists.find(l => l.id === editing.listId);
    const idx = oldList.cards.findIndex(c => c.id === editing.cardId); const [moved] = oldList.cards.splice(idx, 1);
    const newList = state.lists.find(l => l.id === newListId); newList.cards.push(moved);
  }
  closeModal(); render();
};

document.getElementById('mDelete').onclick = () => {
  if (!editing) return; if (!confirm('确定删除这张卡片？')) return;
  const list = state.lists.find(l => l.id === editing.listId); if (list) list.cards = list.cards.filter(c => c.id !== editing.cardId);
  closeModal(); render();
};

document.getElementById('mCancel').onclick = closeModal;
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && overlay.classList.contains('show')) closeModal(); });
mTitle.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('mSave').click(); });

board.addEventListener('dragstart', (e) => { if (e.target.classList && e.target.classList.contains('list-header')) startListDrag(e, e.target.closest('.list')); });
function startListDrag(e, listEl) {
  if (!listEl) return; const ph = document.createElement('div'); ph.className = 'list-placeholder';
  ph.style.width = listEl.getBoundingClientRect().width + 'px'; ph.style.height = listEl.getBoundingClientRect().height + 'px';
  listDrag = { el: listEl, ph }; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', listEl.dataset.id); } catch (err) {} setTimeout(() => listEl.classList.add('dragging'), 0);
}
board.addEventListener('dragover', (e) => { if (listDrag) { e.preventDefault(); const after = getAfterListX(e.clientX); if (after) board.insertBefore(listDrag.ph, after); else board.appendChild(listDrag.ph); } });
board.addEventListener('dragend', () => { if (listDrag) { if (listDrag.ph.isConnected) listDrag.ph.replaceWith(listDrag.el); listDrag.el.classList.remove('dragging'); listDrag = null; syncOrder(); render(); } });
function getAfterListX(x) { const els = [...board.querySelectorAll('.list:not(.dragging)')]; let closest = null, closestOffset = -Infinity; for (const el of els) { const box = el.getBoundingClientRect(); const offset = x - box.left - box.width / 2; if (offset < 0 && offset > closestOffset) { closestOffset = offset; closest = el; } } return closest; }
function syncOrder() { const listEls = [...board.querySelectorAll('.list')]; const newLists = []; for (const le of listEls) { const old = state.lists.find(l => l.id === le.dataset.id); if (!old) continue; const cards = [...le.querySelectorAll('.cards > .card')].map(ce => old.cards.find(c => c.id === ce.dataset.id)).filter(Boolean); newLists.push({ id: old.id, title: old.title, cards }); } if (newLists.length === state.lists.length) state.lists = newLists; }

render();
</script>
</body>
</html>
