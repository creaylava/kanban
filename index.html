<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🌰 栗子看板</title>
<style>
  :root{
    --bg:#f5f2ed; --list-bg:#e9e4db; --card-bg:#fff; --text:#2e2a26;
    --muted:#8c8377; --accent:#c8662f; --border:#e2dbd1; --input-bg:#fdfcfa;
    --sub-bg:#f9f6f2; --sub-border:#e8e0d5;
  }
  body.dark {
    --bg:#121212; --list-bg:#1e1e1e; --card-bg:#2d2d2d; --text:#e0e0e0;
    --muted:#9e9e9e; --accent:#e07b39; --border:#444444; --input-bg:#1e1e1e;
    --sub-bg:#222; --sub-border:#3a3a3a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); display:flex; flex-direction:column;
    overflow:hidden; transition: background 0.3s, color 0.3s;
  }
  
  header{
    display:flex; align-items:center; gap:8px; padding:10px 14px; background:var(--card-bg);
    border-bottom:1px solid var(--border); flex:0 0 auto; z-index:10; flex-wrap: wrap;
    box-shadow:0 2px 5px rgba(0,0,0,.05);
  }
  header h1{font-size:15px; margin:0; font-weight:700; letter-spacing:.3px;}
  .logo{font-size:20px;}
  .spacer{flex:1;}
  .btn{
    border:1px solid var(--border); background:var(--card-bg); color:var(--text);
    padding:6px 11px; border-radius:8px; font-size:12px; cursor:pointer;
    font-family:inherit; transition:.15s; white-space:nowrap;
  }
  .btn:hover{background:var(--list-bg);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.primary:hover{background:#b35726;}
  .btn.danger{color:#d0453a; border-color:#f0cfcc;}
  .btn.danger:hover{background:#fdf1f0;}
  .btn.small{padding:5px 10px; font-size:12px;}

  .board-selector {
    padding:6px 10px; border:1px solid var(--border); border-radius:8px;
    background:var(--input-bg); color:var(--text); font-size:13px; outline:none;
    font-family:inherit; font-weight:600; max-width:150px;
  }

  #breadcrumb {
    display: flex; align-items: center; gap: 8px; padding: 8px 20px;
    background: var(--bg); font-size: 13px; color: var(--muted);
    border-bottom: 1px solid var(--border); display: none;
  }
  #breadcrumb.show { display: flex; }
  #breadcrumb span { cursor: pointer; }
  #breadcrumb span:hover { color: var(--accent); text-decoration: underline; }
  #breadcrumb .current { color: var(--text); font-weight: 600; cursor: default; }
  #breadcrumb .arrow { color: var(--muted); cursor: default; }

  #board{
    flex:1; display:flex; gap:14px; padding:18px 20px 24px;
    overflow-x:auto; overflow-y:hidden; align-items:flex-start;
  }
  .empty{margin:auto; color:var(--muted); font-size:14px;}

  .list{
    flex:0 0 280px; width:280px; background:var(--list-bg);
    border-radius:12px; display:flex; flex-direction:column; max-height:100%; padding:4px;
    transition:background 0.3s;
  }
  .list-header{
    display:flex; align-items:center; gap:6px; padding:8px 10px;
  }
  .list-title{
    font-weight:600; font-size:14px; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    border-radius:6px; padding:4px 6px; margin:-2px -4px;
    cursor: pointer; transition: background 0.15s;
  }
  .list-title:hover{background:rgba(0,0,0,.08);}
  .list-title::after {
    content: '✎';
    font-size: 11px;
    color: var(--muted);
    margin-left: 6px;
    opacity: 0.4;
  }
  .list-title:hover::after { opacity: 0.9; }
  .list-count{
    font-size:12px; color:var(--muted); background:rgba(0,0,0,.06); border-radius:10px; padding:1px 7px;
    flex-shrink: 0;
  }
  .icon-btn{
    border:none; background:transparent; color:var(--muted); font-size:15px;
    cursor:pointer; padding:4px 6px; border-radius:6px;
    line-height:1; flex-shrink: 0; transition:.15s;
  }
  .icon-btn:hover{background:rgba(208,69,58,.15); color:#d0453a;}

  .cards{
    flex:1; overflow-y:auto; overflow-x:hidden; padding:2px 6px 0; min-height:12px;
  }
  .cards::-webkit-scrollbar{width:8px;}
  .cards::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15); border-radius:4px;}

  .card{
    position:relative; overflow:hidden; background:var(--card-bg); border-radius:10px;
    padding:10px 12px 32px 12px; margin-bottom:8px; box-shadow:0 1px 2px rgba(0,0,0,.07);
    cursor:pointer; -webkit-touch-callout: none; user-select: none;
    transition: box-shadow .15s, background 0.3s;
    display: flex; flex-direction: column;
  }
  .card:hover{box-shadow:0 3px 10px rgba(0,0,0,.12);}
  .card::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:transparent;}
  .card.p-high::before{background:#e2574c;}
  .card.p-medium::before{background:#e8a33d;}
  .card.p-low::before{background:#3f9d7c;}

  .card-title{font-size:14px; line-height:1.45; word-break:break-word;}
  .card-tags{display:flex; flex-wrap:wrap; gap:4px; margin-bottom:6px;}
  .tag{font-size:11px; padding:1px 7px; border-radius:6px; background:rgba(0,0,0,.05); color:var(--muted);}
  .card-meta{display:flex; align-items:center; gap:8px; margin-top:7px; font-size:11px; color:var(--muted); flex-wrap: wrap;}
  .due{display:inline-flex; align-items:center; gap:3px;}
  .due.overdue{color:#d0453a; font-weight:600;}
  .pri{font-size:11px; padding:1px 6px; border-radius:6px; background:rgba(0,0,0,.05);}
  .pri.high{color:#e2574c;}
  .pri.medium{color:#d08a1e;}
  .pri.low{color:#3f9d7c;}
  
  .card-indicators {
    display: flex; gap: 8px; margin-top: 6px;
    font-size: 11px; color: var(--muted); align-items: center; flex-wrap: wrap;
  }
  .indicator { display: inline-flex; align-items: center; gap: 3px; }
  .indicator.checked { color: var(--accent); }

  .card-footer {
    position: absolute; bottom: 6px; left: 10px; right: 10px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .footer-left { display: flex; gap: 5px; }
  .footer-right { display: flex; gap: 5px; }

  .action-btn {
    background: rgba(100,100,100,.08); color: var(--muted); border: none;
    font-size: 13px; padding: 3px 8px; border-radius: 6px; cursor: pointer;
    font-weight: bold; transition: .15s;
  }
  .action-btn:hover { background: var(--accent); color: #fff; }
  .action-btn:disabled { opacity: 0.3; cursor: not-allowed; background: transparent; }
  
  .quick-move-btn {
    background: rgba(200,102,47,.1); color: var(--accent); border: none;
    font-size: 13px; padding: 3px 8px; border-radius: 6px; cursor: pointer;
    font-weight: bold; transition: .15s;
  }
  .quick-move-btn:hover { background: var(--accent); color: #fff; }
  
  .expand-sub-btn {
    background: rgba(100,100,100,.08); color: var(--muted); border: none;
    font-size: 12px; padding: 3px 8px; border-radius: 6px; cursor: pointer;
    transition: .15s;
  }
  .expand-sub-btn:hover { background: var(--accent); color: #fff; }
  .expand-sub-btn.expanded { background: var(--accent); color: #fff; }

  .sub-board-preview {
    margin-top: 10px; padding: 10px; background: var(--sub-bg);
    border-radius: 8px; border: 1px solid var(--sub-border);
  }
  .sub-board-preview .sub-list-title {
    font-size: 12px; font-weight: 600; color: var(--muted);
    margin-bottom: 6px;
  }
  .sub-board-preview .sub-card-item {
    font-size: 13px; padding: 5px 8px; background: var(--card-bg);
    border-radius: 6px; margin-bottom: 4px; border: 1px solid var(--border);
    cursor: pointer; transition: .15s; display: flex; justify-content: space-between;
  }
  .sub-board-preview .sub-card-item:hover { border-color: var(--accent); color: var(--accent); }
  .sub-board-preview .empty-sub { font-size: 12px; color: var(--muted); font-style: italic; }

  .add-card-btn{
    margin:6px; padding:8px; border:none; background:transparent; color:var(--muted); text-align:left; border-radius:8px;
    cursor:pointer; font-size:13px; font-family:inherit; transition:.15s;
  }
  .add-card-btn:hover{background:rgba(0,0,0,.06); color:var(--text);}

  .composer{padding-bottom:8px;}
  .composer textarea{
    width:100%; height:62px; resize:none; border:1px solid var(--accent); border-radius:10px;
    padding:8px 10px; font-size:14px; font-family:inherit; outline:none;
    background:var(--card-bg); color:var(--text); box-shadow:0 0 0 3px rgba(200,102,47,.1);
  }

  .add-list-btn {
    flex:0 0 100px; width:100px; height:48px;
    border:2px dashed var(--border); background:transparent;
    border-radius:12px; color:var(--muted); cursor:pointer;
    font-size:13px; font-family:inherit; font-weight:600;
    display:flex; align-items:center; justify-content:center; gap:4px;
    transition:.15s; margin-top:4px;
  }
  .add-list-btn:hover {
    border-color: var(--accent); color: var(--accent);
    background: rgba(200,102,47,.05);
  }

  .overlay{position:fixed; inset:0; background:rgba(30,25,20,.45); display:none; align-items:center; justify-content:center; z-index:100; padding:20px;}
  .overlay.show{display:flex;}
  .modal{
    background:var(--card-bg); border-radius:14px; width:100%; max-width:540px;
    padding:20px; box-shadow:0 20px 60px rgba(0,0,0,.25); max-height:90vh; overflow-y:auto;
    transition: background 0.3s;
  }
  .m-title{font-size:17px; font-weight:600; margin-bottom:14px;}
  .modal textarea{width:100%; height:80px; resize:vertical; margin-bottom:14px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px;}
  .modal input, .modal select, .modal textarea {
    width:100%; border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:14px;
    font-family:inherit; color:var(--text); background:var(--input-bg); outline:none; transition:.15s;
  }
  .modal input:focus, .modal select:focus, .modal textarea:focus {
    border-color:var(--accent); background:var(--card-bg); box-shadow:0 0 0 3px rgba(200,102,47,.12);
  }
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .modal-actions{display:flex; gap:8px; margin-top:10px; align-items:center;}

  .checklist-container {
    border: 1px solid var(--border); border-radius: 8px; padding: 8px; background: var(--input-bg);
    max-height: 150px; overflow-y: auto; margin-bottom: 5px;
  }
  .checklist-item {
    display: flex; align-items: center; gap: 6px; margin-bottom: 6px;
  }
  .checklist-item input[type="checkbox"] {
    width: 16px; height: 16px; flex-shrink: 0; cursor: pointer; accent-color: var(--accent);
  }
  .checklist-item input[type="text"] {
    flex: 1; padding: 4px 6px; font-size: 12px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--card-bg); color: var(--text); outline: none;
  }
  .checklist-item input[type="text"]:focus { border-color: var(--accent); }
  .checklist-item .remove-item {
    color: #d0453a; background: none; border: none; font-size: 16px; cursor: pointer; padding: 0 4px; flex-shrink: 0;
  }

  /* 附件区 */
  .attachment-actions {
    display: flex; gap: 6px; margin-bottom: 6px;
  }
  .attachments-container {
    border: 1px solid var(--border); border-radius: 8px; padding: 8px; background: var(--input-bg);
    max-height: 260px; overflow-y: auto;
  }
  .attachment-item {
    display: flex; align-items: center; gap: 6px; padding: 6px 8px; margin-bottom: 6px;
    background: var(--card-bg); border-radius: 6px; border: 1px solid var(--border);
  }
  .attachment-item .file-icon {
    font-size: 20px; flex-shrink: 0; width: 24px; text-align: center;
  }
  .attachment-item .file-info {
    flex: 1; min-width: 0;
  }
  .attachment-item .file-name {
    font-size: 12px; font-weight: 600; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .attachment-item .file-size {
    font-size: 10px; color: var(--muted); margin-top: 2px;
  }
  .attachment-item .file-size.link-tag {
    color: var(--accent);
  }
  .attachment-item .file-actions {
    display: flex; gap: 2px; flex-shrink: 0;
  }
  .attachment-item .file-actions button {
    background: rgba(100,100,100,.08); color: var(--muted); border: none;
    font-size: 13px; padding: 3px 7px; border-radius: 5px; cursor: pointer; transition: .15s;
  }
  .attachment-item .file-actions button:hover { background: var(--accent); color: #fff; }
  .attachment-item .file-actions button.remove-btn:hover { background: #d0453a; color: #fff; }
  .attachment-item .file-thumb {
    width: 36px; height: 36px; border-radius: 5px; object-fit: cover;
    flex-shrink: 0; border: 1px solid var(--border); cursor: pointer;
  }
  .attachment-empty {
    font-size: 12px; color: var(--muted); font-style: italic; text-align: center; padding: 8px;
  }
  .attachment-hint {
    font-size: 10px; color: var(--muted); margin-top: 6px; line-height: 1.5;
  }

  /* 添加链接的小弹窗 */
  #addLinkOverlay { align-items: center; padding: 20px; z-index: 150; }
  #addLinkModal {
    background: var(--card-bg); border-radius: 14px; width: 100%; max-width: 420px;
    padding: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.3);
  }
  #addLinkModal h3 { font-size: 16px; margin-bottom: 15px; text-align: center; }
  #addLinkModal .field { margin-bottom: 12px; }
  #addLinkModal .field label { display:block; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  #addLinkModal input {
    width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
    font-size: 14px; font-family: inherit; color: var(--text); background: var(--input-bg);
    outline: none;
  }
  #addLinkModal input:focus { border-color: var(--accent); background: var(--card-bg); }

  #quickMoveOverlay { align-items: flex-end; padding: 0; }
  #quickMoveMenu {
    background: var(--card-bg); width: 100%; border-radius: 16px 16px 0 0;
    padding: 20px; box-shadow: 0 -5px 20px rgba(0,0,0,.2);
    animation: slideUp .2s ease-out; max-height: 70vh; overflow-y: auto;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  #quickMoveMenu h3 { font-size: 16px; margin-bottom: 15px; text-align: center; color: var(--muted); }
  .move-option {
    display: block; width: 100%; padding: 12px; margin-bottom: 8px;
    background: var(--input-bg); border: 1px solid var(--border);
    border-radius: 10px; font-size: 15px; color: var(--text); cursor: pointer;
    text-align: center; transition: .15s;
  }
  .move-option:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .move-option:disabled { opacity: 0.4; cursor: not-allowed; background: var(--border); }

  #renameListOverlay { align-items: center; padding: 20px; }
  #renameListModal {
    background: var(--card-bg); border-radius: 14px; width: 100%; max-width: 380px;
    padding: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.3);
  }
  #renameListModal h3 { font-size: 16px; margin-bottom: 15px; text-align: center; }
  #renameListModal input {
    width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
    font-size: 15px; font-family: inherit; color: var(--text); background: var(--input-bg);
    outline: none; margin-bottom: 15px;
  }
  .rename-actions { display: flex; gap: 10px; }

  /* 通用预览弹窗：支持图片和 iframe（邮件 HTML） */
  #previewOverlay {
    background: rgba(0,0,0,.92); align-items: center; justify-content: center; z-index: 200;
    padding: 0;
  }
  #previewOverlay .preview-toolbar {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 10px 16px; display: flex; align-items: center; gap: 10px;
    color: #fff; font-size: 13px; z-index: 2;
    background: linear-gradient(to bottom, rgba(0,0,0,.7), transparent);
  }
  #previewOverlay .preview-title {
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-weight: 600;
  }
  #previewOverlay .preview-btn {
    background: rgba(255,255,255,.15); color: #fff; border: none;
    width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: .15s;
  }
  #previewOverlay .preview-btn:hover { background: rgba(255,255,255,.3); }
  #previewContent {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding-top: 0;
  }
  #previewContent iframe {
    width: 100%; height: 100%;
    background: #fff; border: none;
  }
  #previewContent img {
    max-width: 95%; max-height: 90vh; object-fit: contain;
  }
  #previewContent .preview-loading {
    color: #fff; font-size: 14px;
  }

  #loadingOverlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    display: none; align-items: center; justify-content: center; z-index: 999;
    color: #fff; font-size: 16px;
  }
  #loadingOverlay.show { display: flex; }
  #loadingOverlay .spinner {
    width: 24px; height: 24px; border: 3px solid rgba(255,255,255,.3);
    border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite;
    margin-right: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 640px) {
    header h1 { display: none; }
    .board-selector { max-width: 110px; font-size: 12px; }
    .list { flex: 0 0 250px; width: 250px; }
  }
</style>
</head>
<body>

<header>
  <span class="logo">🌰</span>
  <select class="board-selector" id="boardSelect"></select>
  <button class="btn primary small" id="addBoardBtn">＋ 看板</button>
  <button class="btn small" id="renameBoardBtn" title="重命名当前看板">✎</button>
  <button class="btn danger small" id="delBoardBtn" title="删除当前看板">🗑</button>
  <div class="spacer"></div>
  <button class="btn primary small" id="addListBtn">＋ 列表</button>
  <button class="btn small" id="exportBtn">导出Excel</button>
  <button class="btn small" id="backupBtn">📥 备份</button>
  <button class="btn small" id="importBtn">📤 导入</button>
  <input type="file" id="importFileInput" accept=".json" style="display:none;">
  <button class="btn small" id="themeToggle" title="切换深色/浅色">🌙</button>
  <button class="btn danger small" id="resetBtn">重置</button>
</header>

<div id="breadcrumb"></div>
<main id="board"></main>

<!-- 卡片编辑弹窗 -->
<div class="overlay" id="overlay">
  <div class="modal">
    <input id="mTitle" class="m-title" placeholder="卡片标题">
    <textarea id="mDesc" placeholder="添加更详细的描述…"></textarea>
    
    <div class="field">
      <label>待办清单（子任务）</label>
      <div class="checklist-container" id="checklistContainer"></div>
      <button type="button" class="btn small" id="addChecklistBtn">＋ 添加待办</button>
    </div>

    <div class="field">
      <label>附件（本地文件 ≤ 30MB 或 OneDrive 等外链）</label>
      <div class="attachment-actions">
        <button type="button" class="btn small" id="addAttachmentBtn">📎 上传本地文件</button>
        <button type="button" class="btn small" id="addLinkBtn">🔗 添加外部链接</button>
      </div>
      <div class="attachments-container" id="attachmentsContainer"></div>
      <div class="attachment-hint">
        📌 本地文件会随 JSON 备份一起保存；<br>
        🔗 外部链接（如 OneDrive 分享链接）只保存 URL，点击会跳转。
      </div>
      <input type="file" id="attachmentFileInput" multiple style="display:none;">
    </div>

    <div class="field">
      <label>所属列表</label>
      <select id="mList"></select>
    </div>
    <div class="field">
      <label>标签</label>
      <input id="mTags" placeholder="用逗号分隔，如：设计, 紧急">
    </div>
    <div class="grid2">
      <div class="field">
        <label>优先级</label>
        <select id="mPriority">
          <option value="none">无</option> <option value="low">低</option>
          <option value="medium">中</option> <option value="high">高</option>
        </select>
      </div>
      <div class="field">
        <label>截止日期</label>
        <input type="date" id="mDue">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn danger" id="mDelete">删除</button>
      <div class="spacer"></div>
      <button class="btn primary" id="mEnterSubBoard" style="display:none;">进入子看板</button>
      <button class="btn" id="mCancel">取消</button>
      <button class="btn primary" id="mSave">保存</button>
    </div>
  </div>
</div>

<!-- 快捷移动弹窗 -->
<div class="overlay" id="quickMoveOverlay">
  <div id="quickMoveMenu">
    <h3>选择要移动到的列表</h3>
    <div id="quickMoveList"></div>
    <button class="btn danger" id="quickMoveCancel" style="width:100%; margin-top:10px;">取消</button>
  </div>
</div>

<!-- 列表重命名弹窗 -->
<div class="overlay" id="renameListOverlay">
  <div id="renameListModal">
    <h3 id="renameListTitle">重命名列表</h3>

<script>
/* =========================================================
   IndexedDB 存储
   ========================================================= */
const DB_NAME = 'kanban_db_v2';
const DB_VERSION = 1;
const STATE_STORE = 'state';
const STATE_KEY = 'main';
const MAX_FILE_SIZE = 30 * 1024 * 1024;

let stateDB = null;

function openStateDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(STATE_STORE)) {
        d.createObjectStore(STATE_STORE);
      }
    };
    req.onsuccess = (e) => { stateDB = e.target.result; resolve(stateDB); };
    req.onerror = (e) => reject(e);
  });
}
function loadStateFromDB() {
  return new Promise((resolve, reject) => {
    const tx = stateDB.transaction(STATE_STORE, 'readonly');
    const req = tx.objectStore(STATE_STORE).get(STATE_KEY);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = (e) => reject(e);
  });
}
function saveStateToDB(data) {
  return new Promise((resolve, reject) => {
    const tx = stateDB.transaction(STATE_STORE, 'readwrite');
    tx.objectStore(STATE_STORE).put(data, STATE_KEY);
    tx.oncomplete = () => resolve();
    tx.onerror = (e) => reject(e);
  });
}
function clearStateDB() {
  return new Promise((resolve, reject) => {
    const tx = stateDB.transaction(STATE_STORE, 'readwrite');
    tx.objectStore(STATE_STORE).clear();
    tx.oncomplete = () => resolve();
    tx.onerror = (e) => reject(e);
  });
}

/* =========================================================
   工具
   ========================================================= */
function uid() { return Math.random().toString(36).slice(2, 10); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function formatFileSize(bytes) {
  if (!bytes) return '0 B';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1024 / 1024).toFixed(2) + ' MB';
}

function getFileIcon(name, type) {
  const ext = (name || '').split('.').pop().toLowerCase();
  if (type && type.startsWith('image/')) return '🖼';
  if (type && type.startsWith('video/')) return '🎬';
  if (type && type.startsWith('audio/')) return '🎵';
  if (ext === 'html' || ext === 'htm') return '📧';
  if (ext === 'eml' || ext === 'msg') return '📧';
  if (ext === 'pdf') return '📕';
  if (['doc', 'docx'].includes(ext)) return '📘';
  if (['xls', 'xlsx', 'csv'].includes(ext)) return '📗';
  if (['ppt', 'pptx'].includes(ext)) return '📙';
  if (['zip', 'rar', '7z'].includes(ext)) return '🗜';
  if (['dwg', 'dxf', 'step', 'stp', 'igs', 'iges', 'sldprt', 'sldasm'].includes(ext)) return '📐';
  return '📄';
}

function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function dataURLToBlob(dataURL) {
  const parts = dataURL.split(',');
  const mimeMatch = parts[0].match(/:(.*?);/);
  const mime = mimeMatch ? mimeMatch[1] : 'application/octet-stream';
  const bstr = atob(parts[1]);
  let n = bstr.length;
  const u8arr = new Uint8Array(n);
  while (n--) u8arr[n] = bstr.charCodeAt(n);
  return new Blob([u8arr], { type: mime });
}

function showLoading(text) {
  document.getElementById('loadingText').textContent = text || '处理中...';
  document.getElementById('loadingOverlay').classList.add('show');
}
function hideLoading() {
  document.getElementById('loadingOverlay').classList.remove('show');
}

/* =========================================================
   数据
   ========================================================= */
const PRIORITY = {
  high:   { label: '高', cls: 'high' },
  medium: { label: '中', cls: 'medium' },
  low:    { label: '低', cls: 'low' },
  none:   { label: '',   cls: '' }
};

function defaultData() {
  const board = {
    id: uid(), name: '我的看板',
    lists: [
      { id: uid(), title: '待办', cards: [
        { 
          id: uid(), title: '欢迎使用栗子看板 🌰', desc: '点击卡片可以编辑详情，支持待办清单、本地附件和外部链接。', 
          tags: ['入门'], priority: 'high', due: '', 
          checklist: [{ id: uid(), text: '了解待办清单功能', done: true }, { id: uid(), text: '尝试上传附件', done: false }],
          attachments: [],
          subBoard: null, isExpanded: false 
        }
      ] },
      { id: uid(), title: '进行中', cards: [] },
      { id: uid(), title: '已完成', cards: [] }
    ]
  };
  return { boards: [board], currentBoardId: board.id };
}

let state = null;
let boardStack = [];
let editing = null;
let renamingListId = null;

function getCurrentBoard() {
  let b = state.boards.find(b => b.id === state.currentBoardId);
  if (!b) { b = state.boards[0]; if (b) state.currentBoardId = b.id; }
  return b;
}
function syncBoardStack() {
  const b = getCurrentBoard();
  boardStack = [{ lists: b.lists, title: b.name }];
}
async function saveState() {
  try { await saveStateToDB(state); }
  catch (e) { console.error('保存失败：', e); alert('⚠️ 保存失败：' + e.message); }
}

/* =========================================================
   主题
   ========================================================= */
const THEME_KEY = 'chestnut-kanban-theme';
const themeBtn = document.getElementById('themeToggle');
function applyTheme(theme) {
  if (theme === 'dark') { document.body.classList.add('dark'); themeBtn.textContent = '☀️'; }
  else { document.body.classList.remove('dark'); themeBtn.textContent = '🌙'; }
}
const savedTheme = localStorage.getItem(THEME_KEY);
if (savedTheme) { applyTheme(savedTheme); } else {
  applyTheme(window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
}
themeBtn.onclick = () => {
  const isDark = document.body.classList.contains('dark');
  const t = isDark ? 'light' : 'dark';
  applyTheme(t); localStorage.setItem(THEME_KEY, t);
};

/* =========================================================
   DOM
   ========================================================= */
const board = document.getElementById('board');
const overlay = document.getElementById('overlay');
const mTitle = document.getElementById('mTitle');
const mDesc = document.getElementById('mDesc');
const mTags = document.getElementById('mTags');
const mPriority = document.getElementById('mPriority');
const mDue = document.getElementById('mDue');
const mList = document.getElementById('mList');
const mEnterSubBoard = document.getElementById('mEnterSubBoard');
const checklistContainer = document.getElementById('checklistContainer');
const attachmentsContainer = document.getElementById('attachmentsContainer');
const attachmentFileInput = document.getElementById('attachmentFileInput');
const breadcrumb = document.getElementById('breadcrumb');
const quickMoveOverlay = document.getElementById('quickMoveOverlay');
const quickMoveList = document.getElementById('quickMoveList');
const boardSelect = document.getElementById('boardSelect');
const renameListOverlay = document.getElementById('renameListOverlay');
const renameListInput = document.getElementById('renameListInput');

/* =========================================================
   看板选择器
   ========================================================= */
function renderBoardSelect() {
  boardSelect.innerHTML = state.boards.map(b =>
    `<option value="${b.id}" ${b.id === state.currentBoardId ? 'selected' : ''}>${esc(b.name)}</option>`
  ).join('');
}
boardSelect.onchange = (e) => {
  state.currentBoardId = e.target.value;
  syncBoardStack(); saveState(); render();
};
document.getElementById('addBoardBtn').onclick = () => {
  const name = prompt('新看板名称', '新看板');
  if (name === null) return;
  const newBoard = { id: uid(), name: name.trim() || '新看板', lists: [{ id: uid(), title: '待办', cards: [] }] };
  state.boards.push(newBoard);
  state.currentBoardId = newBoard.id;
  syncBoardStack(); renderBoardSelect(); saveState(); render();
};
document.getElementById('renameBoardBtn').onclick = () => {
  const b = getCurrentBoard(); if (!b) return;
  const name = prompt('重命名看板', b.name);
  if (name === null) return;
  b.name = name.trim() || b.name;
  boardStack[0].title = b.name;
  renderBoardSelect(); saveState(); render();
};
document.getElementById('delBoardBtn').onclick = () => {
  if (state.boards.length <= 1) { alert('至少保留一个看板'); return; }
  const b = getCurrentBoard();
  if (!confirm(`确定删除看板「${b.name}」及其所有内容吗？`)) return;
  state.boards = state.boards.filter(x => x.id !== b.id);
  state.currentBoardId = state.boards[0].id;
  syncBoardStack(); renderBoardSelect(); saveState(); render();
};

/* =========================================================
   渲染
   ========================================================= */
function render() {
  const currentBoard = boardStack[boardStack.length - 1];
  if (boardStack.length > 1) {
    breadcrumb.classList.add('show');
    breadcrumb.innerHTML = boardStack.map((b, i) => {
      if (i === boardStack.length - 1) return `<span class="current">${esc(b.title)}</span>`;
      return `<span onclick="goBackTo(${i})">${esc(b.title)}</span><span class="arrow">›</span>`;
    }).join('');
  } else {
    breadcrumb.classList.remove('show');
  }
  const listsHtml = currentBoard.lists.map(renderList).join('');
  const addListBtnHtml = `
    <button class="add-list-btn" id="addListInlineBtn" title="添加新列表">
      <span style="font-size:18px; line-height:1;">＋</span> 列表
    </button>
  `;
  board.innerHTML = listsHtml + addListBtnHtml;
  document.getElementById('addListInlineBtn').onclick = () => {
    const title = prompt('新列表名称', '新列表');
    if (title === null) return;
    const cb = boardStack[boardStack.length - 1];
    cb.lists.push({ id: uid(), title: title.trim() || '新列表', cards: [] });
    render(); saveState();
  };
}

function renderList(list) {
  return `
    <div class="list" data-id="${list.id}">
      <div class="list-header">
        <span class="list-title" data-act="rename-list" data-list-id="${list.id}" title="点击重命名">${esc(list.title)}</span>
        <span class="list-count">${list.cards.length}</span>
        <button class="icon-btn" data-act="del-list" data-list-id="${list.id}" title="删除列表">✕</button>
      </div>
      <div class="cards" data-list="${list.id}">
        ${list.cards.map(renderCard).join('')}
      </div>
      <button class="add-card-btn" data-act="add-card" data-list-id="${list.id}">＋ 添加卡片</button>
    </div>
  `;
}

function renderCard(card) {
  const today = new Date().toISOString().slice(0, 10);
  const p = PRIORITY[card.priority] || PRIORITY.none;
  const tags = (card.tags && card.tags.length) ? `<div class="card-tags">${card.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : '';
  const due = card.due ? `<span class="due${card.due < today ? ' overdue' : ''}">📅 ${esc(card.due.slice(5))}</span>` : '';
  const pri = p.label ? `<span class="pri ${p.cls}">${p.label}</span>` : '';
  
  let checklistIndicator = '';
  if (card.checklist && card.checklist.length > 0) {
    const doneCount = card.checklist.filter(c => c.done).length;
    const allDone = doneCount === card.checklist.length;
    checklistIndicator = `<span class="indicator ${allDone ? 'checked' : ''}">☑ ${doneCount}/${card.checklist.length}</span>`;
  }
  
  let attachmentIndicator = '';
  const atts = card.attachments || [];
  if (atts.length > 0) {
    const linkCount = atts.filter(a => a.kind === 'link').length;
    const fileCount = atts.length - linkCount;
    const parts = [];
    if (fileCount > 0) parts.push(`📎 ${fileCount}`);
    if (linkCount > 0) parts.push(`🔗 ${linkCount}`);
    attachmentIndicator = `<span class="indicator">${parts.join(' ')}</span>`;
  }

  const meta = (due || pri) ? `<div class="card-meta">${due}${pri}</div>` : '';
  const indicators = (checklistIndicator || attachmentIndicator) ? `<div class="card-indicators">${checklistIndicator}${attachmentIndicator}</div>` : '';
  const pClass = card.priority && card.priority !== 'none' ? ` p-${card.priority}` : '';
  
  let subBoardHtml = '';
  if (card.subBoard) {
    const isExpanded = card.isExpanded || false;
    const totalCards = card.subBoard.lists.reduce((sum, list) => sum + list.cards.length, 0);
    let contentHtml = '';
    if (isExpanded) {
      if (totalCards === 0) {
        contentHtml = '<div class="empty-sub">子看板为空</div>';
      } else {
        card.subBoard.lists.forEach(list => {
          contentHtml += `<div class="sub-list-title">📁 ${esc(list.title)} (${list.cards.length})</div>`;
          list.cards.forEach(c => {
            contentHtml += `<div class="sub-card-item" data-sub-card-id="${c.id}" data-sub-list-id="${list.id}">${esc(c.title)} <span style="color:var(--muted);font-size:11px;">›</span></div>`;
          });
        });
      }
    }
    subBoardHtml = `
      <div class="sub-board-preview" style="display: ${isExpanded ? 'block' : 'none'};">
        ${contentHtml}
      </div>
    `;
  }

  const subBoardBtn = card.subBoard 
    ? `<button class="expand-sub-btn ${card.isExpanded ? 'expanded' : ''}" data-act="toggle-sub" data-card-id="${card.id}">${card.isExpanded ? '[-] 收起' : '[+] 子看板'}</button>` 
    : '';

  const upBtn = `<button class="action-btn" data-act="move-up" data-card-id="${card.id}" title="上移">↑</button>`;
  const downBtn = `<button class="action-btn" data-act="move-down" data-card-id="${card.id}" title="下移">↓</button>`;

  return `
    <div class="card${pClass}" data-id="${card.id}">
      <div class="card-main">
        ${tags}
        <div class="card-title">${esc(card.title)}</div>
        ${meta}
        ${indicators}
      </div>
      ${subBoardHtml}
      <div class="card-footer">
        <div class="footer-left">${upBtn}${downBtn}</div>
        <div class="footer-right">
          <button class="quick-move-btn" data-act="quick-move" data-card-id="${card.id}">⇄ 移动</button>
          ${subBoardBtn}
        </div>
      </div>
    </div>
  `;
}

/* =========================================================
   层级 / 优先级 / 快捷移动
   ========================================================= */
window.goBackTo = function(index) {
  boardStack = boardStack.slice(0, index + 1);
  render();
};
function enterSubBoard(card) {
  if (!card.subBoard) {
    card.subBoard = { lists: [{ id: uid(), title: '子任务', cards: [] }] };
    card.isExpanded = true;
  }
  boardStack.push({ lists: card.subBoard.lists, title: card.title });
  closeModal(); render();
}
function moveCardPriority(cardId, direction) {
  const currentBoard = boardStack[boardStack.length - 1];
  for (const list of currentBoard.lists) {
    const index = list.cards.findIndex(c => c.id === cardId);
    if (index !== -1) {
      const targetIndex = index + direction;
      if (targetIndex >= 0 && targetIndex < list.cards.length) {
        const temp = list.cards[index];
        list.cards[index] = list.cards[targetIndex];
        list.cards[targetIndex] = temp;
        render(); saveState();
      }
      return;
    }
  }
}
function openQuickMoveMenu(cardId) {
  const currentBoard = boardStack[boardStack.length - 1];
  quickMoveList.innerHTML = '';
  let currentListId = '';
  currentBoard.lists.forEach(list => {
    if (list.cards.some(c => c.id === cardId)) currentListId = list.id;
  });
  currentBoard.lists.forEach(list => {
    const btn = document.createElement('button');
    btn.className = 'move-option';
    btn.textContent = list.title;
    if (list.id === currentListId) { btn.textContent += ' (当前列表)'; btn.disabled = true; }
    btn.onclick = () => { moveCard(cardId, list.id); quickMoveOverlay.classList.remove('show'); };
    quickMoveList.appendChild(btn);
  });
  quickMoveOverlay.classList.add('show');
}
function moveCard(cardId, targetListId) {
  const currentBoard = boardStack[boardStack.length - 1];
  let cardToMove = null, sourceList = null;
  for (const list of currentBoard.lists) {
    const idx = list.cards.findIndex(c => c.id === cardId);
    if (idx !== -1) { sourceList = list; cardToMove = list.cards.splice(idx, 1)[0]; break; }
  }
  if (cardToMove && sourceList && sourceList.id !== targetListId) {
    const targetList = currentBoard.lists.find(l => l.id === targetListId);
    if (targetList) targetList.cards.push(cardToMove);
    else sourceList.cards.push(cardToMove);
  }
  render(); saveState();
}
document.getElementById('quickMoveCancel').onclick = () => quickMoveOverlay.classList.remove('show');

/* =========================================================
   列表重命名
   ========================================================= */
function openRenameListModal(listId, currentTitle) {
  renamingListId = listId;
  renameListInput.value = currentTitle;
  renameListOverlay.classList.add('show');
  setTimeout(() => { renameListInput.focus(); renameListInput.select(); }, 30);
}
document.getElementById('renameListCancel').onclick = () => {
  renameListOverlay.classList.remove('show'); renamingListId = null;
};
document.getElementById('renameListConfirm').onclick = () => {
  const newName = renameListInput.value.trim();
  if (newName && renamingListId) {
    const currentBoard = boardStack[boardStack.length - 1];
    const list = currentBoard.lists.find(l => l.id === renamingListId);
    if (list) { list.title = newName; saveState(); render(); }
  }
  renameListOverlay.classList.remove('show'); renamingListId = null;
};
renameListInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('renameListConfirm').click();
  else if (e.key === 'Escape') document.getElementById('renameListCancel').click();
});

/* =========================================================
   待办清单
   ========================================================= */
let editingChecklist = [];
function renderChecklistUI() {
  checklistContainer.innerHTML = '';
  editingChecklist.forEach((item, index) => {
    const div = document.createElement('div');
    div.className = 'checklist-item';
    div.innerHTML = `
      <input type="checkbox" class="chk-done" data-index="${index}" ${item.done ? 'checked' : ''}>
      <input type="text" class="chk-text" data-index="${index}" value="${esc(item.text)}" placeholder="待办内容">
      <button type="button" class="remove-item" data-index="${index}">✕</button>
    `;
    checklistContainer.appendChild(div);
  });
}
checklistContainer.addEventListener('change', (e) => {
  if (e.target.classList.contains('chk-done')) {
    const idx = parseInt(e.target.dataset.index);
    editingChecklist[idx].done = e.target.checked;
  }
});
checklistContainer.addEventListener('input', (e) => {
  if (e.target.classList.contains('chk-text')) {
    const idx = parseInt(e.target.dataset.index);
    editingChecklist[idx].text = e.target.value;
  }
});
checklistContainer.addEventListener('click', (e) => {
  if (e.target.classList.contains('remove-item')) {
    const idx = parseInt(e.target.dataset.index);
    editingChecklist.splice(idx, 1); renderChecklistUI();
  }
});
document.getElementById('addChecklistBtn').onclick = () => {
  editingChecklist.push({ id: uid(), text: '', done: false });
  renderChecklistUI();
  const inputs = checklistContainer.querySelectorAll('.chk-text');
  if (inputs.length > 0) inputs[inputs.length - 1].focus();
};

/* =========================================================
   附件（本地文件 + 外部链接）
   数据结构：
   { id, kind: 'file'|'link', name, size, type, data?, url? }
   ========================================================= */
let editingAttachments = [];

function renderAttachmentsUI() {
  attachmentsContainer.innerHTML = '';
  if (editingAttachments.length === 0) {
    attachmentsContainer.innerHTML = '<div class="attachment-empty">暂无附件</div>';
    return;
  }
  editingAttachments.forEach((att, index) => {
    const div = document.createElement('div');
    div.className = 'attachment-item';
    const isLink = att.kind === 'link';
    const icon = isLink ? '🔗' : getFileIcon(att.name, att.type);
    const sizeText = isLink ? '外部链接' : formatFileSize(att.size);
    const isImage = !isLink && att.type && att.type.startsWith('image/') && att.data;
    let thumbHtml = '';
    if (isImage) {
      thumbHtml = `<img class="file-thumb" data-index="${index}" src="${att.data}" alt="">`;
    } else {
      thumbHtml = `<div class="file-icon">${icon}</div>`;
    }
    div.innerHTML = `
      ${thumbHtml}
      <div class="file-info">
        <div class="file-name">${esc(att.name)}</div>
        <div class="file-size ${isLink ? 'link-tag' : ''}">${sizeText}</div>
      </div>
      <div class="file-actions">
        <button class="preview-btn" data-index="${index}" title="预览">👁</button>
        ${isLink ? '' : '<button class="download-btn" data-index="' + index + '" title="下载">⬇</button>'}
        <button class="remove-btn" data-index="${index}" title="删除">✕</button>
      </div>
    `;
    attachmentsContainer.appendChild(div);
  });
}

attachmentsContainer.addEventListener('click', (e) => {
  const previewBtn = e.target.closest('.preview-btn');
  const downloadBtn = e.target.closest('.download-btn');
  const removeBtn = e.target.closest('.remove-btn');
  const thumbImg = e.target.closest('.file-thumb');
  
  if (previewBtn) {
    const idx = parseInt(previewBtn.dataset.index);
    previewAttachment(editingAttachments[idx]);
  } else if (downloadBtn) {
    const idx = parseInt(downloadBtn.dataset.index);
    downloadAttachment(editingAttachments[idx]);
  } else if (removeBtn) {
    const idx = parseInt(removeBtn.dataset.index);
    const att = editingAttachments[idx];
    if (confirm(`确定删除附件「${att.name}」吗？`)) {
      editingAttachments.splice(idx, 1);
      renderAttachmentsUI();
    }
  } else if (thumbImg) {
    const idx = parseInt(thumbImg.dataset.index);
    previewAttachment(editingAttachments[idx]);
  }
});

/* ========== 预览逻辑 ========== */
let currentPreviewURL = null;   // 用于关闭时释放

function previewAttachment(att) {
  if (!att) return;
  
  // 外部链接：直接新标签打开
  if (att.kind === 'link') {
    if (!att.url) { alert('❌ 链接为空'); return; }
    window.open(att.url, '_blank');
    return;
  }
  
  if (!att.data) { alert('❌ 附件数据缺失'); return; }
  
  const mime = att.type || '';
  const lname = (att.name || '').toLowerCase();
  
  // 邮件 HTML 预览
  if (mime.includes('html') || lname.endsWith('.html') || lname.endsWith('.htm')) {
    showPreviewFrame(att.data, att.name, 'text/html');
    return;
  }
  
  // 图片
  if (mime.startsWith('image/')) {
    showPreviewImage(att.data, att.name);
    return;
  }
  
  // PDF
  if (mime === 'application/pdf' || lname.endsWith('.pdf')) {
    showPreviewFrame(att.data, att.name, 'application/pdf');
    return;
  }
  
  // 文本
  if (mime.startsWith('text/') || lname.endsWith('.txt') || lname.endsWith('.csv') || lname.endsWith('.md') || lname.endsWith('.log')) {
    showPreviewFrame(att.data, att.name, 'text/plain');
    return;
  }
  
  // 其他：下载
  const blob = dataURLToBlob(att.data);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = att.name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function showPreviewImage(dataURL, name) {
  const content = document.getElementById('previewContent');
  content.innerHTML = '';
  const img = document.createElement('img');
  img.src = dataURL;
  content.appendChild(img);
  document.getElementById('previewTitle').textContent = name || '图片预览';
  document.getElementById('previewOverlay').classList.add('show');
  document.getElementById('previewNewTabBtn').dataset.mode = 'image';
  document.getElementById('previewNewTabBtn').dataset.data = dataURL;
  document.getElementById('previewDownloadBtn').dataset.mode = 'image';
  document.getElementById('previewDownloadBtn').dataset.data = dataURL;
  document.getElementById('previewDownloadBtn').dataset.name = name;
}

function showPreviewFrame(dataURL, name, mime) {
  const content = document.getElementById('previewContent');
  content.innerHTML = '<div class="preview-loading">加载中...</div>';
  const blob = dataURLToBlob(dataURL);
  const url = URL.createObjectURL(blob);
  currentPreviewURL = url;
  const iframe = document.createElement('iframe');
  // 邮件 HTML 用 sandbox 允许脚本运行以正确渲染，但禁止顶层跳转
  iframe.setAttribute('sandbox', 'allow-same-origin allow-scripts allow-popups allow-forms');
  iframe.src = url;
  content.innerHTML = '';
  content.appendChild(iframe);
  document.getElementById('previewTitle').textContent = name || '预览';
  document.getElementById('previewOverlay').classList.add('show');
  document.getElementById('previewNewTabBtn').dataset.mode = 'frame';
  document.getElementById('previewNewTabBtn').dataset.url = url;
  document.getElementById('previewDownloadBtn').dataset.mode = 'file';
  document.getElementById('previewDownloadBtn').dataset.data = dataURL;
  document.getElementById('previewDownloadBtn').dataset.name = name;
}

function downloadAttachment(att) {
  if (!att) return;
  if (att.kind === 'link') {
    window.open(att.url, '_blank');
    return;
  }
  if (!att.data) { alert('❌ 附件数据缺失'); return; }
  const blob = dataURLToBlob(att.data);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = att.name || 'attachment';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* 预览弹窗的按钮 */
document.getElementById('closePreviewBtn').onclick = () => {
  document.getElementById('previewOverlay').classList.remove('show');
  document.getElementById('previewContent').innerHTML = '';
  if (currentPreviewURL) { URL.revokeObjectURL(currentPreviewURL); currentPreviewURL = null; }
};
document.getElementById('previewOverlay').addEventListener('click', (e) => {

});
document.getElementById('previewNewTabBtn').onclick = (e) => {

    const blob = dataURLToBlob(btn.dataset.data);

    window.open(url, '_blank');

  } else if (btn.dataset.mode === 'frame' && btn.dataset.url) {
    window.open(btn.dataset.url, '_blank');
  }
};
document.getElementById('previewDownloadBtn').onclick = (e) => {
  const btn = e.currentTarget;
  if (!btn.dataset.data) return;
  const blob = dataURLToBlob(btn.dataset.data);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = btn.dataset.name || 'download';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
};

/* ========== 上传本地文件 ========== */
document.getElementById('addAttachmentBtn').onclick = () => attachmentFileInput.click();

attachmentFileInput.addEventListener('change', async (e) => {
  const files = Array.from(e.target.files || []);
  if (files.length === 0) return;
  showLoading('正在处理附件...');
  try {
    for (const file of files) {
      if (file.size > MAX_FILE_SIZE) {
        alert(`❌ 「${file.name}」大小 ${formatFileSize(file.size)}，超过 30MB 限制，已跳过`);
        continue;
      }
      try {
        const dataURL = await fileToDataURL(file);
        editingAttachments.push({
          id: uid(),
          kind: 'file',
          name: file.name,
          size: file.size,
          type: file.type || 'application/octet-stream',
          data: dataURL
        });
      } catch (err) {
        alert(`读取「${file.name}」失败：${err.message}`);
      }
    }
    renderAttachmentsUI();
  } finally {
    hideLoading();
  }
  attachmentFileInput.value = '';
});

/* =========================================================
   卡片详情
   ========================================================= */
function openCard(cardId) {
  const currentBoard = boardStack[boardStack.length - 1];
  for (const list of currentBoard.lists) {
    const card = list.cards.find(c => c.id === cardId);
    if (!card) continue;
    editing = { listId: list.id, cardId };
    mTitle.value = card.title;
    mDesc.value = card.desc || '';
    mTags.value = (card.tags || []).join(', ');
    mPriority.value = card.priority || 'none';
    mDue.value = card.due || '';
    
    editingChecklist = (card.checklist || []).map(c => ({ ...c }));
    renderChecklistUI();
    
    editingAttachments = (card.attachments || []).map(a => {
      // 兼容旧数据（没有 kind 字段的当作本地文件）
      if (!a.kind) {
        if (a.url && !a.data) a.kind = 'link';
        else a.kind = 'file';
      }
      return { ...a };
    });
    renderAttachmentsUI();

    mList.innerHTML = currentBoard.lists.map(l =>
      `<option value="${l.id}" ${l.id === list.id ? 'selected' : ''}>${esc(l.title)}</option>`
    ).join('');

    mEnterSubBoard.textContent = card.subBoard ? '进入子看板' : '创建子看板';
    mEnterSubBoard.style.display = 'block';

    overlay.classList.add('show');
    setTimeout(() => { mTitle.focus(); mTitle.select(); }, 30);
    return;
  }
}
function closeModal() { overlay.classList.remove('show'); editing = null; }

document.getElementById('mCancel').onclick = closeModal;
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && overlay.classList.contains('show')) closeModal(); });
mTitle.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('mSave').click(); });

document.getElementById('mSave').onclick = async () => {
  if (!editing) return;
  const currentBoard = boardStack[boardStack.length - 1];
  const list = currentBoard.lists.find(l => l.id === editing.listId);
  const card = list && list.cards.find(c => c.id === editing.cardId);
  if (!card) return closeModal();

  card.title = mTitle.value.trim() || '未命名卡片';
  card.desc = mDesc.value.trim();
  card.tags = mTags.value.split(/[,，]/).map(s => s.trim()).filter(Boolean);
  card.priority = mPriority.value;
  card.due = mDue.value;
  
  card.checklist = editingChecklist
    .filter(c => c.text.trim())
    .map(c => ({ id: c.id || uid(), text: c.text.trim(), done: !!c.done }));

  card.attachments = editingAttachments.map(a => {
    if (a.kind === 'link') {
      return { id: a.id, kind: 'link', name: a.name, size: 0, type: 'link', url: a.url };
    } else {
      return { id: a.id, kind: 'file', name: a.name, size: a.size || 0, type: a.type || '', data: a.data || '' };
    }
  });

  const newListId = mList.value;
  if (newListId !== editing.listId) {
    const oldList = currentBoard.lists.find(l => l.id === editing.listId);
    const idx = oldList.cards.findIndex(c => c.id === editing.cardId);
    const [moved] = oldList.cards.splice(idx, 1);
    const newList = currentBoard.lists.find(l => l.id === newListId);
    if (newList) newList.cards.push(moved);
  }
  closeModal(); render();
  showLoading('保存中...');
  try { await saveState(); }
  finally { hideLoading(); }
};

document.getElementById('mEnterSubBoard').onclick = () => {
  if (!editing) return;
  const currentBoard = boardStack[boardStack.length - 1];
  const list = currentBoard.lists.find(l => l.id === editing.listId);
  const card = list && list.cards.find(c => c.id === editing.cardId);
  if (card) enterSubBoard(card);
};

document.getElementById('mDelete').onclick = async () => {
  if (!editing) return;
  if (!confirm('确定删除这张卡片？子看板也会被删除。')) return;
  const currentBoard = boardStack[boardStack.length - 1];
  const list = currentBoard.lists.find(l => l.id === editing.listId);
  if (list) list.cards = list.cards.filter(c => c.id !== editing.cardId);
  closeModal(); render(); await saveState();
};

/* =========================================================
   看板点击
   ========================================================= */
board.addEventListener('click', (e) => {
  const upBtn = e.target.closest('[data-act="move-up"]');
  if (upBtn) { e.stopPropagation(); moveCardPriority(upBtn.dataset.cardId, -1); return; }
  const downBtn = e.target.closest('[data-act="move-down"]');
  if (downBtn) { e.stopPropagation(); moveCardPriority(downBtn.dataset.cardId, 1); return; }
  const moveBtn = e.target.closest('[data-act="quick-move"]');
  if (moveBtn) { e.stopPropagation(); openQuickMoveMenu(moveBtn.dataset.cardId); return; }
  const toggleBtn = e.target.closest('[data-act="toggle-sub"]');
  if (toggleBtn) {
    e.stopPropagation();
    const cardId = toggleBtn.dataset.cardId;
    const currentBoard = boardStack[boardStack.length - 1];
    for (const list of currentBoard.lists) {
      const card = list.cards.find(c => c.id === cardId);
      if (card) { card.isExpanded = !card.isExpanded; break; }
    }
    render(); saveState(); return;
  }
  const subCardItem = e.target.closest('.sub-card-item');
  if (subCardItem) {
    e.stopPropagation();
    const cardEl = e.target.closest('.card');
    if (cardEl) {
      const cardId = cardEl.dataset.id;
      const currentBoard = boardStack[boardStack.length - 1];
      for (const list of currentBoard.lists) {
        const card = list.cards.find(c => c.id === cardId);
        if (card && card.subBoard) {
          boardStack.push({ lists: card.subBoard.lists, title: card.title });
          render(); break;
        }
      }
    }
    return;
  }
  const actEl = e.target.closest('[data-act]');
  if (actEl) {
    const act = actEl.dataset.act;
    const listId = actEl.dataset.listId || (actEl.closest('.list') && actEl.closest('.list').dataset.id);
    if (act === 'add-card') { startAddCard(actEl.closest('.list'), listId); return; }
    if (act === 'del-list') {
      const currentBoard = boardStack[boardStack.length - 1];
      const list = currentBoard.lists.find(l => l.id === listId);
      if (!list) return;
      if (currentBoard.lists.length <= 1) { alert('至少保留一个列表'); return; }
      if (confirm(`确定删除列表「${list.title}」及其所有卡片吗？`)) {
        currentBoard.lists = currentBoard.lists.filter(l => l.id !== listId);
        render(); saveState();
      }
      return;
    }
    if (act === 'rename-list') {
      const currentBoard = boardStack[boardStack.length - 1];
      const list = currentBoard.lists.find(l => l.id === listId);
      if (!list) return;
      openRenameListModal(listId, list.title);
      return;
    }
  }
  const cardEl = e.target.closest('.card');
  if (cardEl) openCard(cardEl.dataset.id);
});

function startAddCard(listEl, listId) {
  if (!listEl) return;
  const exist = listEl.querySelector('.composer textarea');
  if (exist) { exist.focus(); return; }
  const cardsEl = listEl.querySelector('.cards');
  const composer = document.createElement('div');
  composer.className = 'composer';
  const ta = document.createElement('textarea');
  ta.placeholder = '输入标题，回车添加（Esc 取消）';
  composer.appendChild(ta);
  cardsEl.appendChild(composer);
  ta.focus();
  cardsEl.scrollTop = cardsEl.scrollHeight;
  const commit = () => {
    const v = ta.value.trim();
    if (!v) { composer.remove(); return; }
    const currentBoard = boardStack[boardStack.length - 1];
    const list = currentBoard.lists.find(l => l.id === listId);
    if (!list) return;
    list.cards.push({ 
      id: uid(), title: v, desc: '', tags: [], priority: 'none', due: '', 
      checklist: [], attachments: [], subBoard: null, isExpanded: false 
    });
    render(); saveState();
  };
  ta.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); commit(); }
    else if (ev.key === 'Escape') { composer.remove(); }
  });
  ta.addEventListener('blur', () => {
    setTimeout(() => { if (composer.isConnected && !ta.value.trim()) composer.remove(); }, 150);
  });
}

/* =========================================================
   顶栏
   ========================================================= */
document.getElementById('addListBtn').onclick = () => {
  const title = prompt('新列表名称', '新列表');
  if (title === null) return;
  const cb = boardStack[boardStack.length - 1];
  cb.lists.push({ id: uid(), title: title.trim() || '新列表', cards: [] });
  render(); saveState();
};

document.getElementById('resetBtn').onclick = async () => {
  const answer = prompt(
    '⚠️ 重置会清空所有看板数据和附件，且不可恢复。\n\n' +
    '如果确定要重置，请手动输入以下文字：\n' +
    '我知道重置会把所有内容清空'
  );
  if (answer !== '我知道重置会把所有内容清空') {
    if (answer !== null) alert('❌ 输入不正确，重置已取消。');
    return;
  }
  showLoading('重置中...');
  try {
    await clearStateDB();
    state = defaultData();
    syncBoardStack(); renderBoardSelect();
    await saveState(); render();
    alert('✅ 已重置。');
  } finally { hideLoading(); }
};

document.getElementById('exportBtn').onclick = () => {
  const cb = boardStack[boardStack.length - 1];
  const boardName = boardStack[0].title;
  let csv = `\uFEFF看板: ${boardName}\n列表,标题,描述,标签,优先级,截止日期,待办清单,本地附件,外部链接\n`;
  cb.lists.forEach(list => {
    list.cards.forEach(card => {
      const tags = (card.tags || []).join(' ');
      const checklistStr = (card.checklist || []).map(c => `${c.done ? '[x]' : '[ ]'}${c.text}`).join('; ');
      const fileStr = (card.attachments || []).filter(a => a.kind === 'file').map(a => `${a.name}(${formatFileSize(a.size)})`).join('; ');
      const linkStr = (card.attachments || []).filter(a => a.kind === 'link').map(a => `${a.name}: ${a.url}`).join('; ');
      const clean = s => String(s || '').replace(/"/g, '""').replace(/\n/g, ' ');
      csv += [
        `"${clean(list.title)}"`, `"${clean(card.title)}"`, `"${clean(card.desc)}"`,
        `"${clean(tags)}"`, `"${card.priority || 'none'}"`, `"${card.due || ''}"`,
        `"${clean(checklistStr)}"`, `"${clean(fileStr)}"`, `"${clean(linkStr)}"`
      ].join(',') + '\n';
    });
  });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `栗子看板_${boardName}_${new Date().toISOString().slice(0,10)}.csv`;
  link.click();
  URL.revokeObjectURL(link.href);
};

document.getElementById('backupBtn').onclick = async () => {
  let attCount = 0;
  state.boards.forEach(b => b.lists.forEach(l => l.cards.forEach(c => {
    attCount += (c.attachments || []).filter(a => a.kind === 'file').length;
  })));
  const msg = attCount > 0
    ? `📥 备份 JSON 将导出【所有卡片 + ${attCount} 个本地附件】。\n\n本地附件以 Base64 内嵌，文件会比较大。\n外部链接只保存 URL。\n\n确定继续吗？`
    : '📥 导出 JSON 备份？';
  if (!confirm(msg)) return;
  showLoading('正在生成 JSON...');
  try {
    const dataStr = JSON.stringify(state);
    const blob = new Blob([dataStr], { type: 'application/json' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    const sizeMB = (blob.size / 1024 / 1024).toFixed(2);
    link.download = `栗子看板备份_${new Date().toISOString().slice(0,10)}_${sizeMB}MB.json`;
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 2000);
    alert(`✅ 已导出，文件大小约 ${sizeMB} MB`);
  } finally { hideLoading(); }
};

const importFileInput = document.getElementById('importFileInput');
document.getElementById('importBtn').onclick = () => importFileInput.click();
importFileInput.onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  if (!confirm(`将导入「${file.name}」（${formatFileSize(file.size)}）。\n\n导入会覆盖当前所有数据，确定吗？`)) {
    importFileInput.value = ''; return;
  }
  showLoading('正在导入 JSON...');
  try {
    const text = await file.text();
    const importedData = JSON.parse(text);
    if (importedData && Array.isArray(importedData.boards)) {
      state = importedData;
      if (!state.currentBoardId || !state.boards.some(b => b.id === state.currentBoardId)) {
        state.currentBoardId = state.boards[0].id;
      }
    } else if (importedData && Array.isArray(importedData.lists)) {
      const upgradeBoard = { id: uid(), name: '导入的看板', lists: importedData.lists };
      state = { boards: [upgradeBoard], currentBoardId: upgradeBoard.id };
    } else {
      throw new Error('文件格式不对');
    }
    state.boards.forEach(b => b.lists.forEach(l => l.cards.forEach(c => {
      if (!c.checklist) c.checklist = [];
      if (!c.attachments) c.attachments = [];
      // 兼容旧数据结构
      c.attachments.forEach(a => {
        if (!a.kind) a.kind = (a.url && !a.data) ? 'link' : 'file';
      });
    })));
    syncBoardStack(); renderBoardSelect();
    await saveState(); render();
    alert('✅ 导入成功！');
  } catch (err) {
    console.error(err);
    alert('❌ 导入失败：' + err.message);
  } finally {
    hideLoading();
    importFileInput.value = '';
  }
};

/* =========================================================
   初始化
   ========================================================= */
async function init() {
  showLoading('加载数据...');
  try {
    await openStateDB();
    const dbState = await loadStateFromDB();
    if (dbState && dbState.boards && dbState.boards.length > 0) {
      state = dbState;
    } else {
      const old = localStorage.getItem('chestnut-kanban-v5') 
               || localStorage.getItem('chestnut-kanban-v4')
               || localStorage.getItem('chestnut-kanban-v3');
      if (old) {
        try {
          const d = JSON.parse(old);
          if (d && Array.isArray(d.boards) && d.boards.length > 0) state = d;
          else if (d && Array.isArray(d.lists)) {
            state = { boards: [{ id: uid(), name: '我的看板', lists: d.lists }], currentBoardId: null };
            state.currentBoardId = state.boards[0].id;
          }
        } catch (e) {}
      }
      if (!state) state = defaultData();
      if (!state.currentBoardId || !state.boards.some(b => b.id === state.currentBoardId)) {
        state.currentBoardId = state.boards[0].id;
      }
      await saveState();
    }
    state.boards.forEach(b => b.lists.forEach(l => l.cards.forEach(c => {
      if (!c.checklist) c.checklist = [];
      if (!c.attachments) c.attachments = [];
      c.attachments.forEach(a => {
        if (!a.kind) a.kind = (a.url && !a.data) ? 'link' : 'file';
      });
    })));
  } catch (e) {
    console.error(e);
    state = defaultData();
    state.currentBoardId = state.boards[0].id;
  }
  syncBoardStack();
  renderBoardSelect();
  render();
  hideLoading();
}
init();
