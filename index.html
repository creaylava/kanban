  const ml = e.target.closest('[data-act="move-list-left"]');
  if (ml) { e.stopPropagation(); moveList(ml.dataset.listId, -1); return; }
  const mr = e.target.closest('[data-act="move-list-right"]');
  if (mr) { e.stopPropagation(); moveList(mr.dataset.listId, 1); return; }
  const up = e.target.closest('[data-act="move-up"]');
  if (up) { e.stopPropagation(); moveCardPriority(up.dataset.cardId, -1); return; }
  const dn = e.target.closest('[data-act="move-down"]');
  if (dn) { e.stopPropagation(); moveCardPriority(dn.dataset.cardId, 1); return; }
  const mv = e.target.closest('[data-act="quick-move"]');
  if (mv) { e.stopPropagation(); openQuickMoveMenu(mv.dataset.cardId); return; }
  const pv = e.target.closest('[data-act="preview-sub"]');
  if (pv) { e.stopPropagation(); openSubPreview(pv.dataset.cardId); return; }
  
  // ★ 从模板添加
  const tplBtn = e.target.closest('[data-act="add-from-template"]');
  if (tplBtn) { e.stopPropagation(); openTemplatePicker(tplBtn.dataset.listId); return; }
  
  const tg = e.target.closest('[data-act="toggle-sub"]');
  if (tg) {
    e.stopPropagation();
    const cb = boardStack[boardStack.length - 1];
    for (const l of cb.lists) {
      const c = l.cards.find(x => x.id === tg.dataset.cardId);
      if (c) { c.isExpanded = !c.isExpanded; break; }
    }
    render(); saveState(); return;
  }

  // ★ 子卡片星标切换
  const starBtn = e.target.closest('[data-act="toggle-star"]');
  if (starBtn) {
    e.stopPropagation();
    const card = findSubCardObj(starBtn.dataset.parentCardId, starBtn.dataset.subListId, starBtn.dataset.subCardId);
    if (card) {
      card.starred = !card.starred;
      render(); saveState();
    }
    return;
  }

  // ★ 删除子卡片 (必须放在进入子看板逻辑之前，且阻止事件冒泡)
  const delSubBtn = e.target.closest('[data-act="del-sub-card"]');
  if (delSubBtn) {
    e.stopPropagation();
    const parentCardId = delSubBtn.dataset.parentCardId;
    const subListId = delSubBtn.dataset.subListId;
    const subCardId = delSubBtn.dataset.subCardId;
    
    if (confirm('确定删除这张子卡片吗？')) {
      const cb = boardStack[boardStack.length - 1];
      let found = false;
      for (const l of cb.lists) {
        const pCard = l.cards.find(c => c.id === parentCardId);
        if (pCard && pCard.subBoard) {
          const sList = pCard.subBoard.lists.find(sl => sl.id === subListId);
          if (sList) {
            const initLen = sList.cards.length;
            sList.cards = sList.cards.filter(sc => sc.id !== subCardId);
            if (sList.cards.length < initLen) found = true;
            break;
          }
        }
      }
      if (found) {
        render(); 
        saveState();
      } else {
        alert('未找到该子卡片，可能已被删除');
      }
    }
    return;
  }

  const sc = e.target.closest('.sub-card-item');
  if (sc) {
    e.stopPropagation();
    const ce = e.target.closest('.card');
    if (ce) {
      const cb = boardStack[boardStack.length - 1];
      for (const l of cb.lists) {
        const c = l.cards.find(x => x.id === ce.dataset.id);
        if (c && c.subBoard) { boardStack.push({ lists: c.subBoard.lists, title: c.title }); render(); break; }
      }
    }
    return;
  }
  const ae = e.target.closest('[data-act]');
  if (ae) {
    const act = ae.dataset.act;
    const listId = ae.dataset.listId || (ae.closest('.list') && ae.closest('.list').dataset.id);
    if (act === 'add-card') { startAddCard(ae.closest('.list'), listId); return; }
    if (act === 'del-list') {
      const cb = boardStack[boardStack.length - 1];
      const idx = cb.lists.findIndex(x => x.id === listId);
      if (idx < 0) return;
      if (cb.lists.length <= 1) { alert('至少保留一个列表'); return; }
      if (confirm(`确定删除列表「${cb.lists[idx].title}」？`)) {
        cb.lists.splice(idx, 1);
        render(); await saveState();
      }
      return;
    }
    if (act === 'rename-list') {
      const cb = boardStack[boardStack.length - 1];
      const l = cb.lists.find(x => x.id === listId);
      if (!l) return;
      openRenameListModal(listId, l.title);
      return;
    }
  }
  const ce = e.target.closest('.card');
  if (ce) openCard(ce.dataset.id);
});

function startAddCard(listEl, listId) {
  if (!listEl) return;
  const ex = listEl.querySelector('.composer textarea');
  if (ex) { ex.focus(); return; }
  const cardsEl = listEl.querySelector('.cards');
  const composer = document.createElement('div');
  composer.className = 'composer';
  const ta = document.createElement('textarea');
  ta.placeholder = '输入标题，回车添加（Esc 取消）';
  composer.appendChild(ta);
  cardsEl.appendChild(composer);
  ta.focus();
  cardsEl.scrollTop = cardsEl.scrollHeight;
  const commit = () => {
    const v = ta.value.trim();
    if (!v) { composer.remove(); return; }
    const cb = boardStack[boardStack.length - 1];
    const l = cb.lists.find(x => x.id === listId);
    if (!l) return;
    l.cards.push({ id: uid(), title: v, desc: '', tags: [], priority: 'none', due: '', checklist: [], attachments: [], notes: [], subBoard: null, isExpanded: false });
    render(); saveState();
  };
  ta.addEventListener('keydown', ev => {
    if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); commit(); }
    else if (ev.key === 'Escape') composer.remove();
  });
  ta.addEventListener('blur', () => {
    setTimeout(() => { if (composer.isConnected && !ta.value.trim()) composer.remove(); }, 150);
  });
}

document.getElementById('exportBtn').onclick = () => {
  const cb = boardStack[boardStack.length - 1];
  const bn = boardStack[0].title;
  let csv = `\uFEFF看板: ${bn}\n列表,标题,描述,标签,优先级,截止日期,待办清单,本地附件,外部链接,笔记\n`;
  cb.lists.forEach(l => l.cards.forEach(c => {
    const tags = (c.tags||[]).join(' ');
    const cl = (c.checklist||[]).map(x => `${x.done?'[x]':'[ ]'}${x.text}`).join('; ');
    const fl = (c.attachments||[]).filter(a => a.kind === 'file').map(a => `${a.name}(${formatFileSize(a.size)})`).join('; ');
    const lk = (c.attachments||[]).filter(a => a.kind === 'link').map(a => `${a.name}: ${a.url}`).join('; ');
    const nt = (c.notes||[]).map((n,i) => `[笔记${i+1}]${n.text||''}${(n.attachments||[]).length ? ' (附件:' + n.attachments.map(a=>a.name).join(',') + ')' : ''}`).join('; ');
    const clean = s => String(s||'').replace(/"/g,'""').replace(/\n/g,' ');
    csv += [`"${clean(l.title)}"`,`"${clean(c.title)}"`,`"${clean(c.desc)}"`,`"${clean(tags)}"`,`"${c.priority||'none'}"`,`"${c.due||''}"`,`"${clean(cl)}"`,`"${clean(fl)}"`,`"${clean(lk)}"`,`"${clean(nt)}"`].join(',') + '\n';
  }));
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `栗子看板_${bn}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
};

document.getElementById('backupBtn').onclick = async () => {
  let cnt = 0, noteCnt = 0, noteAttCnt = 0, pinCnt = 0, linkCnt = 0;
  state.boards.forEach(b => {
    pinCnt += (b.pins||[]).length;
    linkCnt += (b.links||[]).length;
    b.lists.forEach(l => l.cards.forEach(c => {
      cnt += (c.attachments||[]).filter(a => a.kind === 'file').length;
      (c.notes||[]).forEach(n => { noteCnt++; noteAttCnt += (n.attachments||[]).filter(a => a.kind === 'file').length; });
    }));
  });
  const tplCnt = (state.templates || []).length;
  const msg = `📥 备份将导出：\n· 所有看板卡片\n· ${cnt} 个本地附件（Base64 内嵌）\n· ${noteCnt} 个笔记块（含 ${noteAttCnt} 个附件）\n· ${pinCnt} 张剪贴板图片\n· ${linkCnt} 个链接\n· ${tplCnt} 个模板\n\n继续吗？`;
  if (!confirm(msg)) return;
  showLoading('生成 JSON...');
  try {
    const str = JSON.stringify(state);
    const blob = new Blob([str], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    const mb = (blob.size/1024/1024).toFixed(2);
    a.download = `栗子看板备份_${new Date().toISOString().slice(0,10)}_${mb}MB.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    alert(`✅ 已导出，大小约 ${mb} MB`);
  } finally { hideLoading(); }
};

/* =========================================================

document.getElementById('snapshotBtn').onclick = async () => {
  showLoading('生成网页快照...');
  try {
    /* 1) 先展开所有子看板以便完整呈现 */
    const cb = boardStack[boardStack.length - 1];
    const prevExpanded = [];
    cb.lists.forEach(l => l.cards.forEach(c => {
      if (c.subBoard) { prevExpanded.push({ card: c, was: c.isExpanded }); c.isExpanded = true; }
    }));
    render();
    await new Promise(r => setTimeout(r, 100));

    /* 2) 克隆整个文档 */
    const clone = document.documentElement.cloneNode(true);

    /* 3) 移除弹窗 overlay（只保留看板主体） */
    clone.querySelectorAll('.overlay, #loadingOverlay, #subCardTooltip').forEach(el => el.remove());

    /* 4) 移除所有 <script> 标签（快照是静态的） */
    clone.querySelectorAll('script').forEach(el => el.remove());

    /* 5) 给 header 加上快照标识 */
    const header = clone.querySelector('header');
    if (header) {
      /* 移除交互按钮 */
      header.querySelectorAll('button, select, input').forEach(el => el.remove());
      header.querySelector('.spacer')?.remove();
      const boardName = getCurrentBoard()?.name || '看板';

        <span class="logo">🌰</span>

    }

    /* 6) 星标按钮转为静态文字，然后移除操作按钮 */
    clone.querySelectorAll('.star-btn.starred').forEach(el => {
      const span = document.createElement('span');
      span.className = 'card-star';
      span.textContent = '★';
      el.replaceWith(span);
    });
    clone.querySelectorAll('.card-footer, .list-bottom-actions, .list-header button, .star-btn, .del-sub-card-btn').forEach(el => el.remove());

    /* 7) 剪贴板区域：移除拖放区、删除按钮 */
    clone.querySelectorAll('.pin-drop-zone, .pin-del, .pin-fold-btn').forEach(el => el.remove());
    /* 展开所有折叠的 pin */
    clone.querySelectorAll('.pin-item.collapsed').forEach(el => el.classList.remove('collapsed'));
    /* 链接区：移除添加表单和删除按钮 */
    clone.querySelectorAll('.board-link-add, .board-link-del').forEach(el => el.remove());

    /* 8) 加入打印友好样式 */
    const style = clone.querySelector('style') || document.createElement('style');
    const extraCSS = `
      body { overflow: auto !important; }
      @media print {
        header { position: static !important; }
        body { padding-top: 0 !important; }
        .card { break-inside: avoid; }
      }
    `;
    // 在 style 末尾追加
    const allStyles = clone.querySelectorAll('style');
    if (allStyles.length) allStyles[allStyles.length - 1].textContent += extraCSS;

    /* 9) 生成完整 HTML */
    const html = '<!DOCTYPE html>\n' + clone.outerHTML;
    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    const snapName = getCurrentBoard()?.name || '看板';

    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);

    render();

    alert(`✅ 快照已导出（${mb} MB）\n用浏览器打开即可离线查看。`);
  } catch (e) {
    console.error(e);
    alert('❌ 快照导出失败：' + e.message);

const importFileInput = document.getElementById('importFileInput');
document.getElementById('importBtn').onclick = () => importFileInput.click();
importFileInput.onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  if (!confirm(`导入「${f.name}」将覆盖当前数据，继续吗？`)) { importFileInput.value = ''; return; }
  showLoading('导入中...');
  try {
    const txt = await f.text();
    const d = JSON.parse(txt);
    if (d && Array.isArray(d.boards)) {
      state = d;
    } else if (d && Array.isArray(d.lists)) {
      state = { boards: [{ id: uid(), name: '导入的看板', lists: d.lists }], currentBoardId: null, templates: [] };
      state.currentBoardId = state.boards[0].id;
    } else throw new Error('文件格式错误');
    if (!state.templates) state.templates = [];
    if (!state.currentBoardId || !state.boards.some(b => b.id === state.currentBoardId)) {
      state.currentBoardId = state.boards[0].id;
    }
    state.boards.forEach(b => {
      if (!b.pins) b.pins = [];
      if (!b.links) b.links = [];
      b.lists.forEach(l => l.cards.forEach(c => {
        if (!c.checklist) c.checklist = [];
        if (!c.attachments) c.attachments = [];
        c.attachments.forEach(a => { if (!a.kind) a.kind = (a.url && !a.data) ? 'link' : 'file'; });
        if (!c.notes) c.notes = [];
        c.notes.forEach(n => { if (!n.attachments) n.attachments = []; });
      }));
    });
    syncBoardStack(); renderBoardSelect();
    await saveStateToDB(state);
    render();
    alert('✅ 导入成功！');
  } catch (err) {
    alert('❌ 导入失败：' + err.message);
  } finally { hideLoading(); importFileInput.value = ''; }
};

const pinHeader   = document.getElementById('pinHeader');
const pinBody     = document.getElementById('pinBody');
const pinCollapseBtn = document.getElementById('pinCollapseBtn');
const pinList     = document.getElementById('pinList');
const pinDropZone = document.getElementById('pinDropZone');
const pinFileInput = document.getElementById('pinFileInput');

function ensurePins(b) {
  if (!b.pins) b.pins = [];
  return b.pins;
}

function renderPinboard() {
  const b = getCurrentBoard();
  if (!b) return;
  const pins = ensurePins(b);
  pinList.innerHTML = pins.map((p, i) => {
    const isFolded = p._folded || false;
    const summary = (p.note || '').slice(0, 10) || '(无注释)';
    const dots = (p.note || '').length > 10 ? '…' : '';
    return `<div class="pin-item${isFolded ? ' collapsed' : ''}" data-idx="${i}">
       <button class="pin-fold-btn" data-idx="${i}" title="${isFolded ? '展开' : '折叠'}">${isFolded ? '▶' : '▼'}</button>
       <span class="pin-summary" data-idx="${i}"><span class="pin-summary-icon">🖼</span>${esc(summary)}${dots}</span>
       <div class="pin-thumb" data-idx="${i}"><img src="${p.data}"></div>
       <div class="pin-note">
         <textarea data-idx="${i}" placeholder="添加注释…">${esc(p.note || '')}</textarea>
       </div>
       <button class="pin-del" data-idx="${i}" title="删除">✕</button>
     </div>`;
  }).join('');
}

/* 添加图片的通用逻辑 */
async function addPinImages(files) {
  const b = getCurrentBoard();
  if (!b) return;
  const pins = ensurePins(b);
  let added = 0;
  for (const f of files) {
    if (!f.type.startsWith('image/')) continue;
    if (f.size > MAX_FILE_SIZE) {
      alert(`❌「${f.name}」大小 ${formatFileSize(f.size)}，超过 500KB 限制，已跳过。`);
      continue;
    }
    try {
      const dataURL = await fileToDataURL(f);
      pins.push({ id: uid(), data: dataURL, note: '', name: f.name, size: f.size, type: f.type });
      added++;
    } catch (e) { console.error(e); }
  }
  if (added) {
    pinBody.classList.remove('collapsed');
    pinCollapseBtn.style.transform = '';
    saveState(); renderPinboard();
  }
}

/* Ctrl+V 粘贴图片 — 全局监听 */
document.addEventListener('paste', async (e) => {
  /* 提取剪贴板中的图片 */
  const items = Array.from(e.clipboardData?.items || []);
  const imgFiles = [];
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      const f = item.getAsFile();
      if (f) imgFiles.push(f);
    }
  }
  if (!imgFiles.length) return;

  /* ① 卡片编辑弹窗打开时 → 图片添加到卡片附件 */
  if (overlay.classList.contains('show')) {
    e.preventDefault();
    for (const f of imgFiles) {
      if (f.size > MAX_FILE_SIZE) {
        alert(`❌「${f.name || '粘贴图片'}」大小 ${formatFileSize(f.size)}，超过 500KB 限制，已跳过。`);
        continue;
      }
      try {
        const dataURL = await fileToDataURL(f);
        editingAttachments.push({
          id: uid(), kind: 'file',
          name: f.name || ('paste-' + Date.now() + '.png'),
          size: f.size, type: f.type || 'image/png', data: dataURL
        });
      } catch (err) { console.error(err); }
    }
    renderAttachmentsUI();
    return;
  }

  /* ② 焦点在输入框/文本框内时不拦截（让用户正常粘贴文字） */
  const tag = (document.activeElement || {}).tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || (document.activeElement && document.activeElement.isContentEditable)) return;

  /* ③ 其他情况 → 图片添加到剪贴板区域 */
  e.preventDefault();
  await addPinImages(imgFiles);
});

/* 拖拽图片到 drop zone */
pinDropZone.addEventListener('dragover', (e) => { e.preventDefault(); e.stopPropagation(); pinDropZone.classList.add('drag-over'); });
pinDropZone.addEventListener('dragleave', (e) => { e.preventDefault(); e.stopPropagation(); pinDropZone.classList.remove('drag-over'); });
pinDropZone.addEventListener('drop', async (e) => {

  pinDropZone.classList.remove('drag-over');

});

  pinFileInput.click();

};

/* 点击缩略图预览 / 折叠展开 / 删除 */
pinList.addEventListener('click', (e) => {
  /* ★ 折叠/展开按钮 */
  const foldBtn = e.target.closest('.pin-fold-btn');
  if (foldBtn) {
    const idx = +foldBtn.dataset.idx;
    const b = getCurrentBoard();
    if (!b) return;
    const pin = ensurePins(b)[idx];
    if (pin) { pin._folded = !pin._folded; renderPinboard(); }
    return;
  }
  /* ★ 折叠摘要点击 → 展开 */
  const summary = e.target.closest('.pin-summary');
  if (summary) {
    const idx = +summary.dataset.idx;
    const b = getCurrentBoard();
    if (!b) return;
    const pin = ensurePins(b)[idx];
    if (pin) { pin._folded = false; renderPinboard(); }
    return;
  }
  const thumb = e.target.closest('.pin-thumb');
  if (thumb) {
    const idx = +thumb.dataset.idx;
    const b = getCurrentBoard();
    if (!b) return;
    const pin = ensurePins(b)[idx];
    if (pin) showPreviewImage(pin.data, pin.name || '粘贴图片');
    return;
  }
  /* 删除 */
  const del = e.target.closest('.pin-del');
  if (del) {
    const idx = +del.dataset.idx;
    const b = getCurrentBoard();
    if (!b) return;
    ensurePins(b).splice(idx, 1);
    saveState(); renderPinboard();
  }
});

/* 注释编辑（防抖保存） */
let _pinNoteTimer = null;
pinList.addEventListener('input', (e) => {
  if (e.target.tagName !== 'TEXTAREA') return;
  clearTimeout(_pinNoteTimer);
  const idx = +e.target.dataset.idx;
  _pinNoteTimer = setTimeout(() => {
    const b = getCurrentBoard();

/* =========================================================
   ⏰ 到期提醒面板
   ========================================================= */
const dueReminderBtn = document.getElementById('dueReminderBtn');
const dueBadge = document.getElementById('dueBadge');
const duePanel = document.getElementById('duePanel');

/* 递归收集所有有截止日期的卡片 */
function collectDueCards() {
  const results = [];
  state.boards.forEach(board => {
    function walk(lists, path) {
      lists.forEach(l => l.cards.forEach(c => {
        if (c.due) {
          results.push({ card: c, boardId: board.id, boardName: board.name, path });
        }
        if (c.subBoard && c.subBoard.lists) {
          walk(c.subBoard.lists, path ? path + ' › ' + c.title : c.title);
        }
      }));
    }
    walk(board.lists, '');
  });
  return results;
}

/* 筛选一周内到期（含已过期）的卡片 */
function getDueWithin7Days() {
  const now = new Date();
  const todayStr = now.toISOString().slice(0, 10);
  const d7 = new Date(now);
  d7.setDate(d7.getDate() + 7);
  const weekStr = d7.toISOString().slice(0, 10);
  return collectDueCards().filter(it => it.card.due <= weekStr)
    .sort((a, b) => a.card.due.localeCompare(b.card.due));
}

function updateDueBadge() {
  const cnt = getDueWithin7Days().length;
  if (cnt > 0) {
    dueBadge.textContent = cnt > 99 ? '99+' : cnt;
    dueBadge.style.display = '';
  } else {
    dueBadge.style.display = 'none';
  }
}

function renderDueReminder() {
  const items = getDueWithin7Days();
  updateDueBadge();
  if (items.length === 0) {
    duePanel.innerHTML = '<div class="due-panel-title">⏰ 到期提醒</div><div class="due-panel-empty">一周内没有到期的卡片 🎉</div>';
    return;
  }
  const todayStr = new Date().toISOString().slice(0, 10);
  /* 分组：已过期 / 今天 / 即将到期 */
  const overdue = [], todayItems = [], upcoming = [];
  items.forEach(it => {
    if (it.card.due < todayStr) overdue.push(it);
    else if (it.card.due === todayStr) todayItems.push(it);
    else upcoming.push(it);
  });

  function daysLabel(dueStr) {
    const diff = Math.round((new Date(dueStr) - new Date(todayStr)) / 86400000);
    if (diff < 0) return `已过期${-diff}天`;
    if (diff === 0) return '今天';
    if (diff === 1) return '明天';
    return `${diff}天后`;
  }

  let html = `<div class="due-panel-title">⏰ 到期提醒（${items.length}）</div>`;

  function renderGroup(title, list, dateClass) {
    if (!list.length) return '';
    let g = `<div class="due-panel-group"><div class="due-panel-group-title">${title}</div>`;
    list.forEach(it => {
      g += `<div class="due-panel-item" data-board-id="${it.boardId}" data-card-id="${it.card.id}">
        <span class="dpi-icon">${dateClass === 'overdue' ? '🔴' : dateClass === 'today' ? '🟡' : '🟢'}</span>
        <span class="dpi-title">${esc(it.card.title).replace(/\n/g,' ')}</span>
        <span class="dpi-date ${dateClass}">${daysLabel(it.card.due)}</span>
        <span class="dpi-board" title="${esc(it.boardName)}">${esc(it.boardName)}</span>
      </div>`;
    });
    g += '</div>';
    return g;
  }

  html += renderGroup('🔴 已过期', overdue, 'overdue');
  html += renderGroup('🟡 今天到期', todayItems, 'today');
  html += renderGroup('🟢 即将到期', upcoming, 'soon');
  duePanel.innerHTML = html;
}

   ========================================================= */
const starReminderBtn = document.getElementById('starReminderBtn');
const starBadge = document.getElementById('starBadge');
const starPanel = document.getElementById('starPanel');

/* 仅更新角标数字（在 render() 中调用，轻量） */
function updateStarBadge() {
  let cnt = 0;
  function walk(lists) {
    lists.forEach(l => l.cards.forEach(c => {
      if (c.starred) cnt++;
      if (c.subBoard && c.subBoard.lists) walk(c.subBoard.lists);
    }));
  }
  state.boards.forEach(b => walk(b.lists));
  if (cnt > 0) {
    starBadge.textContent = cnt > 99 ? '99+' : cnt;
    starBadge.style.display = '';
  } else {
    starBadge.style.display = 'none';
  }
}

/* 递归收集所有星标卡片，返回 [{card, boardId, boardName, path}] */
function collectStarredCards() {
  const results = [];
  state.boards.forEach(board => {
    function walk(lists, path) {
      lists.forEach(l => {
        l.cards.forEach(c => {
          if (c.starred) {
            results.push({ card: c, boardId: board.id, boardName: board.name, path });
          }
          if (c.subBoard && c.subBoard.lists) {
            walk(c.subBoard.lists, path ? path + ' › ' + c.title : c.title);
          }
        });
      });
    }
    walk(board.lists, '');
  });
  return results;
}

function renderStarReminder() {
  const items = collectStarredCards();
  /* 更新角标 */
  if (items.length > 0) {
    starBadge.textContent = items.length > 99 ? '99+' : items.length;
    starBadge.style.display = '';
  } else {
    starBadge.style.display = 'none';
  }
  /* 面板内容按看板分组 */
  if (items.length === 0) {
    starPanel.innerHTML = '<div class="star-panel-title">★ 星标提醒</div><div class="star-panel-empty">暂无星标卡片</div>';
    return;
  }
  let html = '<div class="star-panel-title">★ 星标提醒（' + items.length + '）</div>';
  const grouped = {};
  items.forEach(it => {
    if (!grouped[it.boardId]) grouped[it.boardId] = { name: it.boardName, items: [] };
    grouped[it.boardId].items.push(it);
  });
  for (const bId in grouped) {
    const g = grouped[bId];
    html += `<div class="star-panel-group">`;
    html += `<div class="star-panel-board">📋 ${esc(g.name)}</div>`;
    g.items.forEach(it => {
      const pathHtml = it.path ? `<span class="spi-path" title="${esc(it.path)}">${esc(it.path)}</span>` : '';
      html += `<div class="star-panel-item" data-board-id="${bId}" data-card-id="${it.card.id}">
        <span class="spi-star">★</span>
        <span class="spi-title">${esc(it.card.title)}</span>
        ${pathHtml}
      </div>`;
    });
    html += `</div>`;
  }
  starPanel.innerHTML = html;
}

/* 切换面板 */
starReminderBtn.onclick = (e) => {

  /* 关闭到期面板 */
  duePanel.classList.remove('show');

/* =========================================================
   初始化
   ========================================================= */
async function init() {
  showLoading('加载数据...');
  try {
    await openStateDB();
    const dbState = await loadStateFromDB();
    if (dbState && dbState.boards && dbState.boards.length > 0) {
      state = dbState;
    } else {
      const old = localStorage.getItem('chestnut-kanban-v5') || localStorage.getItem('chestnut-kanban-v4');
      if (old) {
        try {
          const d = JSON.parse(old);
          if (d && Array.isArray(d.boards) && d.boards.length > 0) state = d;
          else if (d && Array.isArray(d.lists)) {
            state = { boards: [{ id: uid(), name: '我的看板', lists: d.lists }], currentBoardId: null, templates: [] };
            state.currentBoardId = state.boards[0].id;
          }
        } catch (e) {}
      }
      if (!state) state = defaultData();
      if (!state.templates) state.templates = [];
      if (!state.currentBoardId || !state.boards.some(b => b.id === state.currentBoardId)) {
        state.currentBoardId = state.boards[0].id;
      }
      await saveStateToDB(state);
    }
    if (!state.templates) state.templates = [];
    state.boards.forEach(b => {
      if (!b.pins) b.pins = [];
      if (!b.links) b.links = [];
      b.lists.forEach(l => l.cards.forEach(c => {
        if (!c.checklist) c.checklist = [];
        if (!c.attachments) c.attachments = [];
        c.attachments.forEach(a => { if (!a.kind) a.kind = (a.url && !a.data) ? 'link' : 'file'; });
        if (!c.notes) c.notes = [];
        c.notes.forEach(n => { if (!n.attachments) n.attachments = []; });
      }));
    });
  } catch (e) {
    console.error(e);
    state = defaultData();
    state.currentBoardId = state.boards[0].id;
  }
  syncBoardStack();
  renderBoardSelect();
  render();
  hideLoading();
}
init();
window.addEventListener('resize', () => requestAnimationFrame(alignCardRows));
