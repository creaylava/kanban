<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🌰 栗子看板</title>
<style>
  :root{
    --bg:#f5f2ed;
    --list-bg:#e9e4db;
    --card-bg:#fff;
    --text:#2e2a26;
    --muted:#8c8377;
    --accent:#c8662f;
    --border:#e2dbd1;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  /* ---------- 顶栏 ---------- */
  header{
    display:flex;align-items:center;gap:10px;
    padding:10px 18px;background:#fff;
    border-bottom:1px solid var(--border);
    flex:0 0 auto;z-index:10;
  }
  header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.3px;}
  .logo{font-size:20px;}
  .spacer{flex:1;}
  .btn{
    border:1px solid var(--border);background:#fff;color:var(--text);
    padding:7px 12px;border-radius:8px;font-size:13px;cursor:pointer;
    font-family:inherit;transition:.15s;
  }
  .btn:hover{background:#f5f1ea;}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.primary:hover{background:#b35726;}
  .btn.danger{color:#d0453a;border-color:#f0cfcc;}
  .btn.danger:hover{background:#fdf1f0;}

  /* ---------- 看板 ---------- */
  #board{
    flex:1;display:flex;gap:14px;
    padding:18px 20px 24px;
    overflow-x:auto;overflow-y:hidden;
    align-items:flex-start;
  }
  .empty{margin:auto;color:var(--muted);font-size:14px;}

  .list{
    flex:0 0 280px;width:280px;
    background:var(--list-bg);
    border-radius:12px;
    display:flex;flex-direction:column;
    max-height:100%;
    padding:4px;
    transition:opacity .15s;
  }
  .list.dragging{opacity:.35;}
  .list-placeholder{
    flex:0 0 auto;border-radius:12px;
    background:rgba(0,0,0,.06);
    border:1px dashed rgba(0,0,0,.15);
  }

  .list-header{
    display:flex;align-items:center;gap:8px;
    padding:8px 10px;cursor:grab;user-select:none;
  }
  .list-header:active{cursor:grabbing;}
  .list-title{
    font-weight:600;font-size:14px;flex:1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    border-radius:6px;padding:2px 4px;margin:-2px -4px;
  }
  .list-title:hover{background:rgba(0,0,0,.06);}
  .list-count{
    font-size:12px;color:var(--muted);
    background:rgba(0,0,0,.06);border-radius:10px;padding:1px 7px;
  }
  .icon-btn{
    border:none;background:transparent;color:var(--muted);
    font-size:13px;cursor:pointer;padding:2px 6px;border-radius:6px;
    opacity:0;transition:.15s;line-height:1;
  }
  .list:hover .icon-btn{opacity:1;}
  .icon-btn:hover{background:rgba(0,0,0,.08);color:#d0453a;}

  .cards{
    flex:1;overflow-y:auto;overflow-x:hidden;
    padding:2px 6px 0;min-height:12px;
  }
  .cards::-webkit-scrollbar{width:8px;}
  .cards::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:4px;}

  /* ---------- 卡片 ---------- */
  .card{
    position:relative;overflow:hidden;
    background:var(--card-bg);
    border-radius:10px;
    padding:10px 12px;
    margin-bottom:8px;
    box-shadow:0 1px 2px rgba(0,0,0,.07);
    cursor:grab;
    transition:box-shadow .15s,transform .1s;
  }
  .card:hover{box-shadow:0 3px 10px rgba(0,0,0,.12);}
  .card:active{cursor:grabbing;}
  .card.dragging{opacity:.35;}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;}
  .card.p-high::before{background:#e2574c;}
  .card.p-medium::before{background:#e8a33d;}
  .card.p-low::before{background:#3f9d7c;}

  .card-title{font-size:14px;line-height:1.45;word-break:break-word;}
  .card-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px;}
  .tag{
    font-size:11px;padding:1px 7px;border-radius:6px;
    background:#f0e9df;color:#8a6a4a;
  }
  .card-meta{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:11px;color:var(--muted);}
  .due{display:inline-flex;align-items:center;gap:3px;}
  .due.overdue{color:#d0453a;font-weight:600;}
  .pri{font-size:11px;padding:1px 6px;border-radius:6px;background:rgba(0,0,0,.05);}
  .pri.high{color:#e2574c;}
  .pri.medium{color:#d08a1e;}
  .pri.low{color:#3f9d7c;}

  .card-placeholder{
    border-radius:10px;margin-bottom:8px;
    background:rgba(0,0,0,.05);
    border:1px dashed rgba(0,0,0,.18);
  }

  .add-card-btn{
    margin:6px;padding:8px;border:none;background:transparent;
    color:var(--muted);text-align:left;border-radius:8px;
    cursor:pointer;font-size:13px;font-family:inherit;transition:.15s;
  }
  .add-card-btn:hover{background:rgba(0,0,0,.06);color:var(--text);}

  .composer{padding-bottom:8px;}
  .composer textarea{
    width:100%;height:62px;resize:none;
    border:1px solid var(--accent);border-radius:10px;
    padding:8px 10px;font-size:14px;font-family:inherit;
    outline:none;background:#fff;
    box-shadow:0 0 0 3px rgba(200,102,47,.1);
  }

  /* ---------- 弹窗 ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(30,25,20,.45);
    display:none;align-items:center;justify-content:center;
    z-index:100;padding:20px;
  }
  .overlay.show{display:flex;}
  .modal{
    background:#fff;border-radius:14px;width:100%;max-width:520px;
    padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25);
    max-height:90vh;overflow-y:auto;
    animation:pop .16s ease-out;
  }
  @keyframes pop{from{transform:translateY(8px);opacity:0;}to{transform:none;opacity:1;}}
  .m-title{
    font-size:17px;font-weight:600;margin-bottom:12px;
  }
  .modal textarea{
    width:100%;height:90px;resize:vertical;margin-bottom:14px;
  }
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;}
  .modal input,.modal select,.modal textarea{
    width:100%;border:1px solid var(--border);border-radius:8px;
    padding:8px 10px;font-size:14px;font-family:inherit;color:var(--text);
    background:#fdfcfa;outline:none;transition:.15s;
  }
  .modal input:focus,.modal select:focus,.modal textarea:focus{
    border-color:var(--accent);background:#fff;
    box-shadow:0 0 0 3px rgba(200,102,47,.12);
  }
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .modal-actions{display:flex;gap:8px;margin-top:6px;align-items:center;}
</style>
</head>
<body>

<header>
  <span class="logo">🌰</span>
  <h1>栗子看板</h1>
  <div class="spacer"></div>
  <button class="btn" id="addListBtn">＋ 新建列表</button>
  <button class="btn" id="resetBtn">重置</button>
</header>

<main id="board"></main>

<div class="overlay" id="overlay">
  <div class="modal">
    <input id="mTitle" class="m-title" placeholder="卡片标题">
    <textarea id="mDesc" placeholder="添加更详细的描述…"></textarea>
    <div class="field">
      <label>标签</label>
      <input id="mTags" placeholder="用逗号分隔，如：设计, 紧急">
    </div>
    <div class="grid2">
      <div class="field">
        <label>优先级</label>
        <select id="mPriority">
          <option value="none">无</option>
          <option value="low">低</option>
          <option value="medium">中</option>
          <option value="high">高</option>
        </select>
      </div>
      <div class="field">
        <label>截止日期</label>
        <input type="date" id="mDue">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn danger" id="mDelete">删除</button>
      <div class="spacer"></div>
      <button class="btn" id="mCancel">取消</button>
      <button class="btn primary" id="mSave">保存</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   数据层
   ========================================================= */
const STORAGE_KEY = 'chestnut-kanban-v1';
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s).replace(/[&<>"']/g, c => (
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
));

const PRIORITY = {
  high:   { label: '高', cls: 'high' },
  medium: { label: '中', cls: 'medium' },
  low:    { label: '低', cls: 'low' },
  none:   { label: '',   cls: '' }
};

function defaultData() {
  return {
    lists: [
      {
        id: uid(), title: '待办',
        cards: [
          { id: uid(), title: '欢迎使用栗子看板 🌰', desc: '点击卡片可以编辑详情；按住卡片拖动，可以调整顺序或移到别的列表。', tags: ['入门'], priority: 'high', due: '' },
          { id: uid(), title: '拖动列表顶部标题可以给列表排序', desc: '', tags: [], priority: 'none', due: '' }
        ]
      },
      {
        id: uid(), title: '进行中',
        cards: [
          { id: uid(), title: '做一个看板应用', desc: '纯前端实现，数据保存在浏览器本地。', tags: ['开发'], priority: 'medium', due: '' }
        ]
      },
      { id: uid(), title: '已完成', cards: [] }
    ]
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      if (data && Array.isArray(data.lists)) return data;
    }
  } catch (e) { /* ignore */ }
  return defaultData();
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

let state = loadState();
let drag = null;       // 卡片拖拽状态
let listDrag = null;   // 列表拖拽状态
let editing = null;    // 正在编辑的卡片 { listId, cardId }

/* =========================================================
   DOM 引用
   ========================================================= */
const board    = document.getElementById('board');
const overlay  = document.getElementById('overlay');
const mTitle   = document.getElementById('mTitle');
const mDesc    = document.getElementById('mDesc');
const mTags    = document.getElementById('mTags');
const mPriority= document.getElementById('mPriority');
const mDue     = document.getElementById('mDue');

/* =========================================================
   渲染
   ========================================================= */
function render() {
  if (!state.lists.length) {
    board.innerHTML = '<div class="empty">还没有列表，点右上角「新建列表」开始吧</div>';
    saveState();
    return;
  }
  board.innerHTML = state.lists.map(renderList).join('');
  saveState();
}

function renderList(list) {
  return `
    <div class="list" data-id="${list.id}">
      <div class="list-header" draggable="true">
        <span class="list-title" data-act="rename-list" title="点击重命名">${esc(list.title)}</span>
        <span class="list-count">${list.cards.length}</span>
        <button class="icon-btn" data-act="del-list" title="删除列表">✕</button>
      </div>
      <div class="cards" data-list="${list.id}">
        ${list.cards.map(renderCard).join('')}
      </div>
      <button class="add-card-btn" data-act="add-card">＋ 添加卡片</button>
    </div>
  `;
}

function renderCard(card) {
  const today = new Date().toISOString().slice(0, 10);
  const p = PRIORITY[card.priority] || PRIORITY.none;

  const tags = (card.tags && card.tags.length)
    ? `<div class="card-tags">${card.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>`
    : '';

  const due = card.due
    ? `<span class="due${card.due < today ? ' overdue' : ''}">📅 ${esc(card.due.slice(5))}</span>`
    : '';

  const pri = p.label ? `<span class="pri ${p.cls}">${p.label}</span>` : '';

  const meta = (due || pri) ? `<div class="card-meta">${due}${pri}</div>` : '';
  const pClass = card.priority && card.priority !== 'none' ? ` p-${card.priority}` : '';

  return `
    <div class="card${pClass}" data-id="${card.id}" draggable="true">
      ${tags}
      <div class="card-title">${esc(card.title)}</div>
      ${meta}
    </div>
  `;
}

/* =========================================================
   顶栏操作
   ========================================================= */
document.getElementById('addListBtn').onclick = () => {
  const title = prompt('新列表名称', '新列表');
  if (title === null) return;
  state.lists.push({ id: uid(), title: title.trim() || '新列表', cards: [] });
  render();
};

document.getElementById('resetBtn').onclick = () => {
  if (!confirm('确定清空所有数据并恢复初始状态吗？')) return;
  state = defaultData();
  render();
};

/* =========================================================
   看板点击事件（事件委托）
   ========================================================= */
board.addEventListener('click', (e) => {
  const actEl = e.target.closest('[data-act]');
  if (actEl) {
    const listEl = actEl.closest('.list');
    const listId = listEl && listEl.dataset.id;
    const act = actEl.dataset.act;

    if (act === 'add-card') {
      startAddCard(listEl, listId);
      return;
    }
    if (act === 'del-list') {
      const list = state.lists.find(l => l.id === listId);
      if (list && confirm(`确定删除列表「${list.title}」及其中的 ${list.cards.length} 张卡片？`)) {
        state.lists = state.lists.filter(l => l.id !== listId);
        render();
      }
      return;
    }
    if (act === 'rename-list') {
      const list = state.lists.find(l => l.id === listId);
      if (!list) return;
      const t = prompt('重命名列表', list.title);
      if (t !== null) {
        list.title = t.trim() || list.title;
        render();
      }
      return;
    }
  }

  const cardEl = e.target.closest('.card');
  if (cardEl) openCard(cardEl.dataset.id);
});

/* ---------- 快速添加卡片 ---------- */
function startAddCard(listEl, listId) {
  if (!listEl) return;
  const exist = listEl.querySelector('.composer textarea');
  if (exist) { exist.focus(); return; }

  const cardsEl = listEl.querySelector('.cards');
  const composer = document.createElement('div');
  composer.className = 'composer';
  const ta = document.createElement('textarea');
  ta.placeholder = '输入标题，回车添加（Esc 取消）';
  composer.appendChild(ta);
  cardsEl.appendChild(composer);
  ta.focus();
  cardsEl.scrollTop = cardsEl.scrollHeight;

  const commit = () => {
    const v = ta.value.trim();
    if (!v) { composer.remove(); return; }
    const list = state.lists.find(l => l.id === listId);
    if (!list) return;
    list.cards.push({ id: uid(), title: v, desc: '', tags: [], priority: 'none', due: '' });
    render();
  };

  ta.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); commit(); }
    else if (ev.key === 'Escape') { composer.remove(); }
  });
  ta.addEventListener('blur', () => {
    setTimeout(() => {
      if (composer.isConnected && !ta.value.trim()) composer.remove();
    }, 150);
  });
}

/* =========================================================
   卡片详情弹窗
   ========================================================= */
function openCard(cardId) {
  for (const list of state.lists) {
    const card = list.cards.find(c => c.id === cardId);
    if (!card) continue;
    editing = { listId: list.id, cardId };
    mTitle.value = card.title;
    mDesc.value = card.desc || '';
    mTags.value = (card.tags || []).join(', ');
    mPriority.value = card.priority || 'none';
    mDue.value = card.due || '';
    overlay.classList.add('show');
    setTimeout(() => { mTitle.focus(); mTitle.select(); }, 30);
    return;
  }
}

function closeModal() {
  overlay.classList.remove('show');
  editing = null;
}

document.getElementById('mSave').onclick = () => {
  if (!editing) return closeModal();
  const list = state.lists.find(l => l.id === editing.listId);
  const card = list && list.cards.find(c => c.id === editing.cardId);
  if (!card) return closeModal();

  card.title = mTitle.value.trim() || '未命名卡片';
  card.desc = mDesc.value.trim();
  card.tags = mTags.value.split(/[,，]/).map(s => s.trim()).filter(Boolean);
  card.priority = mPriority.value;
  card.due = mDue.value;

  closeModal();
  render();
};

document.getElementById('mDelete').onclick = () => {
  if (!editing) return;
  if (!confirm('确定删除这张卡片？')) return;
  const list = state.lists.find(l => l.id === editing.listId);
  if (list) list.cards = list.cards.filter(c => c.id !== editing.cardId);
  closeModal();
  render();
};

document.getElementById('mCancel').onclick = closeModal;
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && overlay.classList.contains('show')) closeModal();
});
mTitle.addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('mSave').click();
});

/* =========================================================
   拖拽排序
   ========================================================= */
board.addEventListener('dragstart', (e) => {
  const t = e.target;
  if (!t.classList) return;
  if (t.classList.contains('card')) {
    startCardDrag(e, t);
  } else if (t.classList.contains('list-header')) {
    startListDrag(e, t.closest('.list'));
  }
});

function startCardDrag(e, el) {
  const ph = document.createElement('div');
  ph.className = 'card-placeholder';
  ph.style.height = el.getBoundingClientRect().height + 'px';

  drag = { el, ph };
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', el.dataset.id); } catch (err) {}
  setTimeout(() => el.classList.add('dragging'), 0);
}

function startListDrag(e, listEl) {
  if (!listEl) return;
  const ph = document.createElement('div');
  ph.className = 'list-placeholder';
  ph.style.width = listEl.getBoundingClientRect().width + 'px';
  ph.style.height = listEl.getBoundingClientRect().height + 'px';

  listDrag = { el: listEl, ph };
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', listEl.dataset.id); } catch (err) {}
  setTimeout(() => listEl.classList.add('dragging'), 0);
}

board.addEventListener('dragover', (e) => {
  if (drag) {
    const listEl = e.target.closest && e.target.closest('.list');
    if (!listEl) return;
    const cardsEl = listEl.querySelector('.cards');
    if (!cardsEl) return;

    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';

    const after = getAfterEl(cardsEl, e.clientY, '.card:not(.dragging)');
    if (after) cardsEl.insertBefore(drag.ph, after);
    else cardsEl.appendChild(drag.ph);

  } else if (listDrag) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';

    const after = getAfterListX(e.clientX);
    if (after) board.insertBefore(listDrag.ph, after);
    else board.appendChild(listDrag.ph);
  }
});

board.addEventListener('dragend', () => {
  if (drag) {
    if (drag.ph.isConnected) drag.ph.replaceWith(drag.el);
    drag.el.classList.remove('dragging');
    drag = null;
    syncOrder();
    render();
  } else if (listDrag) {
    if (listDrag.ph.isConnected) listDrag.ph.replaceWith(listDrag.el);
    listDrag.el.classList.remove('dragging');
    listDrag = null;
    syncOrder();
    render();
  }
});

/** 在容器中寻找纵坐标 y 之后最接近的元素（用于插入到它前面） */
function getAfterEl(container, y, selector) {
  const els = [...container.querySelectorAll(selector)];
  let closest = null, closestOffset = -Infinity;
  for (const el of els) {
    const box = el.getBoundingClientRect();
    const offset = y - box.top - box.height / 2;
    if (offset < 0 && offset > closestOffset) {
      closestOffset = offset;
      closest = el;
    }
  }
  return closest;
}

/** 列表横向插入位置 */
function getAfterListX(x) {
  const els = [...board.querySelectorAll('.list:not(.dragging)')];
  let closest = null, closestOffset = -Infinity;
  for (const el of els) {
    const box = el.getBoundingClientRect();
    const offset = x - box.left - box.width / 2;
    if (offset < 0 && offset > closestOffset) {
      closestOffset = offset;
      closest = el;
    }
  }
  return closest;
}

/** 依据 DOM 顺序回写数据（列表顺序 + 卡片顺序 + 跨列表移动） */
function syncOrder() {
  const listEls = [...board.querySelectorAll('.list')];
  const newLists = [];

  for (const le of listEls) {
    const old = state.lists.find(l => l.id === le.dataset.id);
    if (!old) continue;

    const cards = [...le.querySelectorAll('.cards > .card')]
      .map(ce => old.cards.find(c => c.id === ce.dataset.id))
      .filter(Boolean);

    newLists.push({ id: old.id, title: old.title, cards });
  }

  if (newLists.length === state.lists.length) state.lists = newLists;
}

/* =========================================================
   启动
   ========================================================= */
render();
</script>
</body>
</html>
