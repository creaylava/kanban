<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🌰 栗子看板</title>
<style>
  :root{
    --bg:#f5f2ed; --list-bg:#e9e4db; --card-bg:#fff; --text:#2e2a26;
    --muted:#8c8377; --accent:#c8662f; --border:#e2dbd1; --input-bg:#fdfcfa;
    --sub-bg:#f9f6f2; --sub-border:#e8e0d5;
  }
  body.dark {
    --bg:#121212; --list-bg:#1e1e1e; --card-bg:#2d2d2d; --text:#e0e0e0;
    --muted:#9e9e9e; --accent:#e07b39; --border:#444444; --input-bg:#1e1e1e;
    --sub-bg:#222; --sub-border:#3a3a3a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); display:flex; flex-direction:column;
    overflow:hidden; transition: background 0.3s, color 0.3s;
  }
  header{
    display:flex; align-items:center; gap:8px; padding:10px 14px; background:var(--card-bg);
    border-bottom:1px solid var(--border); flex:0 0 auto; z-index:10; flex-wrap: wrap;
    box-shadow:0 2px 5px rgba(0,0,0,.05);
  }
  header h1{font-size:15px; margin:0; font-weight:700;}
  .logo{font-size:20px;}
  .spacer{flex:1;}
  .btn{
    border:1px solid var(--border); background:var(--card-bg); color:var(--text);
    padding:6px 11px; border-radius:8px; font-size:12px; cursor:pointer;
    font-family:inherit; transition:.15s; white-space:nowrap;
  }
  .btn:hover{background:var(--list-bg);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.primary:hover{background:#b35726;}
  .btn.danger{color:#d0453a; border-color:#f0cfcc;}
  .btn.danger:hover{background:#fdf1f0;}
  .btn.small{padding:5px 10px; font-size:12px;}
  .btn.icon{padding:6px 9px; font-size:15px;}

  .board-selector {
    padding:6px 10px; border:1px solid var(--border); border-radius:8px;
    background:var(--input-bg); color:var(--text); font-size:13px; outline:none;
    font-family:inherit; font-weight:600; max-width:140px;
  }
  #breadcrumb {
    display: flex; align-items: center; gap: 8px; padding: 8px 20px;
    background: var(--bg); font-size: 13px; color: var(--muted);
    border-bottom: 1px solid var(--border); display: none;
  }
  #breadcrumb.show { display: flex; }
  #breadcrumb span { cursor: pointer; }
  #breadcrumb span:hover { color: var(--accent); text-decoration: underline; }
  #breadcrumb .current { color: var(--text); font-weight: 600; cursor: default; }
  #breadcrumb .arrow { color: var(--muted); cursor: default; }

  #board{
    flex:1; display:flex; gap:14px; padding:18px 20px 24px;
    overflow-x:auto; overflow-y:hidden; align-items:flex-start;
  }
  .empty{margin:auto; color:var(--muted); font-size:14px;}
  .list{
    flex:0 0 280px; width:280px; background:var(--list-bg);
    border-radius:12px; display:flex; flex-direction:column; max-height:100%; padding:4px;
  }
  .list-header{display:flex; align-items:center; gap:6px; padding:8px 10px;}
  .list-title{
    font-weight:600; font-size:14px; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    border-radius:6px; padding:4px 6px; margin:-2px -4px; cursor: pointer; transition: background 0.15s;
  }
  .list-title:hover{background:rgba(0,0,0,.08);}
  .list-title::after {content: '✎'; font-size: 11px; color: var(--muted); margin-left: 6px; opacity: 0.4;}
  .list-title:hover::after { opacity: 0.9; }
  .list-count{font-size:12px; color:var(--muted); background:rgba(0,0,0,.06); border-radius:10px; padding:1px 7px; flex-shrink: 0;}
  .icon-btn{border:none; background:transparent; color:var(--muted); font-size:15px; cursor:pointer; padding:4px 6px; border-radius:6px; line-height:1; flex-shrink: 0; transition:.15s;}
  .icon-btn:hover{background:rgba(208,69,58,.15); color:#d0453a;}
  .cards{flex:1; overflow-y:auto; overflow-x:hidden; padding:2px 6px 0; min-height:12px;}
  .cards::-webkit-scrollbar{width:8px;}
  .cards::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15); border-radius:4px;}
  .card{
    position:relative; overflow:hidden; background:var(--card-bg); border-radius:10px;
    padding:10px 12px 32px 12px; margin-bottom:8px; box-shadow:0 1px 2px rgba(0,0,0,.07);
    cursor:pointer; -webkit-touch-callout: none; user-select: none;
    display: flex; flex-direction: column;
  }
  .card:hover{box-shadow:0 3px 10px rgba(0,0,0,.12);}
  .card::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:transparent;}
  .card.p-high::before{background:#e2574c;}
  .card.p-medium::before{background:#e8a33d;}
  .card.p-low::before{background:#3f9d7c;}
  .card-title{font-size:14px; line-height:1.45; word-break:break-word;}
  .card-tags{display:flex; flex-wrap:wrap; gap:4px; margin-bottom:6px;}
  .tag{font-size:11px; padding:1px 7px; border-radius:6px; background:rgba(0,0,0,.05); color:var(--muted);}
  .card-meta{display:flex; align-items:center; gap:8px; margin-top:7px; font-size:11px; color:var(--muted); flex-wrap: wrap;}
  .due.overdue{color:#d0453a; font-weight:600;}
  .pri{font-size:11px; padding:1px 6px; border-radius:6px; background:rgba(0,0,0,.05);}
  .pri.high{color:#e2574c;} .pri.medium{color:#d08a1e;} .pri.low{color:#3f9d7c;}
  .card-indicators {display: flex; gap: 8px; margin-top: 6px; font-size: 11px; color: var(--muted); align-items: center; flex-wrap: wrap;}
  .indicator { display: inline-flex; align-items: center; gap: 3px; }
  .indicator.checked { color: var(--accent); }
  .card-footer {position: absolute; bottom: 6px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: center;}
  .footer-left, .footer-right { display: flex; gap: 5px; }
  .action-btn {background: rgba(100,100,100,.08); color: var(--muted); border: none; font-size: 13px; padding: 3px 8px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: .15s;}
  .action-btn:hover { background: var(--accent); color: #fff; }
  .quick-move-btn {background: rgba(200,102,47,.1); color: var(--accent); border: none; font-size: 13px; padding: 3px 8px; border-radius: 6px; cursor: pointer; font-weight: bold;}
  .quick-move-btn:hover { background: var(--accent); color: #fff; }
  .expand-sub-btn {background: rgba(100,100,100,.08); color: var(--muted); border: none; font-size: 12px; padding: 3px 8px; border-radius: 6px; cursor: pointer;}
  .expand-sub-btn:hover, .expand-sub-btn.expanded { background: var(--accent); color: #fff; }
  .preview-sub-btn {background: rgba(59,130,246,.1); color: #3b82f6; border: none; font-size: 12px; padding: 3px 8px; border-radius: 6px; cursor: pointer; font-weight: bold;}
  .preview-sub-btn:hover { background: #3b82f6; color: #fff; }
  .sub-board-preview {margin-top: 10px; padding: 10px; background: var(--sub-bg); border-radius: 8px; border: 1px solid var(--sub-border);}
  .sub-board-preview .sub-list-title {font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px;}
  .sub-board-preview .sub-card-item {font-size: 13px; padding: 5px 8px; background: var(--card-bg); border-radius: 6px; margin-bottom: 4px; border: 1px solid var(--border); cursor: pointer;}
  .sub-board-preview .sub-card-item:hover { border-color: var(--accent); color: var(--accent); }
  .sub-board-preview .empty-sub {font-size: 12px; color: var(--muted); font-style: italic;}

  /* ★ 列表底部的按钮组 */
  .list-bottom-actions {
    display: flex; gap: 4px; margin: 6px; align-items: center;
  }
  .add-card-btn{
    flex: 1; padding:8px; border:none; background:transparent; color:var(--muted); text-align:left; border-radius:8px;
    cursor:pointer; font-size:13px; font-family: inherit;
  }
  .add-card-btn:hover{background:rgba(0,0,0,.06); color:var(--text);}
  .add-template-btn {
    padding: 6px 10px; border: none; background: rgba(59,130,246,.1); color: #3b82f6;
    border-radius: 8px; cursor: pointer; font-size: 13px; font-family: inherit;
    white-space: nowrap;
  }
  .add-template-btn:hover { background: #3b82f6; color: #fff; }

  .composer{padding-bottom:8px;}
  .composer textarea{width:100%; height:62px; resize:none; border:1px solid var(--accent); border-radius:10px; padding:8px 10px; font-size:14px; font-family:inherit; outline:none; background:var(--card-bg); color:var(--text);}
  .add-list-btn {flex:0 0 100px; width:100px; height:48px; border:2px dashed var(--border); background:transparent; border-radius:12px; color:var(--muted); cursor:pointer; font-size:13px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:4px; margin-top:4px;}
  .add-list-btn:hover {border-color: var(--accent); color: var(--accent);}

  .overlay{position:fixed; inset:0; background:rgba(30,25,20,.45); display:none; align-items:center; justify-content:center; z-index:100; padding:20px;}
  .overlay.show{display:flex;}
  .modal{background:var(--card-bg); border-radius:14px; width:100%; max-width:540px; padding:20px; box-shadow:0 20px 60px rgba(0,0,0,.25); max-height:90vh; overflow-y:auto;}
  .m-title{font-size:17px; font-weight:600; margin-bottom:14px;}
  .modal textarea{width:100%; height:80px; resize:vertical; margin-bottom:14px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px;}
  .modal input, .modal select, .modal textarea {width:100%; border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:14px; font-family:inherit; color:var(--text); background:var(--input-bg); outline:none;}
  .modal input:focus, .modal select:focus, .modal textarea:focus {border-color:var(--accent); background:var(--card-bg);}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .modal-actions{display:flex; gap:8px; margin-top:10px; align-items:center;}

  .checklist-container {border: 1px solid var(--border); border-radius: 8px; padding: 8px; background: var(--input-bg); max-height: 150px; overflow-y: auto; margin-bottom: 5px;}
  .checklist-item {display: flex; align-items: center; gap: 6px; margin-bottom: 6px;}
  .checklist-item input[type="checkbox"] {width: 16px; height: 16px; flex-shrink: 0; cursor: pointer; accent-color: var(--accent);}
  .checklist-item input[type="text"] {flex: 1; padding: 4px 6px; font-size: 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text);}
  .checklist-item .remove-item {color: #d0453a; background: none; border: none; font-size: 16px; cursor: pointer; padding: 0 4px; flex-shrink: 0;}

  .attachment-actions {display: flex; gap: 6px; margin-bottom: 6px;}
  .attachments-container {border: 1px solid var(--border); border-radius: 8px; padding: 8px; background: var(--input-bg); max-height: 260px; overflow-y: auto;}
  .attachment-item {display: flex; align-items: center; gap: 6px; padding: 6px 8px; margin-bottom: 6px; background: var(--card-bg); border-radius: 6px; border: 1px solid var(--border);}
  .attachment-item .file-icon {font-size: 20px; flex-shrink: 0; width: 24px; text-align: center;}
  .attachment-item .file-info {flex: 1; min-width: 0;}
  .attachment-item .file-name {font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}
  .attachment-item .file-size {font-size: 10px; color: var(--muted); margin-top: 2px;}
  .attachment-item .file-size.link-tag {color: var(--accent);}
  .attachment-item .file-actions {display: flex; gap: 2px; flex-shrink: 0;}
  .attachment-item .file-actions button {background: rgba(100,100,100,.08); color: var(--muted); border: none; font-size: 13px; padding: 3px 7px; border-radius: 5px; cursor: pointer;}
  .attachment-item .file-actions button:hover {background: var(--accent); color: #fff;}
  .attachment-item .file-actions button.remove-btn:hover {background: #d0453a; color: #fff;}
  .attachment-item .file-thumb {width: 36px; height: 36px; border-radius: 5px; object-fit: cover; flex-shrink: 0; border: 1px solid var(--border); cursor: pointer;}
  .attachment-empty {font-size: 12px; color: var(--muted); font-style: italic; text-align: center; padding: 8px;}
  .attachment-hint {font-size: 10px; color: var(--muted); margin-top: 6px; line-height: 1.5;}

  #addLinkOverlay {align-items: center; padding: 20px; z-index: 150;}
  #addLinkModal {background: var(--card-bg); border-radius: 14px; width: 100%; max-width: 420px; padding: 20px;}
  #addLinkModal h3 {font-size: 16px; margin-bottom: 15px; text-align: center;}
  #addLinkModal .field {margin-bottom: 12px;}
  #addLinkModal .field label {display:block; font-size: 11px; color: var(--muted); margin-bottom: 4px;}
  #addLinkModal input {width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 14px; background: var(--input-bg); color: var(--text);}

  #quickMoveOverlay {align-items: flex-end; padding: 0;}
  #quickMoveMenu {background: var(--card-bg); width: 100%; border-radius: 16px 16px 0 0; padding: 20px; box-shadow: 0 -5px 20px rgba(0,0,0,.2); max-height: 70vh; overflow-y: auto;}
  #quickMoveMenu h3 {font-size: 16px; margin-bottom: 15px; text-align: center; color: var(--muted);}
  .move-option {display: block; width: 100%; padding: 12px; margin-bottom: 8px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 10px; font-size: 15px; cursor: pointer; text-align: center;}
  .move-option:hover {background: var(--accent); color: #fff; border-color: var(--accent);}
  .move-option:disabled {opacity: 0.4; cursor: not-allowed;}

  #renameListOverlay {align-items: center; padding: 20px;}
  #renameListModal {background: var(--card-bg); border-radius: 14px; width: 100%; max-width: 380px; padding: 20px;}
  #renameListModal h3 {font-size: 16px; margin-bottom: 15px; text-align: center;}
  #renameListModal input {width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 15px; background: var(--input-bg); color: var(--text); margin-bottom: 15px;}
  .rename-actions {display: flex; gap: 10px;}

  /* ★ 模板选择弹窗 */
  #templateOverlay {background: rgba(30,25,20,.55); align-items: center; justify-content: center; z-index: 190; padding: 20px;}
  #templateModal {
    background: var(--card-bg); border-radius: 16px; width: 100%; max-width: 480px;
    box-shadow: 0 30px 80px rgba(0,0,0,.4); max-height: 85vh;
    display: flex; flex-direction: column; overflow: hidden;
  }
  #templateHeader {
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  #templateHeader h2 {font-size: 16px; font-weight: 700; flex: 1;}
  #templateHeader .template-close {background: none; border: none; font-size: 22px; color: var(--muted); cursor: pointer; padding: 0 4px; line-height: 1;}
  #templateBody {flex: 1; overflow-y: auto; padding: 12px 16px 16px;}
  .template-item {
    padding: 10px 12px; margin-bottom: 8px;
    background: var(--sub-bg); border: 1px solid var(--sub-border);
    border-radius: 8px; cursor: pointer; transition: .15s;
    display: flex; align-items: center; gap: 10px;
  }
  .template-item:hover {border-color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,.08);}
  .template-item .tpl-icon {font-size: 22px; flex-shrink: 0;}
  .template-item .tpl-info {flex: 1; min-width: 0;}
  .template-item .tpl-name {font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}
  .template-item .tpl-meta {font-size: 11px; color: var(--muted); margin-top: 2px;}
  .template-item .tpl-del {
    background: rgba(208,69,58,.1); color: #d0453a; border: none;
    width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 14px;
    flex-shrink: 0;
  }
  .template-item .tpl-del:hover {background: #d0453a; color: #fff;}
  .template-empty {
    text-align: center; padding: 40px 20px; color: var(--muted); font-size: 13px; line-height: 2;
  }

  /* 附件预览弹窗 */
  #previewOverlay {background: rgba(0,0,0,.92); align-items: center; justify-content: center; z-index: 220; padding: 0;}
  #previewOverlay .preview-toolbar {position: absolute; top: 0; left: 0; right: 0; padding: 10px 16px; display: flex; align-items: center; gap: 10px; color: #fff; font-size: 13px; z-index: 2; background: linear-gradient(to bottom, rgba(0,0,0,.7), transparent);}
  #previewOverlay .preview-title {flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600;}
  #previewOverlay .preview-btn {background: rgba(255,255,255,.15); color: #fff; border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center;}
  #previewOverlay .preview-btn:hover {background: rgba(255,255,255,.3);}
  #previewContent {width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;}
  #previewContent iframe {width: 100%; height: 100%; background: #fff; border: none;}
  #previewContent img {max-width: 95%; max-height: 90vh; object-fit: contain;}
  #previewContent .preview-loading {color: #fff; font-size: 14px;}

  /* 子看板预览弹窗 */
  #subPreviewOverlay {background: rgba(30,25,20,.55); align-items: center; justify-content: center; z-index: 180; padding: 20px;}
  #subPreviewModal {
    background: var(--card-bg); border-radius: 16px; width: 100%; max-width: 640px;
    box-shadow: 0 30px 80px rgba(0,0,0,.4); max-height: 85vh;
    display: flex; flex-direction: column; overflow: hidden;
  }
  #subPreviewHeader {
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  #subPreviewHeader h2 {
    font-size: 16px; font-weight: 700; flex: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #subPreviewHeader .sub-preview-close {
    background: none; border: none; font-size: 22px; color: var(--muted);
    cursor: pointer; padding: 0 4px; line-height: 1;
  }
  #subPreviewHeader .sub-preview-close:hover { color: var(--text); }
  #subPreviewBody {
    flex: 1; overflow-y: auto; padding: 12px 16px 20px;
  }
  .sub-preview-list {
    margin-bottom: 16px;
  }
  .sub-preview-list-title {
    font-size: 13px; font-weight: 700; color: var(--text);
    padding: 6px 0; display: flex; align-items: center; gap: 6px;
  }
  .sub-preview-list-count {
    font-size: 11px; color: var(--muted); background: rgba(0,0,0,.06);
    padding: 1px 7px; border-radius: 10px; font-weight: 600;
  }
  body.dark .sub-preview-list-count { background: rgba(255,255,255,.1); }
  .sub-preview-card {
    padding: 10px 12px; margin-bottom: 8px;
    background: var(--sub-bg); border: 1px solid var(--sub-border);
    border-radius: 8px; cursor: pointer; transition: .15s;
  }
  .sub-preview-card:hover {
    border-color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,.08);
  }
  .sub-preview-card-title {
    font-size: 13px; font-weight: 600; margin-bottom: 4px;
    display: flex; align-items: center; gap: 6px;
  }
  .sub-preview-card-title .priority-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }
  .priority-dot.high { background: #e2574c; }
  .priority-dot.medium { background: #e8a33d; }
  .priority-dot.low { background: #3f9d7c; }
  .sub-preview-card-desc {
    font-size: 11px; color: var(--muted); margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sub-preview-card-meta {
    display: flex; gap: 10px; margin-top: 6px;
    font-size: 10px; color: var(--muted); flex-wrap: wrap;
  }
  .sub-preview-empty {
    font-size: 12px; color: var(--muted); font-style: italic;
    text-align: center; padding: 30px 10px;
  }
  .sub-preview-nested {
    margin-top: 6px; padding-left: 12px; border-left: 2px solid var(--sub-border);
    font-size: 11px; color: var(--muted);
  }

  /* 卡片详情预览弹窗 */
  #cardPreviewOverlay {background: rgba(30,25,20,.6); align-items: center; justify-content: center; z-index: 195; padding: 20px;}
  #cardPreviewModal {
    background: var(--card-bg); border-radius: 16px; width: 100%; max-width: 520px;
    box-shadow: 0 30px 80px rgba(0,0,0,.45); max-height: 85vh;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .card-preview-header {
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  .card-preview-header h2 {
    font-size: 16px; font-weight: 700; flex: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .card-preview-close {
    background: none; border: none; font-size: 22px; color: var(--muted);
    cursor: pointer; padding: 0 4px; line-height: 1;
  }
  .card-preview-close:hover { color: var(--text); }
  #cardPreviewBody {flex: 1; overflow-y: auto; padding: 16px 20px 20px;}

  .card-preview-tags {display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px;}
  .card-preview-meta {display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-bottom: 12px; align-items: center;}
  .card-preview-desc {
    font-size: 13px; line-height: 1.6; color: var(--text);
    padding: 10px 12px; background: var(--sub-bg); border-radius: 8px;
    border: 1px solid var(--sub-border); margin-bottom: 14px;
    white-space: pre-wrap; word-break: break-word;
  }
  .card-preview-section-title {

<script>
/* =========================================================
   IndexedDB
   ========================================================= */
const DB_NAME = 'kanban_db_v2';
const DB_VERSION = 1;
const STATE_STORE = 'state';
const STATE_KEY = 'main';
const MAX_FILE_SIZE = 500 * 1024;

let stateDB = null;
function openStateDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(STATE_STORE)) d.createObjectStore(STATE_STORE);
    };
    req.onsuccess = (e) => { stateDB = e.target.result; resolve(); };
    req.onerror = reject;
  });
}
function loadStateFromDB() {
  return new Promise((resolve, reject) => {
    const req = stateDB.transaction(STATE_STORE, 'readonly').objectStore(STATE_STORE).get(STATE_KEY);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = reject;
  });
}
function saveStateToDB(data) {
  return new Promise((resolve, reject) => {
    const tx = stateDB.transaction(STATE_STORE, 'readwrite');
    tx.objectStore(STATE_STORE).put(data, STATE_KEY);
    tx.oncomplete = resolve; tx.onerror = reject;
  });
}
function clearStateDB() {
  return new Promise((resolve, reject) => {
    const tx = stateDB.transaction(STATE_STORE, 'readwrite');
    tx.objectStore(STATE_STORE).clear();
    tx.oncomplete = resolve; tx.onerror = reject;
  });
}

/* =========================================================
   工具
   ========================================================= */
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function formatFileSize(bytes) {
  if (!bytes) return '0 B';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1024/1024).toFixed(2) + ' MB';
}
function getFileIcon(name, type) {
  const ext = (name || '').split('.').pop().toLowerCase();
  if (type && type.startsWith('image/')) return '🖼';
  if (type && type.startsWith('video/')) return '🎬';
  if (type && type.startsWith('audio/')) return '🎵';
  if (ext === 'html' || ext === 'htm' || ext === 'eml' || ext === 'msg') return '📧';
  if (ext === 'pdf') return '📕';
  if (['doc','docx'].includes(ext)) return '📘';
  if (['xls','xlsx','csv'].includes(ext)) return '📗';
  if (['ppt','pptx'].includes(ext)) return '📙';
  if (['zip','rar','7z'].includes(ext)) return '🗜';
  if (['dwg','dxf','step','stp','igs','iges','sldprt','sldasm'].includes(ext)) return '📐';
  return '📄';
}
function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
function dataURLToBlob(dataURL) {
  const parts = dataURL.split(',');
  const mimeMatch = parts[0].match(/:(.*?);/);
  const mime = mimeMatch ? mimeMatch[1] : 'application/octet-stream';
  const bstr = atob(parts[1]);
  let n = bstr.length;
  const u8 = new Uint8Array(n);
  while (n--) u8[n] = bstr.charCodeAt(n);
  return new Blob([u8], { type: mime });
}
function showLoading(text) {
  document.getElementById('loadingText').textContent = text || '处理中...';
  document.getElementById('loadingOverlay').classList.add('show');
}
function hideLoading() { document.getElementById('loadingOverlay').classList.remove('show'); }

/* =========================================================
   ★ 深度克隆卡片（重新生成所有 ID）
   ========================================================= */
function cloneCard(card) {
  const copy = JSON.parse(JSON.stringify(card));
  regenerateIds(copy);
  return copy;
}
function regenerateIds(item) {
  if (!item) return;
  item.id = uid();
  if (item.checklist) item.checklist.forEach(c => c.id = uid());
  if (item.attachments) item.attachments.forEach(a => a.id = uid());
  if (item.subBoard && item.subBoard.lists) {
    item.subBoard.lists.forEach(list => {
      list.id = uid();
      if (list.cards) list.cards.forEach(c => regenerateIds(c));
    });
  }
}

/* =========================================================
   数据
   ========================================================= */
const PRIORITY = {
  high:   { label: '高', cls: 'high' },
  medium: { label: '中', cls: 'medium' },
  low:    { label: '低', cls: 'low' },
  none:   { label: '',   cls: '' }
};

function defaultData() {
  const board = {
    id: uid(), name: '我的看板',
    lists: [
      { id: uid(), title: '待办', cards: [
        { id: uid(), title: '欢迎使用栗子看板 🌰', desc: '点击卡片可以编辑详情。', tags: ['入门'], priority: 'high', due: '', checklist: [], attachments: [], subBoard: null, isExpanded: false }
      ] },
      { id: uid(), title: '进行中', cards: [] },
      { id: uid(), title: '已完成', cards: [] }
    ]
  };
  return { boards: [board], currentBoardId: board.id, templates: [] };
}

let state = null;
let boardStack = [];
let editing = null;
let renamingListId = null;
let editingChecklist = [];
let editingAttachments = [];
let currentPreviewURL = null;
let previewingCardId = null;
let templateTargetListId = null;  // 从哪个列表打开的模板选择

function getCurrentBoard() {
  let b = state.boards.find(b => b.id === state.currentBoardId);
  if (!b) { b = state.boards[0]; if (b) state.currentBoardId = b.id; }
  return b;
}
function syncBoardStack() {
  const b = getCurrentBoard();
  boardStack = [{ lists: b.lists, title: b.name }];
}
async function saveState() {
  try { await saveStateToDB(state); } catch (e) { console.error(e); }
  if (autoSyncEnabled) schedulePush();
}

/* =========================================================
   GitHub 同步
   ========================================================= */
const GH_TOKEN_KEY = 'chestnut-kanban-gh-token';
const GH_GIST_KEY = 'chestnut-kanban-gh-gist';
const AUTO_SYNC_KEY = 'chestnut-kanban-auto-sync';
const MAX_SYNC_SIZE = 900 * 1024;

let ghToken = localStorage.getItem(GH_TOKEN_KEY) || '';
let ghGistId = localStorage.getItem(GH_GIST_KEY) || '';
let autoSyncEnabled = localStorage.getItem(AUTO_SYNC_KEY) === '1';
let _isPushing = false;
let _pushTimer = null;
let _lastSyncTime = null;

function setSyncStatus(msg, type) {
  const box = document.getElementById('syncStatusBox');
  if (!box) return;
  box.textContent = msg;
  box.className = 'sync-status ' + (type || '');
}
function schedulePush() {
  if (_pushTimer) clearTimeout(_pushTimer);
  _pushTimer = setTimeout(() => pushToCloud({ silent: true }), 3000);
}
async function ghFetchGist() {
  const res = await fetch(`https://api.github.com/gists/${ghGistId}`, {
    headers: { 'Authorization': `token ${ghToken}`, 'Accept': 'application/vnd.github+json' }
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}: ${(await res.text()).slice(0, 150)}`);
  return res.json();
}
async function ghUpdateGist(content) {
  const res = await fetch(`https://api.github.com/gists/${ghGistId}`, {
    method: 'PATCH',
    headers: {
      'Authorization': `token ${ghToken}`,
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ files: { 'kanban.json': { content } } })
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}: ${(await res.text()).slice(0, 150)}`);
  return res.json();
}
async function testConnection() {
  if (!ghToken || !ghGistId) { setSyncStatus('❌ 请先填写 Token 和 Gist ID', 'err'); return false; }
  try {
    setSyncStatus('🔌 正在测试连接...', 'info');
    const gist = await ghFetchGist();
    const file = gist.files && gist.files['kanban.json'];
    if (!file) { setSyncStatus('⚠️ 连接成功，但 Gist 里没有 kanban.json 文件', 'info'); return false; }
    setSyncStatus(`✅ 连接成功！\n文件大小：${file.size} 字节\n最后更新：${new Date(gist.updated_at).toLocaleString()}`, 'ok');
    return true;
  } catch (e) {
    setSyncStatus('❌ 连接失败：' + e.message, 'err');
    return false;
  }
}
async function pushToCloud(opts = {}) {
  if (!ghToken || !ghGistId) {
    if (!opts.silent) setSyncStatus('❌ 请先填写 Token 和 Gist ID', 'err');
    return;
  }
  try {
    _isPushing = true;
    setSyncStatus('⏫ 上传中...', 'info');
    const content = JSON.stringify(state);
    const sizeKB = (new Blob([content]).size / 1024).toFixed(1);
    if (new Blob([content]).size > MAX_SYNC_SIZE) {
      setSyncStatus(`❌ 数据太大（${sizeKB} KB），超过 900KB 限制。`, 'err');
      if (!opts.silent) alert('数据过大，无法上传。');
      _isPushing = false;
      return;
    }
    await ghUpdateGist(content);
    _lastSyncTime = new Date();
    setSyncStatus(`✅ 已上传（${sizeKB} KB，${_lastSyncTime.toLocaleTimeString()}）`, 'ok');
  } catch (e) {
    console.error(e);
    setSyncStatus('❌ 上传失败：' + e.message, 'err');
    if (!opts.silent) alert('上传失败：' + e.message);
  } finally {
    setTimeout(() => { _isPushing = false; }, 500);
  }
}
async function pullFromCloud(opts = {}) {
  if (!ghToken || !ghGistId) {
    if (!opts.silent) setSyncStatus('❌ 请先填写 Token 和 Gist ID', 'err');
    return;
  }
  try {
    setSyncStatus('⏬ 拉取中...', 'info');
    const gist = await ghFetchGist();
    const file = gist.files && gist.files['kanban.json'];
    if (!file) { setSyncStatus('⚠️ Gist 里没有 kanban.json', 'err'); return; }
    const raw = file.content || '';
    if (!raw.trim() || raw.trim() === '{}') {
      setSyncStatus('ℹ️ 云端为空，请先点「推送」上传。', 'info');
      return;
    }
    const cloudData = JSON.parse(raw);
    if (!cloudData.boards || !Array.isArray(cloudData.boards)) throw new Error('云端数据格式不对');
    _isPushing = true;
    state = cloudData;
    if (!state.templates) state.templates = [];
    if (!state.currentBoardId || !state.boards.some(b => b.id === state.currentBoardId)) {
      state.currentBoardId = state.boards[0].id;
    }
    state.boards.forEach(b => b.lists.forEach(l => l.cards.forEach(c => {
      if (!c.checklist) c.checklist = [];
      if (!c.attachments) c.attachments = [];
      c.attachments.forEach(a => { if (!a.kind) a.kind = (a.url && !a.data) ? 'link' : 'file'; });
    })));
    await saveStateToDB(state);
    syncBoardStack();
    renderBoardSelect();
    render();
    setTimeout(() => { _isPushing = false; }, 500);
    _lastSyncTime = new Date();
    setSyncStatus(`✅ 已拉取（${_lastSyncTime.toLocaleTimeString()}）`, 'ok');
  } catch (e) {
    console.error(e);
    setSyncStatus('❌ 拉取失败：' + e.message, 'err');
    if (!opts.silent) alert('拉取失败：' + e.message);
  }
}

function renderCard(card) {
  const today = new Date().toISOString().slice(0,10);
  const p = PRIORITY[card.priority] || PRIORITY.none;
  const tags = (card.tags||[]).length ? `<div class="card-tags">${card.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>` : '';
  const due = card.due ? `<span class="due${card.due<today?' overdue':''}">📅 ${esc(card.due.slice(5))}</span>` : '';
  const pri = p.label ? `<span class="pri ${p.cls}">${p.label}</span>` : '';
  
  let ci = '';
  if ((card.checklist||[]).length > 0) {
    const done = card.checklist.filter(c => c.done).length;
    const allDone = done === card.checklist.length;
    ci = `<span class="indicator ${allDone?'checked':''}">☑ ${done}/${card.checklist.length}</span>`;
  }
  let ai = '';
  const atts = card.attachments || [];
  if (atts.length > 0) {
    const files = atts.filter(a => a.kind === 'file');
    const links = atts.filter(a => a.kind === 'link');
    const parts = [];
    if (files.length > 0) parts.push(`📎 ${files.length}`);
    if (links.length > 0) parts.push(`🔗 ${links.length}`);
    ai = `<span class="indicator">${parts.join(' ')}</span>`;
  }
  
  const meta = (due || pri) ? `<div class="card-meta">${due}${pri}</div>` : '';
  const inds = (ci || ai) ? `<div class="card-indicators">${ci}${ai}</div>` : '';
  const pClass = card.priority && card.priority !== 'none' ? ` p-${card.priority}` : '';
  
  let sbHtml = '';
  if (card.subBoard) {
    const exp = card.isExpanded || false;
    const total = card.subBoard.lists.reduce((s,l) => s+l.cards.length, 0);
    let content = '';
    if (exp) {
      if (total === 0) content = '<div class="empty-sub">子看板为空</div>';
      else card.subBoard.lists.forEach(l => {
        content += `<div class="sub-list-title">📁 ${esc(l.title)} (${l.cards.length})</div>`;
        l.cards.forEach(c => {
          content += `<div class="sub-card-item" data-sub-card-id="${c.id}" data-sub-list-id="${l.id}">${esc(c.title)} <span style="color:var(--muted);font-size:11px;">›</span></div>`;
        });
      });
    }
    sbHtml = `<div class="sub-board-preview" style="display:${exp?'block':'none'};">${content}</div>`;
  }
  const sbBtn = card.subBoard
    ? `<button class="expand-sub-btn ${card.isExpanded?'expanded':''}" data-act="toggle-sub" data-card-id="${card.id}">${card.isExpanded?'[-] 收起':'[+] 子看板'}</button>`
    : '';
  const previewBtn = card.subBoard
    ? `<button class="preview-sub-btn" data-act="preview-sub" data-card-id="${card.id}" title="预览子看板内容">👁</button>`
    : '';
  
  return `
    <div class="card${pClass}" data-id="${card.id}">
      <div class="card-main">
        ${tags}
        <div class="card-title">${esc(card.title)}</div>
        ${meta}
        ${inds}
      </div>
      ${sbHtml}
      <div class="card-footer">
        <div class="footer-left">
          <button class="action-btn" data-act="move-up" data-card-id="${card.id}">↑</button>
          <button class="action-btn" data-act="move-down" data-card-id="${card.id}">↓</button>
        </div>
        <div class="footer-right">
          <button class="quick-move-btn" data-act="quick-move" data-card-id="${card.id}">⇄ 移动</button>
          ${previewBtn}
          ${sbBtn}
        </div>
      </div>
    </div>
  `;
}

function moveCardPriority(cardId, dir) {
  const cb = boardStack[boardStack.length - 1];
  for (const l of cb.lists) {
    const i = l.cards.findIndex(c => c.id === cardId);
    if (i !== -1) {
      const t = i + dir;
      if (t >= 0 && t < l.cards.length) {
        [l.cards[i], l.cards[t]] = [l.cards[t], l.cards[i]];
        render(); saveState();
      }
      return;
    }
  }
}
function openQuickMoveMenu(cardId) {
  const cb = boardStack[boardStack.length - 1];
  quickMoveList.innerHTML = '';
  let curId = '';
  cb.lists.forEach(l => { if (l.cards.some(c => c.id === cardId)) curId = l.id; });
  cb.lists.forEach(l => {
    const btn = document.createElement('button');
    btn.className = 'move-option';
    btn.textContent = l.title;
    if (l.id === curId) { btn.textContent += ' (当前)'; btn.disabled = true; }
    btn.onclick = () => { moveCard(cardId, l.id); quickMoveOverlay.classList.remove('show'); };
    quickMoveList.appendChild(btn);
  });
  quickMoveOverlay.classList.add('show');
}
function moveCard(cardId, targetListId) {
  const cb = boardStack[boardStack.length - 1];
  let card = null, src = null;
  for (const l of cb.lists) {
    const i = l.cards.findIndex(c => c.id === cardId);
    if (i !== -1) { src = l; card = l.cards.splice(i, 1)[0]; break; }
  }
  if (card && src && src.id !== targetListId) {
    const tl = cb.lists.find(l => l.id === targetListId);
    if (tl) tl.cards.push(card); else src.cards.push(card);
  }
  render(); saveState();
}
document.getElementById('quickMoveCancel').onclick = () => quickMoveOverlay.classList.remove('show');

const subPreviewOverlay = document.getElementById('subPreviewOverlay');
const subPreviewBody = document.getElementById('subPreviewBody');
const subPreviewTitle = document.getElementById('subPreviewTitle');

let _subPreviewCards = [];

function findCardById(cardId) {
  const cb = boardStack[boardStack.length - 1];
  for (const l of cb.lists) {
    const c = l.cards.find(x => x.id === cardId);
    if (c) return c;
  }
  return null;
}

function openSubPreview(cardId) {
  const card = findCardById(cardId);
  if (!card || !card.subBoard) return;
  previewingCardId = cardId;
  subPreviewTitle.textContent = card.title;
  _subPreviewCards = [];
  card.subBoard.lists.forEach(list => {
    list.cards.forEach(c => _subPreviewCards.push(c));
  });
  subPreviewBody.innerHTML = renderSubPreviewContent(card.subBoard.lists);
  subPreviewOverlay.classList.add('show');
}

function renderSubPreviewContent(lists) {
  if (!lists || lists.length === 0) {
    return '<div class="sub-preview-empty">子看板为空</div>';
  }
  let totalCards = lists.reduce((s, l) => s + l.cards.length, 0);
  if (totalCards === 0) {
    return '<div class="sub-preview-empty">子看板里还没有卡片</div>';
  }
  let html = '';
  lists.forEach(list => {
    html += `<div class="sub-preview-list">`;
    html += `<div class="sub-preview-list-title">📁 ${esc(list.title)} <span class="sub-preview-list-count">${list.cards.length}</span></div>`;
    if (list.cards.length === 0) {
      html += `<div style="font-size:11px;color:var(--muted);padding:4px 0;">（空）</div>`;
    } else {
      list.cards.forEach(card => {
        const pClass = card.priority && card.priority !== 'none' ? card.priority : '';
        const done = (card.checklist || []).filter(c => c.done).length;
        const total = (card.checklist || []).length;
        const atts = card.attachments || [];
        const files = atts.filter(a => a.kind === 'file').length;
        const links = atts.filter(a => a.kind === 'link').length;
        
        const metaParts = [];
        if (card.owner) metaParts.push(`👤 ${esc(card.owner)}`);
        if (total > 0) metaParts.push(`☑ ${done}/${total}`);
        if (files > 0) metaParts.push(`📎 ${files}`);
        if (links > 0) metaParts.push(`🔗 ${links}`);
        if (card.due) metaParts.push(`📅 ${card.due}`);
        
        html += `<div class="sub-preview-card">
          <div class="sub-preview-card-title">`;
        if (pClass) html += `<span class="priority-dot ${pClass}"></span>`;
        html += `${esc(card.title)}</div>`;
        if (card.desc) html += `<div class="sub-preview-card-desc">${esc(card.desc)}</div>`;
        if (metaParts.length > 0) html += `<div class="sub-preview-card-meta">${metaParts.join(' · ')}</div>`;
        
        if (card.subBoard) {
          const nestedTotal = card.subBoard.lists.reduce((s, l) => s + l.cards.length, 0);
          html += `<div class="sub-preview-nested">📁 下级子看板（${nestedTotal} 个卡片）</div>`;
        }
        html += `</div>`;
      });
    }
    html += `</div>`;
  });
  return html;
}

    html += `<div class="card-preview-tags">${card.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>`;
  }

  const metaParts = [];
  if (card.priority && card.priority !== 'none') {

    const pcls = PRIORITY[card.priority].cls;
    metaParts.push(`<span class="pri ${pcls}">${pl}优先级</span>`);
  }
  if (card.owner) metaParts.push(`👤 ${esc(card.owner)}`);
  if (card.due) metaParts.push(`📅 ${esc(card.due)}`);
  if (metaParts.length > 0) {
    html += `<div class="card-preview-meta">${metaParts.join('')}</div>`;
  }

  if (card.desc) {
    html += `<div class="card-preview-desc">${esc(card.desc)}</div>`;
  }

  const checklist = card.checklist || [];
  if (checklist.length > 0) {
    const done = checklist.filter(c => c.done).length;
    html += `<div class="card-preview-section-title">☑ 待办清单 (${done}/${checklist.length})</div>`;
    html += `<div class="card-preview-checklist">`;
    checklist.forEach(c => {
      html += `<div class="card-preview-check-item ${c.done ? 'done' : ''}">
        <div class="check-icon">✓</div>
        <div class="check-text">${esc(c.text)}</div>
      </div>`;
    });
    html += `</div>`;
  }

  const atts = card.attachments || [];
  if (atts.length > 0) {
    html += `<div class="card-preview-section-title">📎 附件 (${atts.length})</div>`;
    html += `<div class="card-preview-attachments">`;
    atts.forEach((a, i) => {
      const isLink = a.kind === 'link';
      const icon = isLink ? '🔗' : getFileIcon(a.name, a.type);
      const sizeText = isLink ? '外部链接' : formatFileSize(a.size);
      html += `<div class="card-preview-att-item" data-att-index="${i}">

function previewAttachment(att) {
  if (!att) return;
  if (att.kind === 'link') {
    if (att.url) window.open(att.url, '_blank');
    return;
  }
  if (!att.data) { alert('⚠️ 附件数据缺失'); return; }
  const mime = att.type || '';
  const ln = (att.name || '').toLowerCase();
  if (mime.includes('html') || ln.endsWith('.html') || ln.endsWith('.htm')) return showPreviewFrame(att.data, att.name);
  if (mime.startsWith('image/')) return showPreviewImage(att.data, att.name);
  if (mime === 'application/pdf' || ln.endsWith('.pdf')) return showPreviewFrame(att.data, att.name);
  if (mime.startsWith('text/') || ln.endsWith('.txt') || ln.endsWith('.csv') || ln.endsWith('.md')) return showPreviewFrame(att.data, att.name);
  downloadAttachment(att);
}
function showPreviewImage(dataURL, name) {
  const c = document.getElementById('previewContent');
  c.innerHTML = '';
  const img = document.createElement('img');
  img.src = dataURL;
  c.appendChild(img);
  document.getElementById('previewTitle').textContent = name || '图片';
  document.getElementById('previewOverlay').classList.add('show');
  const ntb = document.getElementById('previewNewTabBtn');
  ntb.dataset.mode = 'image'; ntb.dataset.data = dataURL;
  const dl = document.getElementById('previewDownloadBtn');
  dl.dataset.data = dataURL; dl.dataset.name = name;
}
function showPreviewFrame(dataURL, name) {
  const c = document.getElementById('previewContent');
  c.innerHTML = '<div class="preview-loading">加载中...</div>';
  const blob = dataURLToBlob(dataURL);
  const url = URL.createObjectURL(blob);
  currentPreviewURL = url;
  const iframe = document.createElement('iframe');
  iframe.setAttribute('sandbox', 'allow-same-origin allow-scripts allow-popups allow-forms');
  iframe.src = url;
  c.innerHTML = '';
  c.appendChild(iframe);
  document.getElementById('previewTitle').textContent = name || '预览';
  document.getElementById('previewOverlay').classList.add('show');
  const ntb = document.getElementById('previewNewTabBtn');
  ntb.dataset.mode = 'frame'; ntb.dataset.url = url;
  const dl = document.getElementById('previewDownloadBtn');
  dl.dataset.data = dataURL; dl.dataset.name = name;
}
function downloadAttachment(att) {
  if (!att) return;
  if (att.kind === 'link') { window.open(att.url, '_blank'); return; }
  if (!att.data) { alert('⚠️ 附件数据缺失'); return; }
  const blob = dataURLToBlob(att.data);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = att.name || 'attachment';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function openCard(cardId) {
  const cb = boardStack[boardStack.length - 1];
  for (const l of cb.lists) {
    const card = l.cards.find(c => c.id === cardId);
    if (!card) continue;
    editing = { listId: l.id, cardId };
    mTitle.value = card.title;
    mDesc.value = card.desc || '';
    mTags.value = (card.tags || []).join(', ');
    mPriority.value = card.priority || 'none';
    mDue.value = card.due || '';
    editingChecklist = (card.checklist || []).map(c => ({ ...c }));
    renderChecklistUI();
    editingAttachments = (card.attachments || []).map(a => {
      if (!a.kind) a.kind = (a.url && !a.data) ? 'link' : 'file';
      return { ...a };
    });
    renderAttachmentsUI();
    mList.innerHTML = cb.lists.map(x =>
      `<option value="${x.id}" ${x.id === l.id ? 'selected' : ''}>${esc(x.title)}</option>`
    ).join('');
    mEnterSubBoard.textContent = card.subBoard ? '进入子看板' : '创建子看板';
    mEnterSubBoard.style.display = 'block';
    overlay.classList.add('show');
    setTimeout(() => { mTitle.focus(); mTitle.select(); }, 30);
    return;
  }
}
function closeModal() { overlay.classList.remove('show'); editing = null; }
document.getElementById('mCancel').onclick = closeModal;
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && overlay.classList.contains('show')) closeModal(); });

document.getElementById('mSave').onclick = async () => {
  if (!editing) return;
  const cb = boardStack[boardStack.length - 1];
  const l = cb.lists.find(x => x.id === editing.listId);
  const card = l && l.cards.find(c => c.id === editing.cardId);
  if (!card) return closeModal();
  card.title = mTitle.value.trim() || '未命名卡片';
  card.desc = mDesc.value.trim();
  card.tags = mTags.value.split(/[,，]/).map(s => s.trim()).filter(Boolean);
  card.priority = mPriority.value;
  card.due = mDue.value;
  card.checklist = editingChecklist.filter(c => c.text.trim()).map(c => ({ id: c.id || uid(), text: c.text.trim(), done: !!c.done }));
  card.attachments = editingAttachments.map(a => {
    if (a.kind === 'link') return { id: a.id, kind: 'link', name: a.name, size: 0, type: 'link', url: a.url };
    return { id: a.id, kind: 'file', name: a.name, size: a.size || 0, type: a.type || '', data: a.data || '' };
  });
  const newListId = mList.value;
  if (newListId !== editing.listId) {
    const oldL = cb.lists.find(x => x.id === editing.listId);
    const i = oldL.cards.findIndex(c => c.id === editing.cardId);
    const [mv] = oldL.cards.splice(i, 1);
    const nl = cb.lists.find(x => x.id === newListId);
    if (nl) nl.cards.push(mv);
  }
  closeModal(); render();
  showLoading('保存中...');
  try { await saveStateToDB(state); if (autoSyncEnabled) schedulePush(); }
  finally { hideLoading(); }
};

   看板点击
   ========================================================= */
board.addEventListener('click', e => {
  const up = e.target.closest('[data-act="move-up"]');
  if (up) { e.stopPropagation(); moveCardPriority(up.dataset.cardId, -1); return; }
  const dn = e.target.closest('[data-act="move-down"]');
  if (dn) { e.stopPropagation(); moveCardPriority(dn.dataset.cardId, 1); return; }
  const mv = e.target.closest('[data-act="quick-move"]');
  if (mv) { e.stopPropagation(); openQuickMoveMenu(mv.dataset.cardId); return; }
  const pv = e.target.closest('[data-act="preview-sub"]');
  if (pv) { e.stopPropagation(); openSubPreview(pv.dataset.cardId); return; }
  
  // ★ 从模板添加
  const tplBtn = e.target.closest('[data-act="add-from-template"]');
  if (tplBtn) { e.stopPropagation(); openTemplatePicker(tplBtn.dataset.listId); return; }
  
  const tg = e.target.closest('[data-act="toggle-sub"]');
  if (tg) {
    e.stopPropagation();
    const cb = boardStack[boardStack.length - 1];
    for (const l of cb.lists) {
      const c = l.cards.find(x => x.id === tg.dataset.cardId);
      if (c) { c.isExpanded = !c.isExpanded; break; }
    }
    render(); saveState(); return;
  }
  const sc = e.target.closest('.sub-card-item');
  if (sc) {
    e.stopPropagation();
    const ce = e.target.closest('.card');
    if (ce) {
      const cb = boardStack[boardStack.length - 1];
      for (const l of cb.lists) {
        const c = l.cards.find(x => x.id === ce.dataset.id);
        if (c && c.subBoard) { boardStack.push({ lists: c.subBoard.lists, title: c.title }); render(); break; }
      }
    }
    return;
  }
  const ae = e.target.closest('[data-act]');
  if (ae) {
    const act = ae.dataset.act;
    const listId = ae.dataset.listId || (ae.closest('.list') && ae.closest('.list').dataset.id);
    if (act === 'add-card') { startAddCard(ae.closest('.list'), listId); return; }
    if (act === 'del-list') {
      const cb = boardStack[boardStack.length - 1];
      const l = cb.lists.find(x => x.id === listId);
      if (!l) return;
      if (cb.lists.length <= 1) { alert('至少保留一个列表'); return; }
      if (confirm(`确定删除列表「${l.title}」？`)) {
        cb.lists = cb.lists.filter(x => x.id !== listId);
        render(); saveState();
      }
      return;
    }
    if (act === 'rename-list') {
      const cb = boardStack[boardStack.length - 1];
      const l = cb.lists.find(x => x.id === listId);
      if (!l) return;
      openRenameListModal(listId, l.title);
      return;
    }
  }
  const ce = e.target.closest('.card');
  if (ce) openCard(ce.dataset.id);
});

function startAddCard(listEl, listId) {
  if (!listEl) return;
  const ex = listEl.querySelector('.composer textarea');
  if (ex) { ex.focus(); return; }
  const cardsEl = listEl.querySelector('.cards');
  const composer = document.createElement('div');
  composer.className = 'composer';
  const ta = document.createElement('textarea');
  ta.placeholder = '输入标题，回车添加（Esc 取消）';
  composer.appendChild(ta);
  cardsEl.appendChild(composer);
  ta.focus();
  cardsEl.scrollTop = cardsEl.scrollHeight;
  const commit = () => {
    const v = ta.value.trim();
    if (!v) { composer.remove(); return; }
    const cb = boardStack[boardStack.length - 1];
    const l = cb.lists.find(x => x.id === listId);
    if (!l) return;
    l.cards.push({ id: uid(), title: v, desc: '', tags: [], priority: 'none', due: '', checklist: [], attachments: [], subBoard: null, isExpanded: false });
    render(); saveState();
  };
  ta.addEventListener('keydown', ev => {
    if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); commit(); }
    else if (ev.key === 'Escape') composer.remove();
  });
  ta.addEventListener('blur', () => {
    setTimeout(() => { if (composer.isConnected && !ta.value.trim()) composer.remove(); }, 150);
  });
}

  try {
    const str = JSON.stringify(state);
    const blob = new Blob([str], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    const mb = (blob.size/1024/1024).toFixed(2);
    a.download = `栗子看板备份_${new Date().toISOString().slice(0,10)}_${mb}MB.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    alert(`✅ 已导出，大小约 ${mb} MB`);
  } finally { hideLoading(); }
};

const importFileInput = document.getElementById('importFileInput');
document.getElementById('importBtn').onclick = () => importFileInput.click();
importFileInput.onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  if (!confirm(`导入「${f.name}」将覆盖当前数据，继续吗？`)) { importFileInput.value = ''; return; }
  showLoading('导入中...');
  try {
    const txt = await f.text();
    const d = JSON.parse(txt);
    if (d && Array.isArray(d.boards)) {
      state = d;
    } else if (d && Array.isArray(d.lists)) {
      state = { boards: [{ id: uid(), name: '导入的看板', lists: d.lists }], currentBoardId: null, templates: [] };
      state.currentBoardId = state.boards[0].id;
    } else throw new Error('文件格式错误');
    if (!state.templates) state.templates = [];
    if (!state.currentBoardId || !state.boards.some(b => b.id === state.currentBoardId)) {
      state.currentBoardId = state.boards[0].id;
    }
    state.boards.forEach(b => b.lists.forEach(l => l.cards.forEach(c => {
      if (!c.checklist) c.checklist = [];
      if (!c.attachments) c.attachments = [];
      c.attachments.forEach(a => { if (!a.kind) a.kind = (a.url && !a.data) ? 'link' : 'file'; });
    })));
    syncBoardStack(); renderBoardSelect();
    await saveStateToDB(state);
    render();
    alert('✅ 导入成功！');
  } catch (err) {
    alert('❌ 导入失败：' + err.message);
  } finally { hideLoading(); importFileInput.value = ''; }
};

/* =========================================================
   GitHub 同步 UI
   ========================================================= */
const syncOverlay = document.getElementById('syncOverlay');
const ghTokenInput = document.getElementById('ghTokenInput');
const ghGistInput = document.getElementById('ghGistInput');
const autoSyncCheck = document.getElementById('autoSyncCheck');

document.getElementById('syncBtn').onclick = () => {
  ghTokenInput.value = ghToken;
  ghGistInput.value = ghGistId;
  autoSyncCheck.checked = autoSyncEnabled;
  if (!ghToken || !ghGistId) {
    setSyncStatus('ℹ️ 首次使用：\n1. 生成 GitHub Token（gist 权限）\n2. 创建 Gist，文件名 kanban.json，内容 {}\n3. 填入 Token 和 Gist ID\n4. 点「推送」上传当前数据', 'info');
  } else if (_lastSyncTime) {
    setSyncStatus('✅ 上次同步：' + _lastSyncTime.toLocaleString(), 'ok');
  } else {
    setSyncStatus('ℹ️ 已配置。可点「测试」验证，或直接「推送」。', 'info');
  }
  syncOverlay.classList.add('show');
};
document.getElementById('syncCloseBtn').onclick = () => syncOverlay.classList.remove('show');
syncOverlay.addEventListener('click', e => { if (e.target === syncOverlay) syncOverlay.classList.remove('show'); });

document.getElementById('syncSaveConfigBtn').onclick = () => {
  ghToken = ghTokenInput.value.trim();
  ghGistId = ghGistInput.value.trim();
  localStorage.setItem(GH_TOKEN_KEY, ghToken);
  localStorage.setItem(GH_GIST_KEY, ghGistId);
  setSyncStatus('✅ 配置已保存', 'ok');
};
document.getElementById('testConnBtn').onclick = () => {
  ghToken = ghTokenInput.value.trim();
  ghGistId = ghGistInput.value.trim();
  localStorage.setItem(GH_TOKEN_KEY, ghToken);
  localStorage.setItem(GH_GIST_KEY, ghGistId);
  testConnection();
};
autoSyncCheck.onchange = () => {
  autoSyncEnabled = autoSyncCheck.checked;
  localStorage.setItem(AUTO_SYNC_KEY, autoSyncEnabled ? '1' : '0');
  if (autoSyncEnabled && ghToken && ghGistId) pushToCloud({ silent: true });
};
document.getElementById('syncPushBtn').onclick = () => {
  ghToken = ghTokenInput.value.trim();
  ghGistId = ghGistInput.value.trim();
  localStorage.setItem(GH_TOKEN_KEY, ghToken);
  localStorage.setItem(GH_GIST_KEY, ghGistId);
  pushToCloud();
};
document.getElementById('syncPullBtn').onclick = () => {
  ghToken = ghTokenInput.value.trim();
  ghGistId = ghGistInput.value.trim();
  localStorage.setItem(GH_TOKEN_KEY, ghToken);
  localStorage.setItem(GH_GIST_KEY, ghGistId);
  if (!confirm('拉取会用云端数据覆盖本地，确定吗？')) return;
  pullFromCloud();
};

/* =========================================================
   初始化
   ========================================================= */
async function init() {
  showLoading('加载数据...');
  try {
    await openStateDB();
    const dbState = await loadStateFromDB();
    if (dbState && dbState.boards && dbState.boards.length > 0) {
      state = dbState;
    } else {
      const old = localStorage.getItem('chestnut-kanban-v5') || localStorage.getItem('chestnut-kanban-v4');
      if (old) {
        try {
          const d = JSON.parse(old);
          if (d && Array.isArray(d.boards) && d.boards.length > 0) state = d;
          else if (d && Array.isArray(d.lists)) {
            state = { boards: [{ id: uid(), name: '我的看板', lists: d.lists }], currentBoardId: null, templates: [] };
            state.currentBoardId = state.boards[0].id;
          }
        } catch (e) {}
      }
      if (!state) state = defaultData();
      if (!state.templates) state.templates = [];
      if (!state.currentBoardId || !state.boards.some(b => b.id === state.currentBoardId)) {
        state.currentBoardId = state.boards[0].id;
      }
      await saveStateToDB(state);
    }
    if (!state.templates) state.templates = [];
    state.boards.forEach(b => b.lists.forEach(l => l.cards.forEach(c => {
      if (!c.checklist) c.checklist = [];
      if (!c.attachments) c.attachments = [];
      c.attachments.forEach(a => { if (!a.kind) a.kind = (a.url && !a.data) ? 'link' : 'file'; });
    })));
  } catch (e) {
    console.error(e);
    state = defaultData();
    state.currentBoardId = state.boards[0].id;
  }
  syncBoardStack();
  renderBoardSelect();
  render();
  hideLoading();
}
init();
</script>
